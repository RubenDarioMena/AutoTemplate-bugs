    /* ================= TOKENS DE TEMA ================= */

    /* ---------- Base ---------- */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    a { color: var(--accent-text); }
    a:hover { color: var(--primary); }
    /* Botones: jerarquía clara en 3 niveles.
       - normal: superficie + borde visible
       - .primary: naranja sólido (una sola acción principal por zona)
       - .danger: rojo delineado (destructivo, nunca se confunde con primario) */
    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border-strong);
      background: var(--surface);
      padding: 5px 12px;
      border-radius: 4px;
      color: var(--text);
    }
    button:hover { background: var(--surface-2); border-color: var(--primary); }
    button:active { background: var(--surface-3); }
    button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    button:disabled { cursor: not-allowed; opacity: 0.5; }
    button.primary {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary-border);
      font-weight: 700;
    }
    button.primary:hover { background: var(--primary-hover); border-color: var(--primary-border); }
    button.primary:active { background: var(--primary-active); }
    button.danger {
      background: transparent;
      color: var(--danger);
      border-color: var(--danger-border);
    }
    button.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    input[type="text"], input[type="number"], textarea, select {
      font-family: inherit;
      font-size: 12px;
      padding: 5px 8px;
      border: 1px solid var(--field-border);
      border-radius: 4px;
      background: var(--field-bg);
      color: var(--field-text);
      width: 100%;
    }
    input::placeholder, textarea::placeholder { color: var(--field-placeholder); }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--focus-ring);
    }
    textarea {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      resize: vertical;
      min-height: 60px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-text);
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    label .req { color: var(--danger); font-size: 10px; font-weight: 700; }
    .field-head { display: flex; align-items: center; }
    .field-head > label { flex: 1; }
    .field { margin-bottom: 8px; position: relative; }
    .field.invalid input,
    .field.invalid textarea,
    .field.invalid select {
      border-color: var(--danger);
      box-shadow: 0 0 0 2px var(--danger-ring);
    }
    .field-error {
      display: none;
      color: var(--danger-text);
      font-size: 10px;
      font-weight: 600;
      margin-top: 2px;
      line-height: 1.3;
    }
    .field.invalid .field-error { display: block; }
    .field-help {
      font-size: 10px;
      color: var(--text-3);
      margin-top: 2px;
      line-height: 1.3;
    }

    /* ---------- Barra superior ---------- */
    .top-tabs {
      display: flex;
      background: var(--topbar);
      padding: 0 8px;
      height: 34px;
      align-items: stretch;
      user-select: none;
      flex: 0 0 auto;
    }
    .top-tab {
      padding: 0 16px;
      display: flex;
      align-items: center;
      color: var(--topbar-text);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: 500;
      white-space: nowrap;
    }
    .top-tab:hover { color: #fff; }
    .top-tab.active {
      color: #fff;
      background: var(--topbar-active);
      border-bottom-color: var(--primary);
    }
    .top-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--topbar-text-dim);
      font-size: 11px;
    }
    .top-right button { font-size: 11px; padding: 3px 10px; }
    /* Botones dentro de la barra oscura: fantasma, para no competir con el primario */
    .top-right > .menu-wrap > button, .top-right > button:not(.primary) {
      background: transparent;
      color: var(--topbar-text);
      border-color: var(--topbar-border);
    }
    .top-right > .menu-wrap > button:hover, .top-right > button:not(.primary):hover {
      background: rgba(255,255,255,0.10);
      border-color: var(--primary);
      color: #fff;
    }
    .save-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      white-space: nowrap;
    }
    .save-indicator .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .save-indicator.saved { background: #064e3b; color: #a7f3d0; }
    .save-indicator.saved .dot { background: #10b981; }
    .save-indicator.saving { background: #78350f; color: #fde68a; }
    .save-indicator.saving .dot { background: #f59e0b; }
    .save-indicator.unsaved { background: #7f1d1d; color: #fecaca; }
    .save-indicator.unsaved .dot { background: #ef4444; }
    .config-chip {
      background: #793311;
      color: #fed7aa;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      white-space: nowrap;
      display: none;
    }
    .config-chip.visible { display: inline-block; }

    /* ---------- Menús desplegables de la barra superior ---------- */
    .menu-wrap { position: relative; }
    .menu-pop {
      position: absolute;
      right: 0;
      top: calc(100% + 4px);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      box-shadow: var(--shadow-pop);
      z-index: 300;
      min-width: 230px;
      display: none;
      padding: 4px;
    }
    .menu-wrap.open .menu-pop { display: block; }
    .menu-pop button {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: none;
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 12px;
      color: var(--text);
    }
    .menu-pop button:hover { background: var(--accent-soft); color: var(--accent-text); }
    .menu-pop button.danger { color: var(--danger); }
    .menu-pop button.danger:hover { background: var(--danger-soft); color: var(--danger); }
    .menu-pop .sep { border-top: 1px solid var(--border-soft); margin: 4px 0; }

    /* ---------- Tiles de estado ---------- */
    .tiles-bar {
      position: relative;
      padding: 4px 26px 4px 8px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-soft);
      flex: 0 0 auto;
    }
    .tiles-bar.hidden { display: none; }
    .tiles-wrap { display: flex; flex-direction: column; gap: 3px; }
    .tiles-band {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 4px;
      max-height: 74px;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .tiles-band.band-custom { border-top: 1px dashed var(--border); padding-top: 4px; }
    .tiles-bar.collapsed .tiles-band {
      flex-wrap: nowrap;
      max-height: 24px;
      overflow-x: auto;
      overflow-y: hidden;
    }
    .tiles-toggle {
      position: absolute;
      top: 3px;
      right: 4px;
      width: 18px;
      height: 18px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .tiles-toggle:hover { background: var(--accent-soft); color: var(--accent-text); }
    .tiles-toggle .chev { transition: transform .15s; display: inline-block; }
    .tiles-bar.collapsed .tiles-toggle .chev { transform: rotate(-90deg); }

    .tile {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .tile.ok {
      background: var(--tile-ok-bg); color: var(--tile-ok-fg); border-color: var(--tile-ok-br);
      cursor: default;
    }
    .tile.no-target { cursor: default; }
    .tile.sev-error { font-weight: 600; }
    .tile[data-target]:hover { filter: brightness(0.96); }
    html[data-theme="dark"] .tile[data-target]:hover { filter: brightness(1.25); }
    .tiles-focus .tile:not(.tile-hot) { opacity: .28; }
    .tile-hot { box-shadow: 0 0 0 2px currentColor; opacity: 1 !important; }

    /* ---------- Sub-pestañas (instancias) ---------- */
    .sub-tabs {
      display: flex;
      background: var(--surface-3);
      border-bottom: 1px solid var(--border);
      padding: 0 4px;
      align-items: stretch;
      min-height: 28px;
      user-select: none;
      flex: 0 0 auto;
    }
    .sub-tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px 4px 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      margin-right: 2px;
      margin-top: 3px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-2);
      max-width: 160px;
      white-space: nowrap;
      overflow: hidden;
    }
    .sub-tab.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: inset 0 2px 0 var(--primary);
    }
    .sub-tab .label { overflow: hidden; text-overflow: ellipsis; }
    .sub-tab .tab-action {
      width: 16px; height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      font-size: 11px;
      line-height: 1;
      color: var(--text-3);
      flex: 0 0 auto;
    }
    .sub-tab .tab-action:hover { background: var(--surface-3); color: var(--text); }
    .sub-tab .close {
      width: 16px; height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      font-size: 14px;
      line-height: 1;
      color: var(--text-3);
    }
    .sub-tab .close:hover { background: var(--danger-soft); color: var(--danger); }
    .sub-tab .dirty-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      display: none;
    }
    .sub-tab.dirty .dirty-dot { display: inline-block; }
    .sub-tab-new {
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 16px;
      color: var(--text-2);
      cursor: pointer;
      align-self: center;
      margin-top: 3px;
      height: 22px;
    }
    .sub-tab-new:hover { color: var(--primary); }

    /* ---------- Split principal ---------- */
    #subTabsAndMain {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .main {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }
    .form-col {
      width: 50%;
      min-width: 380px;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      min-height: 0;
      overflow: hidden;
      transition: width .18s ease;
    }
    .form-col.form-collapsed { width: 34px; min-width: 0; flex: 0 0 34px; }
    .form-col.form-collapsed .form-panel { display: none; }
    .form-col.form-collapsed .form-search { display: none; }
    .form-col.form-collapsed .form-toolbar { padding: 6px 4px; justify-content: center; }
    .form-col.form-collapsed .form-toolbar > *:not(#formCollapseBtn) { display: none; }
    .form-col.form-collapsed #formCollapseBtn .chev { transform: rotate(180deg); }
    .form-rail-label { display: none; }
    .form-col.form-collapsed .form-rail-label {
      display: block;
      writing-mode: vertical-rl;
      margin: 10px auto 0;
      color: var(--text-2);
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px;
      user-select: none;
      white-space: nowrap;
    }
    .form-output-resizer {
      flex: 0 0 6px;
      align-self: stretch;
      cursor: col-resize;
      background: var(--surface-3);
      border-left: 1px solid var(--border-soft);
      border-right: 1px solid var(--border-soft);
      position: relative;
      z-index: 2;
      touch-action: none;
    }
    .form-output-resizer::after {
      content: "";
      position: absolute;
      inset: 0 2px;
      background: var(--border);
      transition: background .14s ease;
    }
    .form-output-resizer:hover::after,
    .main.split-resizing .form-output-resizer::after { background: var(--primary); }
    .form-col.form-collapsed + .form-output-resizer { display: none; }
    .main.split-resizing .form-col { transition: none; }
    body.split-resizing, body.split-resizing * {
      cursor: col-resize !important;
      user-select: none !important;
    }
    .form-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--surface-2);
      flex: 0 0 auto;
    }
    .form-toolbar h3 {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-text);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .form-toolbar .edit-toggle { margin-left: auto; }
    .form-toolbar .edit-toggle.active {
      background: var(--primary);
      color: var(--primary-text);
      border-color: var(--primary-border);
      font-weight: 700;
    }
    .form-search {
      display: none;
      align-items: center;
      gap: 5px;
      padding: 6px 16px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--surface-2);
    }
    .form-search.open { display: flex; }
    .form-search input { min-width: 0; flex: 1 1 110px; padding: 4px 6px; font-size: 11px; }
    .form-search button { padding: 4px 7px; font-size: 11px; white-space: nowrap; }
    .form-search-status { color: var(--text-3); font-size: 10px; white-space: nowrap; }
    .drag-mode-toggle {
      display: none;
      align-items: center;
      gap: 5px;
      margin: 0;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .drag-mode-toggle input { margin: 0; }
    .form-panel {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      min-height: 0;
    }
    .output-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--surface-2);
      overflow: hidden;
      min-height: 0;
      min-width: 0;
      position: relative;
      transition: flex-basis .18s ease, min-width .18s ease;
    }
    .output-panel-collapse {
      position: absolute;
      z-index: 5;
      top: 50%;
      right: 0;
      width: 28px;
      height: 42px;
      padding: 0;
      transform: translateY(-50%);
      border-color: var(--primary-border);
      border-radius: 5px 0 0 5px;
      color: var(--primary-text);
      background: var(--primary);
      box-shadow: -2px 2px 7px rgba(58, 30, 8, .22);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }
    .output-panel-collapse:hover { background: var(--primary-hover); }
    .output-panel.output-collapsed {
      flex: 0 0 34px;
      min-width: 34px;
    }
    .output-panel.output-collapsed .output-body,
    .output-panel.output-collapsed .media-panel { display: none; }
    .output-panel.output-collapsed .output-panel-collapse {
      right: 0;
      border-radius: 5px 0 0 5px;
    }
    .main.output-collapsed .form-output-resizer { display: none; }
    .main.output-collapsed .form-col:not(.form-collapsed) {
      width: auto !important;
      min-width: 0 !important;
      flex: 1 1 auto !important;
    }
    .output-body {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .output-textarea-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 8px 8px 12px 16px;
      min-width: 0;
      position: relative;
    }
    .output-textarea-wrap textarea { flex: 1; }
    .output-preview {
      display: none;
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 9px 10px;
      border: 1px solid var(--field-border);
      border-radius: 4px;
      background: var(--field-bg);
      color: var(--field-text);
      font-size: 12px;
      line-height: 1.5;
    }
    .output-textarea-wrap.previewing > #outputTextarea { display: none; }
    .output-textarea-wrap.previewing .output-preview { display: block; }
    .output-textarea-wrap.notebook-closed > textarea,
    .output-textarea-wrap.notebook-closed > .output-preview { margin-bottom: 30px; }
    .output-preview p { margin: 0 0 7px; white-space: pre-wrap; }
    .output-preview .preview-spacer { height: 7px; }
    .output-preview ul, .output-preview ol { margin: 0 0 7px 20px; padding: 0; }
    .output-preview li { margin: 2px 0; }
    .output-preview a { overflow-wrap: anywhere; }
    .output-preview .jira-preview-link {
      color: var(--tile-blue-fg);
      text-decoration: underline;
      text-underline-offset: 2px;
      overflow-wrap: anywhere;
    }
    .output-preview code {
      padding: 1px 3px;
      border-radius: 3px;
      background: var(--surface-3);
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
    }
    .output-preview pre {
      margin: 0 0 7px;
      padding: 8px 10px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface-3);
      white-space: pre;
    }
    .output-preview pre code { padding: 0; background: transparent; font-size: 11px; }
    .output-preview-empty { color: var(--text-3); font-style: italic; }
    .output-label { display: flex; align-items: center; gap: 7px; }
    .output-preview-hint {
      color: var(--text-3);
      font-size: 10px;
      font-style: italic;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
    }
    .output-disconnect-badge {
      display: none;
      padding: 1px 5px;
      border: 1px solid var(--danger-border);
      border-radius: 3px;
      color: var(--danger-text);
      background: var(--danger-soft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .01em;
      text-transform: none;
    }
    .output-disconnect-badge.visible { display: inline-block; }
    .output-notes {
      position: absolute;
      z-index: 2;
      left: 16px;
      right: 8px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .18);
    }
    .output-notes.half { height: calc(50% - 14px); }
    .output-notes.full { top: 30px; }
    .output-notes.closed { box-shadow: none; }
    .output-notes.closed .output-notes-body { display: none; }
    .output-notes.closed #notebookCloseBtn { display: none; }
    .output-notes-bar {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 28px;
      padding: 3px 4px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--surface-2);
    }
    #notebookTabs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow-x: auto; }
    .notebook-tab-wrap { display: inline-flex; align-items: center; }
    .output-notes-tab {
      max-width: 150px;
      overflow: hidden;
      padding: 3px 7px;
      border: 1px solid transparent;
      border-radius: 3px;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      background: transparent;
    }
    .output-notes-tab:hover { color: var(--text); background: var(--accent-soft); }
    .output-notes-tab.active { color: var(--primary); border-color: var(--border); background: var(--surface); }
    .notebook-tab-close { width: 17px; height: 17px; padding: 0; margin-left: -3px; border: 0; color: var(--text-3); background: transparent; line-height: 1; }
    .notebook-tab-close:hover { color: var(--danger); }
    .notebook-tab-edit { width: 17px; height: 17px; padding: 0; margin-left: -2px; border: 0; color: var(--text-3); background: transparent; line-height: 1; }
    .notebook-tab-edit:hover { color: var(--primary); }
    .output-notes-spacer { flex: 1; }
    .output-notes-control {
      width: 21px;
      height: 21px;
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: var(--text-3);
      font-size: 13px;
      line-height: 1;
    }
    .output-notes-control:hover, .output-notes-control.active { color: var(--primary); border-color: var(--border); background: var(--surface); }
    .output-notes-body { display: flex; flex: 1; min-height: 0; padding: 7px; }
    .output-notes-body textarea { display: block; flex: 1; width: 100%; min-height: 0; resize: none; border: 0; outline: 0; box-shadow: none; }
    .output-side {
      flex: 0 0 148px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 12px 12px 4px;
      overflow: hidden;
      min-width: 0;
      transition: flex-basis .18s ease;
    }
    .output-side .rail-btn { align-self: flex-end; }
    .output-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }
    .output-actions button { width: 100%; }
    .output-preview-controls {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-top: 2px;
      border-top: 1px solid var(--border-soft);
    }
    .output-preview-switch {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      margin: 0;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
      cursor: pointer;
    }
    .output-preview-switch input { position: absolute; opacity: 0; pointer-events: none; }
    .output-preview-switch-track {
      position: relative;
      width: 38px;
      height: 21px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--border-strong);
      transition: background .16s ease;
    }
    .output-preview-switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(0,0,0,.22);
      transition: transform .16s ease;
    }
    .output-preview-switch input:checked + .output-preview-switch-track { background: var(--primary); }
    .output-preview-switch input:checked + .output-preview-switch-track::after { transform: translateX(17px); }
    .output-preview-switch input:focus-visible + .output-preview-switch-track { outline: 2px solid var(--primary); outline-offset: 2px; }
    .output-side.actions-collapsed { flex-basis: 30px; }
    .output-side.actions-collapsed .output-actions,
    .output-side.actions-collapsed .output-preview-controls { display: none; }
    .output-side.actions-collapsed .rail-btn { align-self: center; }
    .output-side.actions-collapsed .rail-btn .chev { transform: rotate(180deg); }

    /* ---------- Panel de nombres de media ---------- */
    .media-panel {
      border-top: 1px solid var(--border);
      background: var(--surface-2);
      padding: 8px 16px 10px 16px;
      flex: 0 0 auto;
    }
    .media-panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .media-panel-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .18s ease;
    }
    .media-panel-body-inner { overflow: visible; min-height: 0; }
    .media-panel.collapsed .media-panel-body-inner { overflow: hidden; }
    .media-panel.collapsed .media-panel-body { grid-template-rows: 0fr; }
    .media-panel.collapsed .media-panel-header { margin-bottom: 0; }
    .media-panel.collapsed #mediaCollapseBtn .chev { transform: rotate(-90deg); }
    .media-panel-header h4 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-text);
      letter-spacing: 0.4px;
    }
    .media-panel-header .hint {
      font-size: 10px;
      color: var(--text-3);
      font-style: italic;
    }
    .media-row {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }
    .media-row:last-child { margin-bottom: 0; }
    .media-row .media-type {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-text);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .media-id, .field-id-hint {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      color: var(--text-3);
      font-weight: 600;
      letter-spacing: 0;
      text-transform: none;
    }
    .media-id { display: none; }
    body.editing .media-row {
      grid-template-columns: 58px 120px minmax(0, 1fr) auto;
    }
    body.editing .media-id { display: block; }
    .field-id-hint {
      display: none;
      margin-left: 5px;
      padding: 1px 4px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface-2);
      vertical-align: 1px;
    }
    body.editing .field-id-hint { display: inline; }
    .media-row input[type="text"] {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      padding: 3px 6px;
    }
    .media-row input.media-type-input {
      font-family: inherit;
      font-weight: 600;
      color: var(--accent-text);
    }
    .media-row button { font-size: 11px; padding: 2px 8px; }
    .media-row-actions { display: flex; gap: 4px; align-items: center; }
    .media-row-actions .row-del {
      border: none;
      background: none;
      color: var(--text-3);
      font-size: 13px;
      padding: 0 6px;
    }
    .media-row-actions .row-del:hover { background: var(--danger-soft); color: var(--danger); }
    .media-row .media-type-ac { position: relative; }
    .media-row .media-type-ac .autocomplete-list { min-width: 180px; }
    .add-media-btn { margin-top: 8px; font-size: 11px; padding: 3px 10px; }
    .media-preview {
      margin-top: 6px;
      padding: 4px 6px;
      background: var(--surface);
      border: 1px dashed var(--border-strong);
      border-radius: 3px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 10px;
      color: var(--text-2);
      min-height: 14px;
      line-height: 1.4;
      word-break: break-all;
    }
    .media-preview:empty { display: none; }

    /* ---------- Secciones del formulario ---------- */
    /* Código de colores: la sección "cierra" en naranja por abajo y por la
       derecha, con una sombra naranja ligera en esa misma dirección. */
    .form-section {
      margin-bottom: 18px;
      padding: 0 10px 8px 0;
      border-right: 2px solid var(--accent-soft-border);
      border-bottom: 2px solid var(--accent-soft-border);
      border-radius: 0 0 10px 0;
      box-shadow: 6px 6px 14px -6px var(--sec-glow);
    }
    .form-section h4 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent-text);
      letter-spacing: 0.5px;
      padding-bottom: 4px;
      border-bottom: 2px solid var(--accent-soft-border);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sec-collapse {
      flex: 0 0 auto;
      width: 18px; height: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 10px; line-height: 1;
      cursor: pointer;
    }
    .sec-collapse:hover { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-soft-border); }
    .sec-collapse .chev { display: inline-block; transition: transform .18s ease; }
    .form-section.collapsed .sec-collapse .chev { transform: rotate(-90deg); }
    .sec-label { flex: 0 1 auto; }
    .form-section-body {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows .18s ease;
    }
    /* visible: los dropdowns pueden salirse de su sección sin recortarse.
       Colapsada vuelve a hidden (si no, el contenido se seguiría pintando). */
    .form-section-body-inner { overflow: visible; min-height: 0; }
    .form-section.collapsed .form-section-body-inner { overflow: hidden; }
    .form-section.collapsed .form-section-body { grid-template-rows: 0fr; }
    .form-section.collapsed h4 { margin-bottom: 0; }

    /* Identidad visual de los campos: esquina inferior-izquierda con un color
       por tipo (borde lateral más grueso que el inferior + gradiente sutil
       desde esa esquina). Sin sombra: el brillo rojo de error debe dominar. */
    #formPanel .field {
      border-left: 3px solid transparent;
      border-bottom: 1px solid transparent;
      border-radius: 0 0 0 8px;
      padding: 0 0 4px 7px;
    }
    #formPanel .field.ft-text         { border-color: var(--tile-blue-br);   background: linear-gradient(45deg, var(--tile-blue-bg) 0%,   transparent 30%); }
    #formPanel .field.ft-textarea     { border-color: var(--tile-cyan-br);   background: linear-gradient(45deg, var(--tile-cyan-bg) 0%,   transparent 30%); }
    #formPanel .field.ft-autocomplete { border-color: var(--tile-violet-br); background: linear-gradient(45deg, var(--tile-violet-bg) 0%, transparent 30%); }
    #formPanel .field.ft-keywords     { border-color: var(--tile-pink-br);   background: linear-gradient(45deg, var(--tile-pink-bg) 0%,   transparent 30%); }
    #formPanel .field.ft-checkbox     { border-color: var(--tile-amber-br);  background: linear-gradient(45deg, var(--tile-amber-bg) 0%,  transparent 30%); }
    #formPanel .field.ft-checklist    { border-color: var(--tile-green-br);  background: linear-gradient(45deg, var(--tile-green-bg) 0%,  transparent 30%); }
    #formPanel .field.ft-mirror       { border-color: var(--tile-slate-br);  background: linear-gradient(45deg, var(--tile-slate-bg) 0%,  transparent 30%); }
    #formPanel .field.ft-clock        { border-color: var(--tile-cyan-br);   background: linear-gradient(45deg, var(--tile-cyan-bg) 0%,   transparent 30%); }
    #formPanel .field.ft-date         { border-color: var(--tile-violet-br); background: linear-gradient(45deg, var(--tile-violet-bg) 0%, transparent 30%); }
    #formPanel input.system-value { cursor: default; opacity: .82; }
    /* El rojo de alerta se impone al color del tipo. */
    #formPanel .field.invalid,
    #formPanel .field.rule-flag {
      border-left-color: var(--danger);
      border-bottom-color: var(--danger);
      background: linear-gradient(45deg, var(--danger-soft) 0%, transparent 30%);
    }
    /* Campo señalado por un tile de tipo Error activo: también en rojo. */
    .field.rule-flag input, .field.rule-flag textarea, .field.rule-flag select,
    .field.rule-flag .chips, .field.rule-flag .checklist {
      border-color: var(--danger);
      box-shadow: 0 0 0 2px var(--danger-ring);
    }

    .rail-btn {
      flex: 0 0 auto;
      width: 22px; height: 22px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-2);
      font-size: 12px; line-height: 1;
      cursor: pointer;
    }
    .rail-btn:hover { background: var(--accent-soft); color: var(--accent-text); border-color: var(--accent-soft-border); }
    .rail-btn .chev { display: inline-block; transition: transform .18s ease; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .row-3 > .field.span-2 { grid-column: span 2; }

    /* ---------- Controles del modo edición ---------- */
    .sec-tools, .fld-tools, .add-section-btn, .mirror-field,
    .media-edit-btn, #addSectionTopBtn { display: none; }
    body.editing .media-edit-btn { display: inline-flex; margin-left: 6px; }
    body.editing #addSectionTopBtn { display: inline-block; }
    body.editing .form-toolbar .edit-toggle { margin-left: 0; }
    body.editing .sec-tools { display: inline-flex; gap: 2px; margin-left: auto; }
    body.editing .fld-tools { display: inline-flex; gap: 2px; margin-left: auto; }
    body.editing .add-section-btn { display: block; width: 100%; margin-top: 8px; }
    body.editing .mirror-field { display: block; }
    body.editing .drag-mode-toggle { display: inline-flex; margin-left: auto; }
    .fld-drag-handle { display: none; }
    body.editing.drag-fields .fld-drag-handle { display: inline-block; }
    body.editing.drag-fields [data-fld-up],
    body.editing.drag-fields [data-fld-down] { display: none; }
    body.editing .fld-drag-handle { cursor: grab; }
    body.editing .fld-drag-handle.is-pressed,
    body.field-pointer-dragging,
    body.field-pointer-dragging * { cursor: grabbing !important; user-select: none; }
    body.editing .field.field-drag-source { display: none; }
    .field-drag-ghost {
      position: fixed !important;
      margin: 0 !important;
      z-index: 2500;
      opacity: .86;
      pointer-events: none;
      transform: rotate(-1deg) scale(1.015);
      box-shadow: 0 10px 28px rgba(0,0,0,.24);
      background-color: var(--surface) !important;
      border: 1px solid var(--primary) !important;
      border-radius: 6px !important;
      padding: 8px !important;
      overflow: hidden;
    }
    .field-drag-ghost .fld-tools { display: none !important; }
    .field-drag-ghost::after {
      content: attr(data-drag-label);
      position: absolute;
      top: 4px;
      right: 4px;
      padding: 2px 5px;
      border-radius: 3px;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    #formPanel .field.field-drop-placeholder {
      position: relative;
      margin-bottom: 8px;
      border: 1px dashed var(--primary);
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--primary);
      pointer-events: auto;
    }
    #formPanel .field.field-drop-placeholder::after {
      content: attr(data-drop-label);
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .3px;
      opacity: .85;
    }
    body.editing .form-section.field-drop-at-end {
      outline: 2px dashed var(--primary);
      outline-offset: 2px;
    }
    .tool-btn {
      padding: 0 5px;
      font-size: 11px;
      line-height: 16px;
      height: 18px;
      border-radius: 2px;
      color: var(--text-2);
    }
    .tool-btn:hover { color: var(--text); }
    .tool-btn.del:hover { background: var(--danger-soft); color: var(--danger); }
    .field-copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      margin-left: 5px;
      border-color: transparent;
      background: transparent;
      color: var(--text-3);
      font-size: 13px;
      line-height: 1;
    }
    .field-copy-btn:hover, .field-copy-btn:focus-visible { color: var(--primary); border-color: var(--border); background: var(--surface-2); }
    /* Código de colores de los botones de edición, según lo que hacen:
       mover = azul · agregar = verde · editar = violeta · borrar = rojo. */
    .tool-btn.mv  { background: var(--tile-blue-bg);   color: var(--tile-blue-fg);   border-color: var(--tile-blue-br); }
    .tool-btn.ed  { background: var(--tile-violet-bg); color: var(--tile-violet-fg); border-color: var(--tile-violet-br); }
    .tool-btn.add { background: var(--tile-green-bg);  color: var(--tile-green-fg);  border-color: var(--tile-green-br); font-weight: 700; }
    .tool-btn.del { background: var(--tile-red-bg);    color: var(--tile-red-fg);    border-color: var(--tile-red-br); }
    .tool-btn.mv:hover  { background: var(--tile-blue-bg);   color: var(--tile-blue-fg);   filter: brightness(0.94); }
    .tool-btn.ed:hover  { background: var(--tile-violet-bg); color: var(--tile-violet-fg); filter: brightness(0.94); }
    .tool-btn.add:hover { background: var(--tile-green-bg);  color: var(--tile-green-fg);  filter: brightness(0.94); }
    html[data-theme="dark"] .tool-btn.mv:hover,
    html[data-theme="dark"] .tool-btn.ed:hover,
    html[data-theme="dark"] .tool-btn.add:hover { filter: brightness(1.35); }
    .add-section-btn, #addSectionTopBtn {
      background: var(--tile-green-bg);
      color: var(--tile-green-fg);
      border-color: var(--tile-green-br);
      font-weight: 600;
    }
    .add-section-btn:hover, #addSectionTopBtn:hover {
      background: var(--tile-green-bg);
      border-color: var(--tile-green-fg);
    }
    .mirror-note {
      font-size: 11px;
      color: var(--text-2);
      font-style: italic;
      padding: 4px 6px;
      background: var(--surface-2);
      border: 1px dashed var(--border-strong);
      border-radius: 3px;
    }
    .hidden-tag {
      color: var(--text-3);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      font-size: 10px;
    }
    .cond-table select, .cond-table input[type="text"] {
      font-size: 11px;
      padding: 3px 4px;
    }
    .cond-table td { white-space: nowrap; }
    .cond-then { color: var(--accent-text); font-weight: 700; font-size: 10px; text-transform: uppercase; }
    .cond-expr-cell { white-space: normal; min-width: 320px; }
    .cond-table input.cond-expr {
      width: 100%;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
    }
    .cond-table input.cond-expr.cond-bad {
      border-color: var(--danger);
      background: var(--danger-soft);
    }
    .cond-err {
      color: var(--danger-text);
      font-size: 10px;
      margin-top: 2px;
      min-height: 12px;
      white-space: normal;
    }
    .cond-expr-ac .autocomplete-list {
      right: auto;
      width: max-content;
      min-width: 100%;
      max-width: 520px;
      border-top: 1px solid var(--border-strong);
      border-radius: 3px;
    }
    .cond-expr-ac .autocomplete-item code {
      color: inherit;
      font-size: 11px;
      white-space: nowrap;
    }
    .cond-expr-detail {
      color: var(--text-2);
      font-size: 10px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cond-expr-ac .autocomplete-item.active .cond-expr-detail,
    .cond-expr-ac .autocomplete-item:hover .cond-expr-detail { color: var(--accent-text); }

    /* ---------- Autocomplete ---------- */
    .autocomplete { position: relative; }
    .autocomplete-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .autocomplete-input-wrap input { padding-right: 22px; }
    .autocomplete-arrow {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-2);
      cursor: pointer;
      user-select: none;
      border-radius: 2px;
      font-size: 9px;
      line-height: 1;
    }
    .autocomplete-arrow:hover { background: var(--surface-2); color: var(--text); }
    .autocomplete.open .autocomplete-arrow { color: var(--primary); }
    .autocomplete-list {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      max-height: 200px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-top: none;
      border-radius: 0 0 4px 4px;
      z-index: 50;
      display: none;
      box-shadow: var(--shadow-pop);
    }
    .autocomplete.open .autocomplete-list { display: block; }
    .autocomplete.drop-up .autocomplete-list {
      top: auto;
      bottom: 100%;
      border-top: 1px solid var(--border-strong);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      box-shadow: var(--shadow-pop);
    }
    .autocomplete-empty {
      padding: 4px 8px;
      color: var(--text-3);
      font-size: 11px;
      font-style: italic;
    }
    .autocomplete-item {
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .autocomplete-item:hover,
    .autocomplete-item.active { background: var(--accent-soft); color: var(--accent-text); }
    .autocomplete-item mark {
      background: var(--mark-bg);
      color: inherit;
      font-weight: 600;
    }
    .ac-del {
      visibility: hidden;
      color: var(--text-3);
      padding: 0 4px;
      border-radius: 2px;
      font-size: 12px;
      line-height: 1;
      flex: 0 0 auto;
    }
    .autocomplete-item:hover .ac-del { visibility: visible; }
    .ac-del:hover { background: var(--danger-soft); color: var(--danger); }
    .autocomplete-add {
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--accent-text);
      font-weight: 600;
      border-top: 1px dashed var(--border);
    }
    .autocomplete-add:hover { background: var(--accent-soft); }

    /* ---------- Chips de palabras clave ---------- */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--field-border);
      border-radius: 4px;
      background: var(--field-bg);
      min-height: 30px;
      cursor: text;
      position: relative;
    }
    .chips.invalid { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-ring); }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--chip-bg);
      color: var(--chip-fg);
      padding: 2px 4px 2px 8px;
      border-radius: 12px;
      font-size: 11px;
    }
    .chip button {
      border: none;
      background: transparent;
      color: var(--chip-fg);
      cursor: pointer;
      padding: 0 4px;
      font-size: 13px;
      line-height: 1;
    }
    .chip button:hover { color: var(--danger); }
    /* Chip en conflicto (duplicada o presente en el cuerpo del bug): en rojo,
       así se ven TODAS las palabras problemáticas de un vistazo. */
    .chip.chip-bad {
      background: var(--danger-soft);
      color: var(--danger-text);
      box-shadow: inset 0 0 0 1px var(--danger-border);
    }
    .chip.chip-bad button { color: var(--danger-text); }
    .chips input {
      border: none;
      outline: none;
      flex: 1;
      min-width: 80px;
      font-size: 12px;
      padding: 2px;
      background: transparent;
      color: var(--field-text);
      width: auto;
    }
    .chips-error {
      display: block;
      margin-top: 4px;
      background: var(--danger-soft);
      color: var(--danger-text);
      padding: 4px 8px;
      border-radius: 3px;
      border-left: 3px solid var(--danger);
      font-size: 11px;
    }

    /* ---------- Pestaña DATA ---------- */
    .data-layout {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    .data-sidebar {
      width: 200px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex: 0 0 auto;
    }
    .data-sidebar .item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-2);
      border-bottom: 1px solid var(--border-soft);
    }
    .data-sidebar .item:hover { background: var(--surface-2); }
    .data-sidebar .item.active {
      background: var(--accent-soft);
      color: var(--accent-text);
      font-weight: 600;
      border-left: 3px solid var(--primary);
    }
    .data-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .data-toolbar {
      padding: 8px 12px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .data-table-wrap {
      flex: 1;
      overflow: auto;
      padding: 12px;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.data-table th,
    table.data-table td {
      border: 1px solid var(--border-soft);
      padding: 4px 8px;
      text-align: left;
      vertical-align: top;
    }
    table.data-table th {
      background: var(--surface-2);
      font-weight: 600;
      color: var(--accent-text);
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.3px;
      position: sticky;
      top: -13px;
    }
    table.data-table input[type="text"] {
      border: none;
      padding: 2px;
      width: 100%;
      background: transparent;
      color: var(--text);
    }
    table.data-table input[type="text"]::placeholder { color: var(--text-3); }
    table.data-table input[type="text"]:focus {
      background: var(--field-bg);
      color: var(--field-text);
      outline: 1px solid var(--primary);
      box-shadow: none;
    }
    table.data-table tr:hover { background: var(--surface-2); }
    .orphan { color: var(--danger); font-weight: 600; }
    .row-del {
      border: none;
      background: none;
      color: var(--text-3);
      font-size: 13px;
      padding: 0 6px;
    }
    .row-del:hover { background: var(--danger-soft); color: var(--danger); }

    /* ---------- Pestaña RULES ---------- */
    .rules-layout {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      min-height: 0;
    }
    .rules-layout h3 {
      font-size: 13px;
      margin-bottom: 4px;
      color: var(--accent-text);
    }
    .rules-layout .rules-intro {
      font-size: 12px;
      color: var(--text-2);
      margin-bottom: 12px;
      max-width: 760px;
      line-height: 1.5;
    }
    .rules-block { margin-bottom: 24px; }
    .rules-future {
      border: 1px dashed var(--border-strong);
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 11px;
      color: var(--text-3);
      max-width: 760px;
    }
    td.rules-form-cell { color: var(--text-2); white-space: nowrap; }
    /* Buscador de cada tabla de RULES: filtra filas por texto o regex. */
    .rules-search {
      display: block;
      max-width: 340px;
      margin: 2px 0 8px;
    }

    /* ---------- Modal ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      min-width: 360px;
      max-width: 600px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    .modal.wide { max-width: 780px; width: 740px; }
    .modal h3 { margin-bottom: 12px; font-size: 14px; color: var(--accent-text); }
    .modal-body { margin-bottom: 16px; font-size: 12px; color: var(--text-2); }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal label.checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-2);
      margin-top: 8px;
      text-transform: none;
      letter-spacing: 0;
      font-weight: 400;
    }
    /* Campo tipo casilla sí/no en el formulario */
    .field.checkbox-field { display: flex; flex-direction: column; justify-content: center; }
    .field.checkbox-field label.cb-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
      margin: 6px 0 2px;
    }
    .field.checkbox-field input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--primary); }
    /* Campo checklist: un título y varias casillas, en línea o en columna. */
    .checklist {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      padding: 6px 8px;
      border: 1px solid var(--field-border);
      border-radius: 4px;
      background: var(--field-bg);
    }
    .checklist.ck-col { flex-direction: column; gap: 4px; }
    .checklist label.ck-opt {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
      text-transform: none;
      letter-spacing: 0;
    }
    .checklist label.ck-opt input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; accent-color: var(--primary); }
    .checklist label.ck-opt.ck-all { color: var(--accent-text); font-style: italic; }
    .checklist-add { min-width: 23px; padding: 0 5px; font-size: 14px; line-height: 18px; }
    .checklist-add-input { min-width: 130px; flex: 1 1 150px; }
    .field.invalid .checklist { border-color: var(--danger); box-shadow: 0 0 0 2px var(--danger-ring); }
    .fe-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 14px;
    }
    .fe-tabs {
      grid-column: 1 / -1;
      display: flex;
      gap: 4px;
      padding-bottom: 2px;
      border-bottom: 1px solid var(--border-soft);
    }
    .fe-tab {
      padding: 4px 9px;
      border-color: transparent;
      color: var(--text-2);
      background: transparent;
      font-size: 11px;
      font-weight: 700;
    }
    .fe-tab:hover { color: var(--primary); background: var(--accent-soft); }
    .fe-tab.active { color: var(--primary-text); border-color: var(--primary-border); background: var(--primary); }
    .fe-chip-tab-panel { grid-column: 1 / -1; }
    .fe-chip-tab-panel .fe-chip-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 14px;
    }
    .fe-chip-tab-panel .fe-sep { margin-top: 0; }
    .fe-grid .fe-full { grid-column: 1 / -1; }
    .fe-grid label { margin-top: 4px; }
    .fe-grid label.checkbox { margin-top: 2px; }
    .fe-readonly {
      background: var(--surface-3);
      color: var(--text-2);
      border-color: var(--border);
      cursor: default;
    }
    .fe-readonly:focus {
      background: var(--surface-3);
      border-color: var(--border);
      box-shadow: none;
    }
    .fe-sep {
      grid-column: 1 / -1;
      border-top: 1px solid var(--border-soft);
      padding-top: 6px;
      margin-top: 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-text);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ---------- Banner ---------- */
    .banner {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 2000;

      opacity: 0;
      transform: scale(.93);
      border: 1px solid rgba(56, 245, 255, 0);

    html[data-theme="neon"] #formPanel .field:focus-within {
      z-index: 100;
      transform: translateY(-1px) scale(1.006);

    html[data-theme="neon"] #formPanel .field::after {
      content: "";

      18% { opacity: 1; transform: scale(.985); border-color: rgba(56, 245, 255, .95); box-shadow: 0 0 6px rgba(56, 245, 255, .75), 0 0 14px rgba(255, 43, 214, .42); }
      48% { opacity: .85; transform: scale(1.025); border-color: rgba(255, 43, 214, .75); box-shadow: 0 0 13px rgba(56, 245, 255, .55), 0 0 24px rgba(255, 43, 214, .38), 0 0 38px rgba(56, 245, 255, .14); }
      100% { opacity: 0; transform: scale(1.065); border-color: rgba(255, 43, 214, 0); box-shadow: 0 0 22px rgba(56, 245, 255, 0), 0 0 42px rgba(255, 43, 214, 0); }
    }
    @keyframes neonFieldShockRing {

    html[data-theme="neon"] #formPanel .field:focus-within input,

    html[data-theme="neon"] .rail-btn,

    html[data-theme="neon"] .output-preview,

  <script>
    (function () {
      var APPEARANCE_OPTIONS = {
        languages: ["es", "en"],
        themes: ["light", "dark", "autumn", "neon"]
      };

      window.__BUG_TOOL_APPEARANCE_OPTIONS__ = APPEARANCE_OPTIONS;

      var defaults = { language: "es", theme: "light" };
      var prefs = { language: defaults.language, theme: defaults.theme };
      try {
        var raw = localStorage.getItem("bug_tool_multilanguage_ui_v1");
        if (raw) prefs = Object.assign(prefs, JSON.parse(raw));
        if (!raw) {
          var legacyTheme = localStorage.getItem("bugtool_theme_v1");
          if (legacyTheme === "dark" || legacyTheme === "light") prefs.theme = legacyTheme;
        }
      } catch (e) {}
      if (!APPEARANCE_OPTIONS.languages.includes(prefs.language)) {
        prefs.language = defaults.language;
      }
      if (!APPEARANCE_OPTIONS.themes.includes(prefs.theme)) {
        prefs.theme = defaults.theme;
      }
      document.documentElement.lang = prefs.language;
      document.documentElement.dataset.theme = prefs.theme;
      window.__BUG_TOOL_BOOT_PREFS__ = prefs;
    })();
  </script>
  <!-- MONOLITH:SECTION preferences-bootstrap END -->

<script>

/* MONOLITH:SECTION 01-constants START */
/* ================================================================

   ================================================================
   Guardamos el HTML del archivo TAL COMO ESTÁ EN DISCO antes de que

   reemplaza el bloque JSON #vanillaConfig por la config actual y la
   descarga: así los cambios quedan DENTRO del nuevo .html. */
const PRISTINE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
// Escrito en dos partes para que el parser HTML no corte el script aquí.
const SCRIPT_END = "</scr" + "ipt>";

const APP_META = Object.freeze({

  version: 3,
  exportName: "bug_tool_multilanguage.html"
});
const CONFIG_KEY = "bug_tool_multilanguage_v3_config";

const LEGACY_CONFIG_KEY = "bug_tool_v2_config";
const LEGACY_SESSION_KEY = "bug_tool_v2_session";
const CONFIG_MIGRATION_KEY = "bug_tool_multilanguage_v3_config_migrated";
const SESSION_MIGRATION_KEY = "bug_tool_multilanguage_v3_session_migrated";

const FIELD_TYPES = [
  { id: "text",         labelKey: "catalog.fieldType.text" },
  { id: "textarea",     labelKey: "catalog.fieldType.textarea" },
  { id: "autocomplete", labelKey: "catalog.fieldType.autocomplete" },
  { id: "keywords",     labelKey: "catalog.fieldType.keywords" },

  { id: "clock",        labelKey: "catalog.fieldType.clock" },
  { id: "date",         labelKey: "catalog.fieldType.date" }
];
const SYSTEM_FIELD_FORMATS = {
  clock: [
    ["24h", "catalog.format.clock24"],
    ["12h-am-pm", "catalog.format.clock12"],
    ["12h-am-pm-dots", "catalog.format.clock12Dots"]
  ],
  date: [
    ["dmy-4", "catalog.format.dateDmy4"],
    ["dmy-2", "catalog.format.dateDmy2"],
    ["mdy-4", "catalog.format.dateMdy4"],
    ["en-long", "catalog.format.dateEnLong"],
    ["en-weekday-long", "catalog.format.dateEnWeekday"],
    ["es-long", "catalog.format.dateEsLong"]
  ]
};

function isSystemField(field) {
  return !!field && (field.type === "clock" || field.type === "date");
}

function defaultSystemFormat(type) {
  return type === "date" ? "dmy-4" : "24h";
}

function isKnownSystemFormat(type, format) {
  return (SYSTEM_FIELD_FORMATS[type] || []).some(([id]) => id === format);
}

// Formatos emitidos brevemente por la primera versión de reloj. Se leen
// como sus equivalentes de 12 horas para no romper configs o CSV ya creados.
function normalizeSystemFormat(type, format) {
  if (type === "clock" && format === "24h-am-pm") return "12h-am-pm";
  if (type === "clock" && format === "24h-am-pm-dots") return "12h-am-pm-dots";
  return isKnownSystemFormat(type, format) ? format : defaultSystemFormat(type);
}

function systemFormatOptionsHtml(type, selected) {
  const format = normalizeSystemFormat(type, selected);
  return (SYSTEM_FIELD_FORMATS[type] || []).map(([id, labelKey]) =>
    `<option value="${id}"${id === format ? " selected" : ""}>${escapeHtml(t(labelKey))}</option>`).join("");
}

function formatSystemFieldValue(field, now) {
  const date = now || new Date();
  const pad = n => String(n).padStart(2, "0");
  const hour24 = pad(date.getHours());
  const minute = pad(date.getMinutes());
  const meridiem = date.getHours() < 12 ? "AM" : "PM";
  const format = normalizeSystemFormat(field.type, field.format);
  if (field.type === "clock") {
    if (format === "12h-am-pm") return `${date.getHours() % 12 || 12}:${minute} ${meridiem}`;
    if (format === "12h-am-pm-dots") return `${date.getHours() % 12 || 12}:${minute} ${meridiem === "AM" ? "A.M." : "P.M."}`;
    return `${hour24}:${minute}`;
  }
  const day = pad(date.getDate());
  const month = pad(date.getMonth() + 1);
  const year = date.getFullYear();
  if (format === "dmy-2") return `${day}/${month}/${String(year).slice(-2)}`;
  if (format === "mdy-4") return `${month}/${day}/${year}`;
  if (format === "en-long") return new Intl.DateTimeFormat("en-US", { month: "long", day: "numeric", year: "numeric" }).format(date);
  if (format === "en-weekday-long") return new Intl.DateTimeFormat("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" }).format(date);
  if (format === "es-long") {
    const weekday = new Intl.DateTimeFormat("es-MX", { weekday: "long" }).format(date);
    const monthName = new Intl.DateTimeFormat("es-MX", { month: "long" }).format(date);
    return `${weekday.charAt(0).toUpperCase() + weekday.slice(1)} ${date.getDate()} de ${monthName} del ${year}`;
  }
  return `${day}/${month}/${year}`;
}
const FIELD_SIZES = [
  { id: "full",  labelKey: "catalog.fieldSize.full" },
  { id: "half",  labelKey: "catalog.fieldSize.half" },
  { id: "third", labelKey: "catalog.fieldSize.third" },

];

// Paleta de colores con nombre para los tiles personalizados. Cada uno trae
// fondo (bg), texto (fg) y borde para buen contraste en tema claro. Se usan

function interpolateMessage(template, params) {
  return String(template == null ? "" : template).replace(/\{([A-Za-z0-9_]+)\}/g,
    (match, key) => Object.prototype.hasOwnProperty.call(params || {}, key) ? String(params[key]) : match);
}

function t(key, params) {
  const fallback = UI_MESSAGES.es[key];
  const value = (UI_MESSAGES[appearance.language] && UI_MESSAGES[appearance.language][key]) ?? fallback;
  return interpolateMessage(value === undefined ? key : value, params || {});
}

function tp(key, count, params) {
  const category = new Intl.PluralRules(appearance.language).select(Number(count) || 0);
  const localizedKey = UI_MESSAGES[appearance.language][`${key}.${category}`] !== undefined
    ? `${key}.${category}` : `${key}.other`;
  return t(localizedKey, Object.assign({ count }, params || {}));
}

function validateMessageCatalogs() {
  const baseKeys = Object.keys(UI_MESSAGES.es).sort();
  SUPPORTED_LANGUAGES.forEach(language => {
    const keys = Object.keys(UI_MESSAGES[language] || {}).sort();
    if (keys.join("\n") !== baseKeys.join("\n")) {
      throw new Error(`Catálogo incompleto: ${language}`);
    }
    baseKeys.forEach(key => {
      const placeholders = value => [...String(value).matchAll(/\{([A-Za-z0-9_]+)\}/g)]
        .map(match => match[1]).sort().join("|");
      if (placeholders(UI_MESSAGES.es[key]) !== placeholders(UI_MESSAGES[language][key])) {
        throw new Error(`Placeholders incompatibles: ${language}.${key}`);
      }
    });
  });
}

function translateStaticDom(root) {
  const scope = root || document;
  scope.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  scope.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
  scope.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  scope.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  document.title = t("app.title");
}

function persistAppearance() {
  try { localStorage.setItem(UI_PREFS_KEY, JSON.stringify(appearance)); }
  catch (e) { console.error("persistAppearance", e); }
}

function setTheme(theme, persist) {
  appearance.theme = SUPPORTED_THEMES.includes(theme) ? theme : "light";
  document.documentElement.dataset.theme = appearance.theme;
  const select = $("themeSelect");
  if (select) select.value = appearance.theme;

function setLanguage(language, persist, rerender) {
  appearance.language = SUPPORTED_LANGUAGES.includes(language) ? language : "es";
  document.documentElement.lang = appearance.language;
  translateStaticDom();
  const select = $("languageSelect");
  if (select) select.value = appearance.language;
  if (persist !== false) persistAppearance();
  if (rerender !== false && config) {
    // El idioma pertenece a la interfaz. Conservar exactamente el texto y
    // los segmentos del ticket evita que un re-render traduzca, regenere o
    // conecte de nuevo una edición manual (incluso si hay un input enfocado).
    const instance = getActiveInstance();
    const textarea = $("outputTextarea");
    const outputSnapshot = instance ? {
      output: instance.output,
      outputEdited: instance.outputEdited,
      outputLayoutEdited: instance.outputLayoutEdited,
      outputDetached: deepClone(instance.outputDetached || {}),
      outputSegments: deepClone(instance.outputSegments || []),
      outputRanges: deepClone(instance.outputRanges || {}),
      visibleText: textarea ? textarea.value : instance.output
    } : null;
    refreshAll();
    if (instance && outputSnapshot) {
      instance.output = outputSnapshot.output;
      instance.outputEdited = outputSnapshot.outputEdited;
      instance.outputLayoutEdited = outputSnapshot.outputLayoutEdited;
      instance.outputDetached = outputSnapshot.outputDetached;
      instance.outputSegments = outputSnapshot.outputSegments;
      instance.outputRanges = outputSnapshot.outputRanges;
      if (textarea) {
        textarea.value = outputSnapshot.visibleText;
        renderOutputPreview(outputSnapshot.visibleText);
        renderOutputDisconnectBadge(instance, instance.outputSegments);
      }
    }
    syncCollapseControlLabels();
  }
}

function $(id) { return document.getElementById(id); }

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function newId() {
  return "i_" + Math.random().toString(36).slice(2, 10);
}

function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

const Storage = Object.freeze({
  read(key) {
    try { return localStorage.getItem(key); }
    catch (error) { console.error(`Storage.read(${key})`, error); return null; }
  },
  readJson(key) {
    const raw = this.read(key);
    if (!raw) return null;
    try { return JSON.parse(raw); }
    catch (error) { console.error(`Storage.readJson(${key})`, error); return null; }
  },
  write(key, value) {
    try { localStorage.setItem(key, String(value)); return true; }
    catch (error) { console.error(`Storage.write(${key})`, error); return false; }
  },
  writeJson(key, value) {
    return this.write(key, JSON.stringify(value));
  },
  remove(key) {
    try { localStorage.removeItem(key); return true; }
    catch (error) { console.error(`Storage.remove(${key})`, error); return false; }
  }
});

// Convierte un nombre libre en un id seguro: "Posición de vista" -> "posicionDeVista"
function slugify(label) {
  const clean = String(label || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")  // sin acentos
    .replace(/[^a-zA-Z0-9]+/g, " ").trim();
  if (!clean) return "campo";
  const parts = clean.split(" ");
  return parts[0].toLowerCase() +
    parts.slice(1).map(p => p[0].toUpperCase() + p.slice(1).toLowerCase()).join("");
}

// Los valores que empiezan con "@" son referencias a data.rules.
// Ej.: regex "@coord_re" usa la regla coord_re; default "@default_tz" usa CST.
function resolveRef(v) {
  if (typeof v === "string" && v.startsWith("@")) {
    const key = v.slice(1);
    return config.data.rules[key] != null ? config.data.rules[key] : "";
  }
  return v == null ? "" : v;
}

// En plantillas, separadores y encabezados se puede escribir \n o
// <br> para forzar un salto de línea en el output.
function unescapeNl(s) {
  return String(s == null ? "" : s)
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/\\n/g, "\n");
}

function isoStamp() {
  const d = new Date();
  return d.toISOString().replace(/[:.]/g, "-").slice(0, 19);
}

function fallbackDownloadFile(name, content) {
  const blob = new Blob([content || ""], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function downloadFile(name, content) {
  const text = content || "";
  const ext = String(name).toLowerCase().split(".").pop();
  const fileTypes = {
    csv: { description: t("file.csv"), accept: { "text/csv": [".csv"] } },
    html: { description: t("file.html"), accept: { "text/html": [".html"] } },
    json: { description: t("file.json"), accept: { "application/json": [".json"] } },
    md: { description: t("file.markdown"), accept: { "text/markdown": [".md"] } },
    txt: { description: t("file.text"), accept: { "text/plain": [".txt"] } }
  };

  // File System Access API: permite elegir carpeta y nombre desde un gesto
  // explícito del usuario. El enlace de descarga queda como respaldo para
  // navegadores que todavía no ofrecen el selector nativo.
  if (typeof window.showSaveFilePicker !== "function") {
    fallbackDownloadFile(name, text);
    flashBanner(t("file.downloadFallback", { name }));
    return true;
  }

  try {
    const handle = await window.showSaveFilePicker({
      suggestedName: name,
      ...(fileTypes[ext] ? { types: [fileTypes[ext]] } : {})
    });
    const writable = await handle.createWritable();
    await writable.write(text);
    await writable.close();
    flashBanner(t("file.saved", { name }));
    return true;
  } catch (err) {
    // Cancelar el diálogo no es un error y no debe mostrar una alerta.
    if (err && err.name === "AbortError") return false;
    flashBanner(t("file.saveError", {
      name, error: err && err.message ? err.message : t("file.unknownError")
    }), true);
    return false;
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text || "").then(() => {
    flashBanner(t("clipboard.copied"));
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text || "";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); flashBanner(t("clipboard.copied")); }
    catch (e) { flashBanner(t("clipboard.failed"), true); }
    document.body.removeChild(ta);
  });
}

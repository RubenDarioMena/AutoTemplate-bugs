/* ================================================================
   [3] CONFIG (VANILLA EMBEBIDA + COPIA LOCAL EDITABLE)
   ================================================================
   - `vanilla`: lo que trae el archivo .html (bloque #vanillaConfig).
   - `config`:  la copia con la que se trabaja. Vive en localStorage
     para que los cambios sobrevivan al cerrar el navegador.
   Si config != vanilla se muestra el aviso "Config modificada" para
   recordar exportar la herramienta o los CSV. */
let vanilla = null;
let config = null;

function loadVanillaConfig() {
  const el = $("vanillaConfig");
  vanilla = JSON.parse(el.textContent);
}

function loadConfig() {
  const current = Storage.readJson(CONFIG_KEY);
  const legacy = current || Storage.read(CONFIG_MIGRATION_KEY) === "1"
    ? null : Storage.readJson(LEGACY_CONFIG_KEY);
  const candidate = current || legacy;
  if (candidate && candidate.schema && candidate.data) {
    config = candidate;
    migrateConfig();
    normalizeConfig(config);
    if (legacy) Storage.writeJson(CONFIG_KEY, config);
    Storage.write(CONFIG_MIGRATION_KEY, "1");
    return;
  }
  config = deepClone(vanilla);
  Storage.write(CONFIG_MIGRATION_KEY, "1");
}

// Si esta versión del archivo trae listas/reglas nuevas que la config
// guardada en el navegador no conoce, se completan sin pisar nada.
function migrateConfig() {
  config.data = config.data || {};
  config.data.lists = config.data.lists || {};
  config.data.rules = config.data.rules || {};
  Object.entries(vanilla.data.lists).forEach(([k, v]) => {
    if (!config.data.lists[k]) config.data.lists[k] = deepClone(v);
  });
  Object.entries(vanilla.data.rules).forEach(([k, v]) => {
    if (config.data.rules[k] === undefined) config.data.rules[k] = v;
  });
}

function normalizeConfig(target) {
  if (!target || !target.data || !target.schema || !Array.isArray(target.schema.forms)) {
    throw new Error("Invalid configuration shape");
  }
  migrateListsToTree(target);
  migrateRulesToExpr(target);
  ensureTiles(target);
  return target;
}

// ---- Modelo de listas en árbol (unificado) ----
// config.data.lists      = { id: [valores] }                      // raíces (planas)
// config.data.childLists = { id: { parent, values: {pv:[...]} } } // dependientes
// config.data.listMeta   = { id: { label } }                      // etiqueta opcional
// Cualquier lista (raíz o dependiente) puede ser padre de varias dependientes.
// Una dependiente indexa sus valores por el valor del padre (como POI por Mapa)
// y su `parent` apunta a CUALQUIER lista → profundidad arbitraria.

function listLabel(id) {
  const m = config.data.listMeta && config.data.listMeta[id];
  return (m && m.label) || id;
}
function isChildList(id) { return !!(config.data.childLists && config.data.childLists[id]); }

// Valores que puede tomar una lista (para usarlos como claves de sus hijas).
// Raíz → su arreglo; dependiente → unión ordenada y sin repetir de sus buckets.
function listValues(id) {
  if (config.data.lists[id]) return config.data.lists[id];
  const c = config.data.childLists && config.data.childLists[id];
  if (!c) return [];
  const seen = new Set(), out = [];
  Object.values(c.values || {}).forEach(arr => (arr || []).forEach(v => {
    if (!seen.has(v)) { seen.add(v); out.push(v); }
  }));
  return out;
}
// Listas dependientes cuyo padre directo es `id`.
function childrenOf(id) {
  const cl = config.data.childLists || {};
  return Object.keys(cl).filter(k => cl[k].parent === id);
}
// Todo el subárbol de dependientes bajo `id` (para borrado en cascada).
function descendantLists(id) {
  const out = [];
  (function walk(p) { childrenOf(p).forEach(c => { out.push(c); walk(c); }); })(id);
  return out;
}
// Id nuevo único entre raíces, dependientes y etiquetas.
function uniqueListId(base, d) {
  d = d || config.data;
  base = slugify(base) || "list";
  const taken = (x) => (d.lists && d.lists[x] != null) ||
    (d.childLists && d.childLists[x] != null) || (d.listMeta && d.listMeta[x] != null);
  if (!taken(base)) return base;
  let n = 2; while (taken(base + n)) n++; return base + n;
}

// Migra el modelo viejo (par built-in maps/pois + linkedLists de pares) al
// árbol unificado, y reescribe las fuentes (source) de los campos. Idempotente:
// si ya está migrado (sin marcadores viejos), solo garantiza los contenedores.
function migrateListsToTree(cfg) {
  const d = cfg.data;
  if (!d.lists) d.lists = {};
  if (!d.rules) d.rules = {};
  if (!d.childLists) d.childLists = {};
  if (!d.listMeta) d.listMeta = {};
  const hasLegacy = d.maps !== undefined || d.pois !== undefined ||
    (d.linkedLists && Object.keys(d.linkedLists).length);
  if (!hasLegacy) { delete d.maps; delete d.pois; delete d.linkedLists; return; }

  const legacy = {}; // linkId viejo -> { parentId, childId }
  // Par built-in Mapa/POI → lista raíz "map" + dependiente "poi".
  if (d.maps !== undefined) {
    if (d.lists["map"] == null) d.lists["map"] = Array.isArray(d.maps) ? d.maps : [];
    if (!d.listMeta["map"]) d.listMeta["map"] = { label: "Mapa" };
    if (d.childLists["poi"] == null) d.childLists["poi"] = { parent: "map", values: d.pois || {} };
    if (!d.listMeta["poi"]) d.listMeta["poi"] = { label: "POI" };
    legacy["map"] = { parentId: "map", childId: "poi" };
  }
  // Pares correlacionados del usuario → raíz (padre) + dependiente (hijo).
  Object.keys(d.linkedLists || {}).forEach(x => {
    if (x === "map") return;
    const L = d.linkedLists[x];
    const parentId = uniqueListId(x, d);
    if (d.lists[parentId] == null) d.lists[parentId] = L.parents || [];
    if (!d.listMeta[parentId]) d.listMeta[parentId] = { label: L.parentLabel || parentId };
    const childId = uniqueListId(x + "_hijo", d);
    d.childLists[childId] = { parent: parentId, values: L.children || {} };
    d.listMeta[childId] = { label: L.childLabel || childId };
    legacy[x] = { parentId, childId };
  });
  // Reescribe las fuentes viejas de los campos al formato nuevo.
  (cfg.schema.forms || []).forEach(f => (f.sections || []).forEach(s => (s.fields || []).forEach(fl => {
    const src = fl.source;
    if (typeof src !== "string") return;
    let m;
    if (src === "maps") { if (legacy["map"]) fl.source = "map"; return; }
    if ((m = /^pois:(.+)$/.exec(src))) { if (legacy["map"]) fl.source = "child:poi:" + m[1]; return; }
    if ((m = /^parent:(.+)$/.exec(src))) { const lk = legacy[m[1]]; if (lk) fl.source = lk.parentId; return; }
    if ((m = /^child:([^:]+):(.+)$/.exec(src))) { const lk = legacy[m[1]]; if (lk) fl.source = "child:" + lk.childId + ":" + m[2]; return; }
  })));
  delete d.maps; delete d.pois; delete d.linkedLists;
}

// Encierra un literal en comillas seguras para el lenguaje de expresiones.
function quoteLit(v) {
  v = String(v == null ? "" : v);
  return v.includes('"') ? `'${v}'` : `"${v}"`;
}

// Convierte una condición vieja { field, op, value } a texto de expresión.
function whenToExpr(w) {
  if (!w || !w.field) return "";
  const f = w.field, val = w.value == null ? "" : w.value;
  switch (w.op) {
    case "empty":          return `${f} empty`;
    case "notEmpty":       return `${f} notEmpty`;
    case "equals":         return `${f} = ${quoteLit(val)}`;
    case "notEquals":      return `${f} != ${quoteLit(val)}`;
    case "matches":        return `${f} matches ${String(val).startsWith("@") ? val : quoteLit(val)}`;
    case "equalsField":    return `${f} = ${val}`;
    case "notEqualsField": return `${f} != ${val}`;
    default:               return "";
  }
}

// Normaliza las reglas de todos los formularios a la forma nueva
// (whenExpr: texto). Mantiene retrocompatibilidad: si ya trae whenExpr, no
// toca; si trae `when` viejo, lo convierte y elimina el objeto.
function migrateRulesToExpr(cfg) {
  (cfg.schema.forms || []).forEach(form => {
    (form.rules || []).forEach(r => {
      if (typeof r.whenExpr === "string") { delete r.when; return; }
      if (r.when) { r.whenExpr = whenToExpr(r.when); delete r.when; }
    });
  });
}

function configIsDirty() {
  return JSON.stringify(config) !== JSON.stringify(vanilla);
}

function updateConfigChip() {
  $("configChip").classList.toggle("visible", configIsDirty());
}

/* MONOLITH:SECTION 03-config END */
/* MONOLITH:SECTION 04-schema-helpers START */
/* ================================================================
   [4] HELPERS DE SCHEMA
   ================================================================ */
function getForms() { return config.schema.forms; }

function getForm(formId) {
  return getForms().find(f => f.id === formId) || null;
}

function getSection(form, secId) {
  return form.sections.find(s => s.id === secId) || null;
}

function getField(form, fieldId) {
  for (const sec of form.sections) {
    const idx = sec.fields.findIndex(f => f.id === fieldId);
    if (idx >= 0) return { sec, field: sec.fields[idx], idx };
  }
  return null;
}

function allFields(form) {
  const out = [];
  form.sections.forEach(sec => sec.fields.forEach(f => out.push({ sec, field: f })));
  return out;
}

// Normaliza fuentes viejas de campos al formato nuevo usando el modelo YA
// migrado (para cuando se importa un bug_fields.csv anterior a la iteración 3,
// mientras data.lists/childLists ya está en árbol). Mapea:
//   maps -> map · pois:f -> child:poi:f · parent:X -> X (raíz) ·
//   child:map:f -> child:poi:f · child:X:f -> child:<hija de X>:f (best effort)
function normalizeFieldSources(forms) {
  const childByParent = {};
  Object.keys(config.data.childLists || {}).forEach(id => {
    const p = config.data.childLists[id].parent;
    (childByParent[p] = childByParent[p] || []).push(id);
  });
  (forms || []).forEach(f => (f.sections || []).forEach(s => (s.fields || []).forEach(fl => {
    const src = fl.source; let m;
    if (typeof src !== "string") return;
    if (src === "maps") { fl.source = "map"; return; }
    if ((m = /^pois:(.+)$/.exec(src))) { fl.source = "child:poi:" + m[1]; return; }
    if ((m = /^parent:(.+)$/.exec(src))) { fl.source = m[1]; return; }
    if ((m = /^child:([^:]+):(.+)$/.exec(src))) {
      const link = m[1], field = m[2];
      if (link === "map") { fl.source = "child:poi:" + field; return; }
      if (config.data.childLists && config.data.childLists[link]) return; // ya es dependiente actual
      const kids = childByParent[link];
      if (kids && kids.length) fl.source = "child:" + kids[0] + ":" + field;
    }
  })));
}

// Opciones para la columna "source" de un autocomplete. Devuelve { value, label }.
// Ofrece cada lista raíz (bare id) y, por cada campo del formulario atado a una
// lista L, las listas dependientes cuyo padre es L (como `child:hija:campo`).
// Así se encadena: Región → Mapa (child:mapa:region) → POI (child:poi:mapa).
function sourceOptions(form) {
  const opts = [];
  Object.keys(config.data.lists).forEach(k => opts.push({ value: k, label: configuredText(listLabel(k)) }));
  const cl = config.data.childLists || {};
  allFields(form).forEach(({ field }) => {
    const s = parseSource(field.source);
    const boundList = s.kind === "child" ? s.link : s.list; // lista que muestra este campo
    if (!boundList) return;
    Object.keys(cl).forEach(childId => {
      if (cl[childId].parent === boundList) {
        opts.push({
          value: "child:" + childId + ":" + field.id,
          label: t("schema.field.childSource", {
            child: configuredText(listLabel(childId)), field: configuredText(field.label)
          })
        });
      }
    });
  });
  return opts;
}

function checklistSpecialValue(field) {
  return field.allValue || "__checklist_all__";
}

function checklistExtraOptions(field, inst) {
  if (!inst || !inst.checklistExtras || !Array.isArray(inst.checklistExtras[field.id])) return [];
  return inst.checklistExtras[field.id];
}

function checklistNormalOptions(field, inst) {
  const base = field.source ? optionsForField(field, inst) : (field.options || []);
  const seen = new Set();
  return base.concat(checklistExtraOptions(field, inst)).filter(value => {
    const key = String(value).toLowerCase();
    if (!key || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// Convierte el valor de un padre escalar o multiselección en las keys que
// alimentan una lista dependiente. Una opción especial puede representar
// todos los padres o ninguno sin expandirse dentro del valor guardado.
function dependentParentValues(parentField, raw, child) {
  const values = Array.isArray(raw)
    ? raw.map(String).filter(Boolean)
    : (String(raw == null ? "" : raw).trim() ? [String(raw).trim()] : []);
  if (!parentField || parentField.type !== "checklist" || !parentField.allOption) return values;
  if (!values.includes(checklistSpecialValue(parentField))) return values;
  if ((parentField.allDependency || "all") === "none") return [];
  return ((config.data.lists && config.data.lists[child.parent]) || []).map(String);
}

// Devuelve las opciones actuales de un autocomplete o checklist con fuente.
function optionsForField(field, inst) {
  const src = field.source || "";
  let m;
  if ((m = /^child:([^:]+):(.+)$/.exec(src))) {
    const c = config.data.childLists && config.data.childLists[m[1]];
    if (!c) return [];
    if (!inst) return [];
    const form = getForm(inst.formId);
    const parentFound = form && getField(form, m[2]);
    const parents = dependentParentValues(parentFound && parentFound.field, inst.values[m[2]], c);
    const seen = new Set();
    const out = [];
    parents.forEach(parent => (c.values[parent] || []).forEach(value => {
      const key = String(value).toLowerCase();
      if (!seen.has(key)) { seen.add(key); out.push(value); }
    }));
    return out;
  }
  // Compatibilidad con fuentes viejas (por si entran vía CSV sin migrar).
  if (src === "maps") return config.data.lists["map"] || [];
  if ((m = /^parent:(.+)$/.exec(src))) return config.data.lists[m[1]] || [];
  if ((m = /^pois:(.+)$/.exec(src))) {
    const c = config.data.childLists && config.data.childLists["poi"];
    if (!c || !inst) return [];
    const form = getForm(inst.formId);
    const parentFound = form && getField(form, m[1]);
    const parents = dependentParentValues(parentFound && parentFound.field, inst.values[m[1]], c);
    return [...new Set(parents.flatMap(parent => c.values[parent] || []))];
  }
  return config.data.lists[src] || [];
}

/* MONOLITH:SECTION 05-instances-persistence START */
/* ================================================================
   [5] INSTANCIAS Y PERSISTENCIA
   ================================================================ */
const state = {
  topTab: "",            // id de formulario, "data" o "rules"
  editMode: false,
  instances: [],         // { id, formId, title, values, ticketKey, media, output, outputEdited, errors, dirty }
  activeInstanceId: null,
  dataTab: { selectedCategory: "" },
  prefs: { dontAskOnClose: false, dragFields: false, formSplitRatio: null, outputPreviewMode: "plain" },
  notebook: { tabs: [], activeTabId: "", mode: "closed" }
};

// Cada fila de media tiene un id estable mientras exista. Los ids son slots
// reutilizables: al crear una fila se toma el menor mediaN libre, de modo que
// borrar media1 y crear otra fila vuelve a ofrecer media1 sin renumerar las
// que permanecen. Las sesiones previas guardaban solo strings y se migran
// aquí a { id, type }.
function nextMediaId(rows) {
  const used = new Set((rows || []).map(row => row && row.id)
    .filter(id => /^media[1-9]\d*$/.test(String(id))));
  let n = 1;
  while (used.has("media" + n)) n++;
  return "media" + n;
}

function newMediaRow(rows, form) {
  return { id: nextMediaId(rows), type: defaultMediaType(form) };
}

function normalizeMediaRows(inst, form) {
  const input = Array.isArray(inst.media) ? inst.media : [defaultMediaType(form)];
  const rows = [];
  input.forEach(item => {
    const type = item && typeof item === "object" ? String(item.type == null ? "" : item.type)
      : String(item == null ? "" : item);
    const requestedId = item && typeof item === "object" ? String(item.id || "") : "";
    const id = /^media[1-9]\d*$/.test(requestedId) && !rows.some(row => row.id === requestedId)
      ? requestedId : nextMediaId(rows);
    rows.push({ id, type });
  });
  inst.media = rows;
  return rows;
}

function makeInstance(formId) {
  const form = getForm(formId);
  const values = {};
  allFields(form).forEach(({ field }) => {
    if (field.type === "mirror") return;
    if (field.type === "keywords" || field.type === "checklist") values[field.id] = [];
    else if (isSystemField(field)) values[field.id] = formatSystemFieldValue(field);
    else values[field.id] = resolveRef(field.default || "");
  });
  return {
    id: newId(),
    formId: formId,
    title: configuredText(form.label) + " 1",
    values: values,
    ticketKey: "",
    media: [newMediaRow([], form)],
    output: "",
    outputEdited: false,
    outputLayoutEdited: false,
    outputDetached: {},
    outputSegments: [],
    outputRanges: {},
    checklistExtras: {},
    errors: {},
    dirty: false
  };
}

// Tras editar el schema (agregar campos, importar CSV) las instancias
// viejas pueden no tener todos los ids: aquí se completan.
function ensureInstanceFields(inst) {
  const form = getForm(inst.formId);
  if (!form) return;
  allFields(form).forEach(({ field }) => {
    if (field.type === "mirror") return;
    const isArrayField = field.type === "keywords" || field.type === "checklist";
    if (inst.values[field.id] === undefined) {
      inst.values[field.id] = isArrayField ? []
        : isSystemField(field) ? formatSystemFieldValue(field)
        : resolveRef(field.default || "");
    }
    if (isArrayField && !Array.isArray(inst.values[field.id])) {
      inst.values[field.id] = [];
    }
  });
  if (inst.ticketKey === undefined) inst.ticketKey = "";
  normalizeMediaRows(inst, form);
  if (!inst.checklistExtras || typeof inst.checklistExtras !== "object" || Array.isArray(inst.checklistExtras)) {
    inst.checklistExtras = {};
  }
  Object.keys(inst.checklistExtras).forEach(fieldId => {
    if (!Array.isArray(inst.checklistExtras[fieldId])) delete inst.checklistExtras[fieldId];
  });
  if (!inst.outputDetached || typeof inst.outputDetached !== "object" || Array.isArray(inst.outputDetached)) {
    inst.outputDetached = {};
  }
  if (!Array.isArray(inst.outputSegments)) inst.outputSegments = [];
  if (!inst.outputRanges || typeof inst.outputRanges !== "object" || Array.isArray(inst.outputRanges)) {
    inst.outputRanges = {};
  }
  if (inst.outputLayoutEdited !== true) inst.outputLayoutEdited = false;
  if (!inst.errors) inst.errors = {};
}

// El bloc es global a la herramienta, no a cada pestaña de bug. Al migrar
// sesiones creadas con la versión anterior, conserva la primera nota escrita
// como una pestaña inicial y elimina la copia por instancia.
function normalizeNotebook() {
  const raw = state.notebook && typeof state.notebook === "object" ? state.notebook : {};
  let tabs = Array.isArray(raw.tabs) ? raw.tabs : [];
  if (!tabs.length) {
    const legacy = state.instances
      .filter(inst => String(inst.notes || "").trim())
      .map(inst => `${inst.title || t("instance.defaultTitle")}:\n${inst.notes}`)
      .join("\n\n");
    tabs = [{ id: newId(), title: t("notebook.defaultTitle"), content: legacy }];
  }
  const used = new Set();
  tabs = tabs.map((tab, index) => {
    let id = String(tab && tab.id || "");
    if (!id || used.has(id)) id = newId();
    used.add(id);
    return {
      id,
      title: String(tab && tab.title || t("notebook.noteNumber", { count: index + 1 })).trim()
        || t("notebook.noteNumber", { count: index + 1 }),
      content: String(tab && tab.content || "")
    };
  });
  state.notebook = {
    tabs,
    activeTabId: tabs.some(tab => tab.id === raw.activeTabId) ? raw.activeTabId : tabs[0].id,
    mode: ["closed", "half", "full"].includes(raw.mode) ? raw.mode : "closed"
  };
  state.instances.forEach(inst => { if (inst.notes !== undefined) delete inst.notes; });
}

// Reloj y fecha se toman de la hora local del equipo. Se refrescan al
// regenerar el output y justo antes de copiar, sin convertirlos en campos
// editables para el tester.
function refreshSystemFieldValues(inst) {
  const form = inst && getForm(inst.formId);
  if (!form) return false;
  const now = new Date();
  let changed = false;
  allFields(form).forEach(({ field }) => {
    if (!isSystemField(field)) return;
    const value = formatSystemFieldValue(field, now);
    if (inst.values[field.id] !== value) {
      inst.values[field.id] = value;
      changed = true;
    }
    const input = [...document.querySelectorAll("#formPanel [data-system-value]")]
      .find(el => el.dataset.systemValue === field.id);
    if (input) input.value = value;
  });
  return changed;
}

function getActiveInstance() {
  return state.instances.find(i => i.id === state.activeInstanceId) || null;
}

function nextInstanceTitle(formId, preferredTitle) {
  const form = getForm(formId);
  const base = String(preferredTitle || (form ? configuredText(form.label) : t("instance.defaultTitle"))).trim()
    || t("instance.defaultTitle");
  const titles = new Set(state.instances
    .filter(i => i.formId === formId)
    .map(i => String(i.title || "").trim()));
  if (!titles.has(base)) return base;
  let n = 2;
  while (titles.has(`${base} (${n})`)) n++;
  return `${base} (${n})`;
}

// ---- Guardado en localStorage (debounced) ----
let saveTimer = null;
let lastPersistedConfig = "";
let lastPersistedSession = "";
// true mientras se ejecuta "Borrar todo lo local": bloquea cualquier
// guardado para que beforeunload no re-escriba lo recién borrado.
let suppressSave = false;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  setSaveIndicator("saving");
  saveTimer = setTimeout(() => {
    saveAll();
    setSaveIndicator("saved");
  }, 300);
}

function saveAll() {
  if (suppressSave) return;
  normalizeNotebook();
  const configJson = JSON.stringify(config);
  if (configJson !== lastPersistedConfig && Storage.write(CONFIG_KEY, configJson)) {
    lastPersistedConfig = configJson;
  }
  const sessionJson = JSON.stringify({
    topTab: state.topTab,
    // Los errores son estado derivado y localizado; se recalculan al abrir.
    instances: state.instances.map(({ errors, ...instance }) => instance),
    activeInstanceId: state.activeInstanceId,
    dataTab: state.dataTab,
    prefs: state.prefs,
    notebook: state.notebook
  });
  if (sessionJson !== lastPersistedSession && Storage.write(SESSION_KEY, sessionJson)) {
    lastPersistedSession = sessionJson;
  }
  updateConfigChip();
}

function loadSession() {
  try {
    const current = Storage.readJson(SESSION_KEY);
    const legacy = current || Storage.read(SESSION_MIGRATION_KEY) === "1"
      ? null : Storage.readJson(LEGACY_SESSION_KEY);
    const snap = current || legacy;
    Storage.write(SESSION_MIGRATION_KEY, "1");
    if (!snap) return false;
    if (snap.topTab) state.topTab = snap.topTab;
    if (Array.isArray(snap.instances)) state.instances = snap.instances;
    if (snap.activeInstanceId) state.activeInstanceId = snap.activeInstanceId;
    if (snap.dataTab) state.dataTab = Object.assign(state.dataTab, snap.dataTab);
    if (snap.prefs) state.prefs = Object.assign(state.prefs, snap.prefs);
    if (snap.notebook) state.notebook = snap.notebook;
    if (legacy) Storage.writeJson(SESSION_KEY, snap);
    return true;
  } catch (e) {
    console.error("loadSession", e);
    return false;
  }
}

// Ajusta la sesión al schema actual: quita instancias de formularios que ya
// no existen, completa campos nuevos, corrige la pestaña activa y garantiza
// que el formulario visible tenga una instancia activa válida. Se usa tras
// el boot, importar bug_fields.csv, restaurar vanilla o cargar una sesión.
function ensureSessionConsistency() {
  state.instances = state.instances.filter(i => getForm(i.formId));
  state.instances.forEach(ensureInstanceFields);
  normalizeNotebook();
  if (!getForm(state.topTab) && state.topTab !== "data" && state.topTab !== "rules") {
    state.topTab = getForms()[0].id;
  }
  if (getForm(state.topTab)) {
    const mine = state.instances.filter(i => i.formId === state.topTab);
    if (!mine.length) {
      const inst = makeInstance(state.topTab);
      state.instances.push(inst);
      state.activeInstanceId = inst.id;
    } else if (!mine.some(i => i.id === state.activeInstanceId)) {
      state.activeInstanceId = mine[0].id;
    }
  }
}

function setSaveIndicator(kind) {
  const el = $("saveIndicator");
  el.classList.remove("saved", "saving", "unsaved");
  el.classList.add(kind);
  $("saveIndicatorText").textContent = t(`save.${kind}`);
}

function markInstanceDirty(inst) {
  if (!inst.dirty) { inst.dirty = true; refreshSubTabs(); }
}

function renameInstance(id) {
  const inst = state.instances.find(i => i.id === id);
  if (!inst) return;
  showPromptModal({
    title: t("instance.renameTitle"),
    body: t("instance.renameBody"),
    placeholder: t("instance.renamePlaceholder"),
    initialValue: inst.title || "",
    confirmText: t("common.save"),
    onConfirm: (value) => {
      const title = String(value || "").trim();
      if (!title) { flashBanner(t("instance.nameRequired"), true); return; }
      inst.title = title;
      markInstanceDirty(inst);
      refreshAll();
      scheduleSave();
    }
  });
}

function duplicateInstance(id) {
  const inst = state.instances.find(i => i.id === id);
  if (!inst) return;
  const copy = deepClone(inst);
  const form = getForm(inst.formId);
  copy.id = newId();
  copy.title = nextInstanceTitle(inst.formId, inst.title || (form ? form.label : t("instance.defaultTitle")));
  copy.dirty = true;
  state.instances.push(copy);
  state.activeInstanceId = copy.id;
  refreshAll();
  scheduleSave();
}

      const idInp = $("fe_id");
      if (isNew) {
        const refreshId = () => { idInp.value = uniqueFieldId(form, slugify(labelInp.value.trim())); };
        labelInp.addEventListener("input", refreshId);
        refreshId();
      }
      const fillSources = () => {
        const fieldType = typeSel.value;
        let opts = [];
        if (fieldType === "autocomplete") opts = sourceOptions(form);
        else if (fieldType === "checklist") {
          opts = [{ value: "", label: t("schema.field.sourceWritten") }].concat(sourceOptions(form));
        }
        else if (fieldType === "keywords") {
          opts = [{ value: "", label: t("schema.field.sourceFree") }].concat(sourceOptions(form));
        }
        else if (fieldType === "mirror") {
          opts = [{ value: "", label: t("schema.field.sourceReferences") }]
            .concat(allFields(form)
              .filter(x => !["mirror", "checkbox", "checklist"].includes(x.field.type) && x.field.id !== f.id)
              .map(x => ({ value: x.field.id, label: configuredText(x.field.label) + " {" + x.field.id + "}" })));
        }
        srcSel.disabled = !opts.length;
        srcSel.innerHTML = opts.length
          ? opts.map(o => `<option value="${escapeHtml(o.value)}"${f.source === o.value ? " selected" : ""}>${escapeHtml(o.label)}</option>`).join("")
          : `<option value="">${escapeHtml(t("schema.field.notApplicable"))}</option>`;
      };
      const fillSystemFormats = () => {
        const fieldType = typeSel.value;
        formatSel.innerHTML = isSystemField({ type: fieldType })
          ? systemFormatOptionsHtml(fieldType, f.format)
          : "";
      };
      typeSel.addEventListener("change", fillSources);
      typeSel.addEventListener("change", fillSystemFormats);
      fillSources();
      fillSystemFormats();
      // Casilla sí/no: nada de plantillas, separadores ni validación de
      // texto. Se esconden esas opciones para simplificar la experiencia.
      // El encabezado por línea solo aplica si perLine está activo.
      const perLineChk = $("fe_perLine");
      let activeChipTab = "output";
      const updateChipTab = () => {
        const isKw = typeSel.value === "keywords";
        $("modalBody").querySelectorAll("[data-fe-chip-panel]").forEach(panel => {
          const active = isKw && panel.dataset.feChipPanel === activeChipTab;
          panel.hidden = !active;
          panel.style.display = active ? "" : "none";
        });
        $("modalBody").querySelectorAll("[data-fe-chip-tab]").forEach(tab => {
          const active = tab.dataset.feChipTab === activeChipTab;
          tab.classList.toggle("active", active);
          tab.setAttribute("aria-selected", String(active));
        });
      };
      $("modalBody").querySelectorAll("[data-fe-chip-tab]").forEach(tab => {
        tab.addEventListener("click", () => {
          activeChipTab = tab.dataset.feChipTab;
          updateChipTab();
        });
      });
      const updateChecklistSourceUi = () => {
        const usesData = typeSel.value === "checklist" && !!srcSel.value;
        $("fe_ckOptions").disabled = usesData;
        $("fe_ckOptionsHelp").textContent = usesData
          ? t("schema.field.optionsDataHelp")
          : t("schema.field.optionsLinesHelp");
      };
      const updateAllOptionUi = () => {
        const visible = typeSel.value === "checklist" && $("fe_ckAll").checked;
        $("modalBody").querySelectorAll("[data-ckall-config]").forEach(el => {
          el.style.display = visible ? "" : "none";
        });
      };
      const updateTypeUi = () => {
        const isCb = typeSel.value === "checkbox";
        const isCk = typeSel.value === "checklist";
        const isKw = typeSel.value === "keywords";
        const isSystem = isSystemField({ type: typeSel.value });
        $("modalBody").querySelectorAll("[data-cbhide]").forEach(el => {
          el.style.display = isCb ? "none" : "";
        });
        // La checklist esconde lo que no aplica (regex, chips, separadores...)
        // y muestra su propia sección de opciones.
        $("modalBody").querySelectorAll("[data-ckhide]").forEach(el => {
          el.style.display = isCk ? "none" : "";
        });
        $("modalBody").querySelectorAll("[data-ckshow]").forEach(el => {
          el.style.display = isCk ? "" : "none";
        });
        $("modalBody").querySelectorAll("[data-kwshow]").forEach(el => {
          el.style.display = isKw ? "" : "none";
        });
        $("modalBody").querySelectorAll("[data-kwhide]").forEach(el => {
          el.style.display = isKw ? "none" : "";
        });
        $("modalBody").querySelectorAll("[data-systemhide]").forEach(el => {
          el.style.display = isSystem ? "none" : "";
        });
        $("modalBody").querySelectorAll("[data-systemshow]").forEach(el => {
          el.style.display = isSystem ? "" : "none";
        });
        $("fe_perLineHeaderWrap").style.display = (!isCb && !isCk && !isKw && perLineChk.checked) ? "" : "none";
        const kwLines = isKw && $("fe_kwMode").value === "newline";
        $("modalBody").querySelectorAll("[data-kwjoined]").forEach(el => { el.style.display = isKw && !kwLines ? "" : "none"; });
        $("modalBody").querySelectorAll("[data-kwlines]").forEach(el => { el.style.display = kwLines ? "" : "none"; });
        $("fe_kwHeaderWrap").style.display = kwLines && $("fe_kwPerChip").checked ? "" : "none";
        updateChecklistSourceUi();
        updateAllOptionUi();
        updateChipTab();
      };
      typeSel.addEventListener("change", updateTypeUi);
      srcSel.addEventListener("change", updateChecklistSourceUi);
      $("fe_ckAll").addEventListener("change", updateAllOptionUi);
      perLineChk.addEventListener("change", updateTypeUi);
      $("fe_kwMode").addEventListener("change", updateTypeUi);
      $("fe_kwPerChip").addEventListener("change", updateTypeUi);
      updateTypeUi();
      // Condición de error: autocompletado del lenguaje de RULES y
      // validación en vivo de la sintaxis.
      const condInp = $("fe_condExpr");
      if (condInp) {
        wireCondExprAutocomplete(condInp, form);
        const checkCond = () => {
          const err = exprError(condInp.value, form);
          condInp.classList.toggle("cond-bad", !!err);
          $("fe_condErr").textContent = err;
        };
        condInp.addEventListener("input", checkCond);
        checkCond();
      }
    },
    onConfirm: () => {
      const label = $("fe_label").value.trim();
      if (!label) { flashBanner(t("schema.field.labelRequired"), true); return false; }
      const regexTxt = $("fe_regex").value.trim();
      if (regexTxt) {
        try { new RegExp(resolveRef(regexTxt)); }
        catch (e) { flashBanner(t("schema.field.invalidRegex", { error: e.message }), true); return false; }
      }
      if ($("fe_type").value === "checklist") {
        const opts = $("fe_ckOptions").value.split("\n").map(s => s.trim()).filter(Boolean);
        if (!$("fe_source").value && !opts.length) { flashBanner(t("schema.field.checklistNeedsOptions"), true); return false; }
        if ($("fe_ckAll").checked && !$("fe_ckAllLabel").value.trim()) {
          flashBanner(t("schema.field.specialNeedsText"), true); return false;
        }
      }
      const condExpr = $("fe_condExpr") ? $("fe_condExpr").value.trim() : "";
      if (condExpr) {
        const condErrTxt = exprError(condExpr, form);
        if (condErrTxt) { flashBanner(t("schema.field.invalidCondition", { error: condErrTxt }), true); return false; }
      }
      const targetType = $("fe_type").value;
      const targetId = isNew ? uniqueFieldId(form, slugify(label)) : field.id;
      if (targetType !== "checkbox") {
        const refErrors = templateReferenceErrors($("fe_template").value, form,
          targetType === "mirror" ? "" : targetId);
        if ($("fe_perLine").checked) {
          refErrors.push(...templateReferenceErrors($("fe_perLineHeader").value, form,
            targetType === "mirror" ? "" : targetId));
        }
        if (refErrors.length) {
          flashBanner(t("schema.field.templateErrors", { errors: [...new Set(refErrors)].join("; ") }), true);
          return false;
        }
      }
      const target = isNew ? { id: uniqueFieldId(form, slugify(label)) } : field;
      target.label = label;
      target.type = $("fe_type").value;
      // Solo guardamos las propiedades con contenido para que el
      // schema (y el CSV) queden limpios y legibles.
      const setOrDel = (key, val, emptyVal) => {
        if (val === emptyVal || val === "" || val == null) delete target[key];
        else target[key] = val;
      };
      setOrDel("size", $("fe_size").value, "full");
      setOrDel("source", $("fe_source").disabled ? "" : $("fe_source").value, "");
      setOrDel("default", $("fe_default").value, "");
      setOrDel("rows", parseInt($("fe_rows").value, 10) || 3, 3);
      setOrDel("format", $("fe_format").value, defaultSystemFormat(target.type));
      setOrDel("help", $("fe_help").value.trim(), "");
      setOrDel("template", $("fe_template").value, "{value}");
      // Separador: el checkbox "pegado" fuerza sep = "" (sin separador);
      // si no, texto no vacío = separador propio; vacío = usar el de la sección.
      if ($("fe_glue").checked) target.sep = "";
      else setOrDel("sep", $("fe_sep").value, "");
      setOrDel("emptyAs", $("fe_emptyAs").value.trim(), "");
      setOrDel("omitValue", $("fe_omitValue").value.trim(), "");
      if ($("fe_joinPrev").checked) target.joinPrev = true; else delete target.joinPrev;
      if ($("fe_perLine").checked) target.perLine = true; else delete target.perLine;
      setOrDel("perLineHeader", $("fe_perLineHeader").value, "");
      if (!target.perLine) delete target.perLineHeader;
      if ($("fe_required").checked) target.required = true; else delete target.required;
      if ($("fe_hidden").checked) target.hidden = true; else delete target.hidden;
      setOrDel("regex", regexTxt, "");
      setOrDel("regexMsg", $("fe_regexMsg").value.trim(), "");
      setOrDel("kwCount", $("fe_kwCount").value.trim(), "");
      if ($("fe_kwOverlap").checked) target.kwOverlap = true; else delete target.kwOverlap;
      if (target.type === "keywords") {
        const kwSource = $("fe_source").value;
        setOrDel("source", kwSource, "");
        if ($("fe_kwMode").value === "newline") {
          target.kwMode = "newline";
          if ($("fe_kwPerChip").checked) delete target.kwPerChip; else target.kwPerChip = false;
          setOrDel("kwHeader", $("fe_kwHeader").value, "");
          delete target.kwSep;
        } else {
          delete target.kwMode;
          delete target.kwPerChip;
          delete target.kwHeader;
          setOrDel("kwSep", $("fe_kwSep").value, ", ");
        }
        if ($("fe_kwSpace").checked) target.kwSpace = true; else delete target.kwSpace;
        delete target.perLine;
        delete target.perLineHeader;
      } else {
        ["kwCount", "kwOverlap", "kwMode", "kwSep", "kwPerChip", "kwHeader", "kwSpace"].forEach(k => delete target[k]);
      }
      if (target.type === "mirror") { delete target.required; delete target.regex; }
      if (target.type === "checkbox") {
        // Una casilla sí/no no imprime ni valida texto: se limpian esas
        // propiedades para que el schema quede legible.
        ["source", "default", "rows", "template", "sep", "emptyAs", "omitValue",
         "joinPrev", "perLine", "perLineHeader", "required", "regex", "regexMsg"]
          .forEach(k => delete target[k]);
      }
      if (target.type === "checklist") {
        const ckSource = $("fe_source").value;
        if (ckSource) {
          target.source = ckSource;
          delete target.options;
        } else {
          target.options = $("fe_ckOptions").value.split("\n").map(s => s.trim()).filter(Boolean);
          delete target.source;
        }
        setOrDel("checkTitle", $("fe_ckTitle").value.trim(), "");
        setOrDel("checkSep", $("fe_ckSep").value, ", ");
        if ($("fe_ckLayout").value === "newline") target.checkLayout = "newline"; else delete target.checkLayout;
        if ($("fe_ckAll").checked) {
          target.allOption = true;
          setOrDel("allLabel", $("fe_ckAllLabel").value.trim(), "Todas las anteriores");
          setOrDel("allOutput", $("fe_ckAllOutput").value.trim(), $("fe_ckAllLabel").value.trim());
          if ($("fe_ckAllDependency").value === "none") target.allDependency = "none";
          else delete target.allDependency;
        } else {
          ["allOption", "allLabel", "allOutput", "allDependency", "allValue"].forEach(k => delete target[k]);
        }
        // Lo que no aplica a una checklist se limpia del schema.
        ["default", "rows", "sep", "emptyAs", "omitValue", "joinPrev",
         "perLine", "perLineHeader", "regex", "regexMsg", "kwCount", "kwOverlap",
         "kwMode", "kwSep", "kwPerChip", "kwHeader", "kwSpace"]
          .forEach(k => delete target[k]);
      } else {
        ["options", "checkTitle", "checkSep", "checkLayout", "allOption", "allLabel",
         "allOutput", "allDependency", "allValue"].forEach(k => delete target[k]);
      }
      if (isSystemField(target)) {
        // Son valores siempre disponibles y generados por el navegador; no
        // admiten fuente, default, validación ni tratamiento multilínea.
        ["source", "default", "rows", "emptyAs", "omitValue", "perLine",
         "perLineHeader", "required", "regex", "regexMsg", "kwCount", "kwOverlap",
         "kwMode", "kwSep", "kwPerChip", "kwHeader", "kwSpace"]
          .forEach(k => delete target[k]);
      } else {
        delete target.format;
      }
      // Condición de error rápida: vive como regla normal (action=error) en
      // form.rules, visible y editable también en RULES.
      if (!condRuleAmbiguous && target.type !== "checkbox" && target.type !== "mirror" && $("fe_condExpr")) {
        const condMsg = $("fe_condMsg").value.trim();
        form.rules = form.rules || [];
        const ci = condRule ? form.rules.indexOf(condRule) : -1;
        if (condExpr) {
          if (ci >= 0) {
            form.rules[ci].whenExpr = condExpr;
            form.rules[ci].then.value = condMsg || "Valor inválido";
            form.rules[ci].editorCondition = true;
          } else {
            form.rules.push({ whenExpr: condExpr, editorCondition: true,
              then: { action: "error", field: target.id, value: condMsg || "Valor inválido" } });
          }
        } else if (ci >= 0) {
          form.rules.splice(ci, 1);
        }
      }
      if (isNew) sec.fields.push(target);
      state.instances.forEach(ensureInstanceFields);
      renderForm();
      scheduleSave();
      return true;
    }
  });
}

/* MONOLITH:SECTION 09-schema-editor END */
/* MONOLITH:SECTION 10-validation-rules-tiles START */
/* ================================================================
   [10] VALIDACIÓN, CONDICIONES ENTRE CAMPOS Y TILES DE ESTADO
   ================================================================
   Validaciones por campo (editables en RULES):
     - required: no puede quedar vacío
     - regex: expresión regular literal o @regla de DATA
   Palabras clave (por campo): cantidad exacta o mínima (kwCount acepta
   >=N y @regla), unicidad, y opcionalmente que no aparezcan en el cuerpo
   del bug (kwOverlap).

   CONDICIONES ENTRE CAMPOS (form.rules, editables en RULES):
     { when: { field, op, value }, then: { action, field, value } }
     op:     empty | notEmpty | equals | notEquals | matches (regex/@regla)
     action: show | hide | disable | setDefault
   Ejemplos: si map está vacío o es "global" → ocultar/bloquear POI;
   si shortDescription cumple la regex LOD → mostrar el campo
   "LOD number" (creado con "Oculto por defecto") en Notas; y
   media:media1:type = "Vid" → mostrar un mirror con enlace .mp4. */
function getFormRules(form) {
  return form.rules || [];
}

/* ================================================================
   MOTOR DE EXPRESIONES BOOLEANAS (AND / OR / NOT)
   ================================================================
   La condición de una regla es una EXPRESIÓN de texto anidable. Gramática
   (palabras clave indistintas de may/min):

     expr    := or
     or      := and  ( ("OR"|"||")  and )*
     and     := not  ( ("AND"|"&&") not )*
     not     := ("NOT"|"!") not  |  primary
     primary := "(" expr ")"  |  "@"nombre  |  comparación
     comparación := referencia ( "empty" | "notEmpty"
                          | ("="|"==") operando       // igual
                          | ("!="|"<>") operando       // distinto
                          | ("matches"|"~") operando   // cumple regex/@regla
                          | ("in"|"not in") lista )    // pertenece/no pertenece
     operando := "texto"  |  "@"nombre  |  palabra
     referencia := campo | media:mediaN:type
     lista    := "(" miembro ("," miembro)* ")"
     miembro  := "texto" | "empty"

   - operando entre comillas → literal;  @nombre → @regla;  palabra suelta →
     id de campo (compara valor contra valor: equalsField/notEqualsField).
   - Los miembros de `in`/`not in` son literales entre comillas; `empty` sin
     comillas representa la ausencia de valor.
   - "@nombre" suelto = evalúa esa @regla como sub-expresión booleana
     (permite reutilizar/concatenar reglas: «@esLod OR @esVlod»).
   Retrocompatible: una `when` vieja { field, op, value } sigue evaluándose. */

// Referencia virtual disponible SOLO en expresiones de condiciones. No es un
// campo del schema ni puede interpolarse en una plantilla: lee el tipo actual
// de una fila de media, p. ej. media:media1:type = "Vid".
function isMediaTypeConditionRef(id) {
  return /^media:media[1-9]\d*:type$/.test(String(id || ""));
}

function conditionReference(form, inst, id) {
  if (isMediaTypeConditionRef(id)) {
    const mediaId = String(id).split(":")[1];
    const row = normalizeMediaRows(inst, form).find(item => item.id === mediaId);
    return { found: true, field: null, raw: row ? row.type : "" };
  }
  const found = form && getField(form, id);
  return { found: !!found, field: found && found.field, raw: found ? inst.values[id] : "" };
}

function tokenizeExpr(src) {
  const toks = [];
  let i = 0;
  const isWord = (c) => /[A-Za-z0-9_\-.:]/.test(c);
  while (i < src.length) {
    const c = src[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === "(" || c === ")" || c === ",") { toks.push({ t: c }); i++; continue; }
    if (c === '"' || c === "'") {
      let j = i + 1, s = "";
      while (j < src.length && src[j] !== c) { s += src[j]; j++; }
      if (j >= src.length) throw new Error(t("expr.unclosedQuote"));
      toks.push({ t: "str", v: s }); i = j + 1; continue;
    }
    if (c === "@") {
      let j = i + 1, s = "";
      while (j < src.length && /[A-Za-z0-9_]/.test(src[j])) { s += src[j]; j++; }
      if (!s) throw new Error(t("expr.ruleName"));
      toks.push({ t: "ref", v: s }); i = j; continue;
    }
    const two = src.slice(i, i + 2);
    if (two === "==" || two === "!=" || two === "<>" || two === "&&" || two === "||") {
      toks.push({ t: "op", v: two }); i += 2; continue;
    }
    if (c === "=" || c === "~" || c === "!") { toks.push({ t: "op", v: c }); i++; continue; }
    if (isWord(c)) {
      let j = i, s = "";
      while (j < src.length && isWord(src[j])) { s += src[j]; j++; }
      toks.push({ t: "word", v: s }); i = j; continue;
    }
    throw new Error(t("expr.unexpectedCharacter", { character: c }));
  }
  return toks;
}

// Parser de descenso recursivo → AST. Lanza Error con mensaje legible.
function parseExpr(src) {
  const toks = tokenizeExpr(src);
  let p = 0;
  const peek = () => toks[p];
  const isKw = (w) => peek() && peek().t === "word" && peek().v.toLowerCase() === w;
  const isOp = (...vs) => peek() && peek().t === "op" && vs.includes(peek().v);

  function parseOr() {
    let left = parseAnd();
    while (isKw("or") || isOp("||")) { p++; left = { type: "or", items: [left, parseAnd()] }; }
    return left;
  }
  function parseAnd() {
    let left = parseNot();
    while (isKw("and") || isOp("&&")) { p++; left = { type: "and", items: [left, parseNot()] }; }
    return left;
  }
  function parseNot() {
    if (isKw("not") || isOp("!")) { p++; return { type: "not", item: parseNot() }; }
    return parsePrimary();
  }
  function parsePrimary() {
    if (peek() && peek().t === "(") {
      p++;
      const e = parseOr();
      if (!peek() || peek().t !== ")") throw new Error(t("expr.closeParen"));
      p++;
      return e;
    }
    if (peek() && peek().t === "ref") { const name = peek().v; p++; return { type: "ref", name }; }
    // comparación: empieza por un id de campo (word)
    if (!peek() || peek().t !== "word") throw new Error(t("expr.expectedField"));
    const field = peek().v; p++;
    // operador postfijo empty/notEmpty
    if (isKw("empty")) { p++; return { type: "cmp", field, op: "empty" }; }
    if (isKw("notempty")) { p++; return { type: "cmp", field, op: "notEmpty" }; }
    if (isKw("isall")) { p++; return { type: "cmp", field, op: "isAll" }; }
    // Operadores de pertenencia. `not in` se reconoce aquí para que NOT/!
    // conserve su papel de negación prefija en el resto de la gramática.
    if (isKw("in") ||
        (isKw("not") && toks[p + 1] && toks[p + 1].t === "word" &&
         toks[p + 1].v.toLowerCase() === "in")) {
      const op = isKw("in") ? "in" : "notIn";
      p += op === "in" ? 1 : 2;
      if (!peek() || peek().t !== "(") throw new Error(t("expr.expectedListOpen", { operator: op === "in" ? "in" : "not in" }));
      p++;
      const members = [];
      if (peek() && peek().t === ")") throw new Error(t("expr.emptyList"));
      while (true) {
        const tk = peek();
        if (!tk) throw new Error(t("expr.closeList"));
        if (tk.t === "str") members.push({ kind: "lit", v: tk.v });
        else if (tk.t === "word" && tk.v.toLowerCase() === "empty") members.push({ kind: "empty" });
        else throw new Error(t("expr.quotedMembers"));
        p++;
        if (peek() && peek().t === ")") { p++; break; }
        if (!peek() || peek().t !== ",") throw new Error(t("expr.expectedListSeparator"));
        p++;
        if (!peek() || peek().t === ")") throw new Error(t("expr.valueAfterComma"));
      }
      return { type: "cmp", field, op, members };
    }
    // Operador binario
    let op;
    if (isOp("=", "==")) op = "eq";
    else if (isOp("!=", "<>")) op = "ne";
    else if (isKw("matches") || isOp("~")) op = "matches";
    else if (isKw("contains")) op = "contains";
    else throw new Error(t("expr.expectedOperator", { field }));
    p++;
    if (!peek()) throw new Error(t("expr.missingValue"));
    const tk = peek(); p++;
    let operand;
    if (tk.t === "str") operand = { kind: "lit", v: tk.v };
    else if (tk.t === "ref") operand = { kind: "ref", v: tk.v };
    else if (tk.t === "word") operand = { kind: "word", v: tk.v };
    else throw new Error(t("expr.invalidValue"));
    return { type: "cmp", field, op, operand };
  }

  if (!toks.length) throw new Error(t("expr.empty"));
  const ast = parseOr();
  if (p < toks.length) throw new Error(t("expr.trailing"));
  return ast;
}

// Convierte un nodo de comparación a la forma { field, op, value } que ya
// sabe evaluar evalCondition (reusando toda su semántica).
function cmpToWhen(node) {
  if (["empty", "notEmpty", "isAll"].includes(node.op)) return { field: node.field, op: node.op };
  const o = node.operand || { kind: "lit", v: "" };
  if (node.op === "matches") {
    const val = o.kind === "ref" ? "@" + o.v : o.v;
    return { field: node.field, op: "matches", value: val };
  }
  if (node.op === "contains") return { field: node.field, op: "contains", value: o.v };
  // eq/ne: palabra suelta que ES un id de campo → comparación campo-a-campo
  const isFieldRef = o.kind === "word" && anyFieldHasId(o.v);
  if (o.kind === "ref") return { field: node.field, op: node.op === "eq" ? "equals" : "notEquals", value: "@" + o.v };
  if (isFieldRef) return { field: node.field, op: node.op === "eq" ? "equalsField" : "notEqualsField", value: o.v };
  return { field: node.field, op: node.op === "eq" ? "equals" : "notEquals", value: o.v };
}

// ¿Algún campo de cualquier formulario tiene este id? (para decidir si un
// operando suelto es referencia a campo o literal).
function anyFieldHasId(id) {
  return getForms().some(f => allFields(f).some(x => x.field.id === id));
}

// Una referencia inexistente invalida la expresión completa, incluso dentro
// de NOT. Así un typo nunca puede convertirse accidentalmente en `true`.
function astHasMissingField(ast, inst) {
  const form = getForm(inst.formId);
  if (!form) return true;
  const walk = (node) => {
    if (!node) return false;
    if (node.type === "cmp") {
      if (!getField(form, node.field) && !isMediaTypeConditionRef(node.field)) return true;
      if (node.op === "in" || node.op === "notIn") return false;
      const w = cmpToWhen(node);
      return ["equalsField", "notEqualsField"].includes(w.op) && !getField(form, w.value);
    }
    if (node.type === "not") return walk(node.item);
    if (node.type === "or" || node.type === "and") return node.items.some(walk);
    return false;
  };
  return walk(ast);
}

// Evalúa un AST contra la instancia. `seen` evita ciclos entre @reglas.
function evalAst(ast, inst, seen) {
  if (!ast) return false;
  switch (ast.type) {
    case "or":  return ast.items.some(x => evalAst(x, inst, seen));
    case "and": return ast.items.every(x => evalAst(x, inst, seen));
    case "not": return !evalAst(ast.item, inst, seen);
    case "cmp":
      if (ast.op === "in" || ast.op === "notIn") {
        const form = getForm(inst.formId);
        const ref = conditionReference(form, inst, ast.field);
        if (!form || !ref.found) return false;
        const raw = ref.raw;
        const values = Array.isArray(raw)
          ? raw.map(v => String(v).trim().toLowerCase()).filter(Boolean)
          : [String(raw == null ? "" : raw).trim().toLowerCase()].filter(Boolean);
        const found = (ast.members || []).some(member =>
          member.kind === "empty"
            ? !values.length
            : values.includes(String(member.v).trim().toLowerCase()));
        return ast.op === "in" ? found : !found;
      }
      return evalCondition(cmpToWhen(ast), inst);
    case "ref": {
      const name = ast.name;
      if (seen && seen.has(name)) return false; // ciclo
      const raw = config.data.rules[name];
      if (raw == null || String(raw).trim() === "") return false;
      try {
        const sub = parseExpr(String(raw));
        if (astHasMissingField(sub, inst)) return false;
        const s2 = new Set(seen || []); s2.add(name);
        return evalAst(sub, inst, s2);
      } catch (e) { return false; } // @regla que no es expresión booleana
    }
    default: return false;
  }
}

// Evalúa la condición de una regla, aceptando la forma nueva (whenExpr:
// string) o la vieja (when: {field,op,value}). Vacío = no dispara.
function ruleWhenTrue(rule, inst) {
  if (typeof rule.whenExpr === "string") {
    const src = rule.whenExpr.trim();
    if (!src) return false;
    try {
      const ast = parseExpr(src);
      return !astHasMissingField(ast, inst) && evalAst(ast, inst);
    }
    catch (e) { return false; } // expresión inválida: la regla no aplica
  }
  if (rule.when) return evalCondition(rule.when, inst);
  return false;
}

// Valida una expresión; devuelve "" si es válida o el mensaje de error.
function exprError(src, form) {
  if (!String(src || "").trim()) return "";
  try {
    const ast = parseExpr(String(src));
    if (form) {
      const missing = exprFieldRefs(src).find(id => !getField(form, id) && !isMediaTypeConditionRef(id));
      if (missing) return t("expr.missingField", { field: missing });
    }
    return "";
  }
  catch (e) { return e.message || t("expr.invalid"); }
}

// Ids de campo usados como lado izquierdo de una comparación en la expresión
// (para validar al importar que existan). No mira los operandos (pueden ser
// literales) ni desciende a otras @reglas. Si no parsea, devuelve [].
function exprFieldRefs(src) {
  const ids = [];
  const walk = (n) => {
    if (!n) return;
    if (n.type === "cmp") ids.push(n.field);
    else if (n.type === "not") walk(n.item);
    else if (n.type === "or" || n.type === "and") n.items.forEach(walk);
  };
  try { walk(parseExpr(String(src || ""))); } catch (e) {}
  return ids;
}

// Valores configurados para un campo autocomplete o checklist. En listas
// dependientes no hay una instancia concreta en RULES: se reúnen los buckets.
function condExprFieldValues(field) {
  if (field && field.type === "mediaType") return field.options || [];
  if (!field || (field.type !== "autocomplete" && field.type !== "checklist")) return [];
  let values = [];
  if (field.type === "checklist") {
    values = field.options || [];
  } else {
    const s = parseSource(field.source);
    if (s.kind === "child") {
      const child = config.data.childLists && config.data.childLists[s.link];
      if (child) Object.values(child.values || {}).forEach(arr => values.push(...(arr || [])));
    } else {
      values = (config.data.lists && config.data.lists[s.list]) || [];
    }
  }
  const seen = new Set();
  return values.map(String).filter(value => {
    const key = value.toLowerCase();
    if (!value || seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function condExprQuoted(value) {
  value = String(value);
  if (!value.includes('"')) return `"${value}"`;
  if (!value.includes("'")) return `'${value}'`;
  return ""; // el lenguaje todavía no admite escapes dentro de strings
}

// Devuelve el fragmento editable bajo el cursor. Si hay una comilla abierta,
// reemplaza desde esa comilla para completar el literal entero.
function condExprFragment(src, cursor) {
  const before = src.slice(0, cursor);
  let quote = "", quoteAt = -1;
  for (let i = 0; i < before.length; i++) {
    if (!quote && (before[i] === '"' || before[i] === "'")) {
      quote = before[i]; quoteAt = i;
    } else if (quote && before[i] === quote) {
      quote = ""; quoteAt = -1;
    }
  }
  if (quote) {
    const closingAt = src.indexOf(quote, cursor);
    return {
      from: quoteAt,
      to: closingAt >= 0 ? closingAt + 1 : cursor,
      query: before.slice(quoteAt + 1),
      atRule: false
    };
  }
  const m = /[@A-Za-z0-9_.:-]+$/.exec(before);
  const tail = /^[A-Za-z0-9_.:-]+/.exec(src.slice(cursor));
  return {
    from: m ? cursor - m[0].length : cursor,
    to: cursor + (tail ? tail[0].length : 0),
    query: m ? m[0] : "",
    atRule: !!(m && m[0].startsWith("@"))
  };
}

function condExprSuggestionState(src, cursor, form) {
  const fragment = condExprFragment(src, cursor);
  const base = src.slice(0, fragment.from);
  let toks;
  try { toks = tokenizeExpr(base); }
  catch (e) { return { ...fragment, kind: "none", field: null }; }
  const last = toks[toks.length - 1];
  const prev = toks[toks.length - 2];
  const word = tk => tk && tk.t === "word" ? tk.v.toLowerCase() : "";
  const op = tk => tk && tk.t === "op" ? tk.v : "";

  // Detecta si el cursor está dentro de la lista de un in/not in y conserva
  // el campo izquierdo para poder sugerir sus valores configurados.
  const stack = [];
  toks.forEach((tk, i) => {
    if (tk.t === "(") {
      const before = toks[i - 1];
      const before2 = toks[i - 2];
      const before3 = toks[i - 3];
      let fieldId = "";
      if (word(before) === "in" && before2 && before2.t === "word") {
        fieldId = word(before2) === "not" && before3 && before3.t === "word"
          ? before3.v : before2.v;
      }
      stack.push({ membership: !!fieldId, fieldId });
    } else if (tk.t === ")" && stack.length) stack.pop();
  });
  const listCtx = stack.length && stack[stack.length - 1].membership
    ? stack[stack.length - 1] : null;
  if (listCtx) {
    const fieldRef = getField(form, listCtx.fieldId);
    const kind = !last || last.t === "(" || last.t === "," ? "member" : "listSep";
    return { ...fragment, kind, field: fieldRef && fieldRef.field };
  }

  if (word(last) === "not" && prev && prev.t === "word" && getField(form, prev.v)) {
    return { ...fragment, kind: "notInOpen", field: getField(form, prev.v).field };
  }
  if (!last || last.t === "(" || ["!", "&&", "||"].includes(op(last)) ||
      ["and", "or", "not"].includes(word(last))) {
    return { ...fragment, kind: "lhs", field: null };
  }
  if (last.t === ")") return { ...fragment, kind: "logical", field: null };
  if (last.t === "ref" || last.t === "str") return { ...fragment, kind: "logical", field: null };
  if (["=", "==", "!=", "<>", "~"].includes(op(last)) || ["matches", "contains"].includes(word(last))) {
    const fieldTk = prev;
    const fieldRef = fieldTk && fieldTk.t === "word" ? getField(form, fieldTk.v) : null;
    const mediaRef = fieldTk && fieldTk.t === "word" && isMediaTypeConditionRef(fieldTk.v);
    return {
      ...fragment,
      kind: op(last) === "~" || word(last) === "matches" ? "matchesOperand" : "operand",
      field: fieldRef ? fieldRef.field : (mediaRef ? { type: "mediaType", options: mediaTypes(form) } : null)
    };
  }
  if (word(last) === "in") {
    const fieldTk = word(prev) === "not" ? toks[toks.length - 3] : prev;
    const fieldRef = fieldTk && fieldTk.t === "word" ? getField(form, fieldTk.v) : null;
    return { ...fragment, kind: "listOpen", field: fieldRef && fieldRef.field };
  }
  if (last.t === "word") {
    if (["empty", "notempty", "isall"].includes(word(last))) {
      return { ...fragment, kind: "logical", field: null };
    }
    // Una palabra tras un operador es un operando ya completo; en cualquier
    // otra posición, si es un id válido, es el lado izquierdo.
    if (prev && (["=", "==", "!=", "<>", "~"].includes(op(prev)) || ["matches", "contains"].includes(word(prev)))) {
      return { ...fragment, kind: "logical", field: null };
    }
    const fieldRef = getField(form, last.v);
    if (fieldRef) return { ...fragment, kind: "operator", field: fieldRef.field };
    if (isMediaTypeConditionRef(last.v)) {
      return { ...fragment, kind: "operator", field: { type: "mediaType", options: mediaTypes(form) } };
    }
  }
  return { ...fragment, kind: "logical", field: null };
}

function condExprSuggestions(src, cursor, form) {
  const state = condExprSuggestionState(src, cursor, form);
  const fields = allFields(form).filter(x => x.field.type !== "mirror").map(x => x.field);
  const rules = Object.keys(config.data.rules || {});
  const item = (insert, label, detail) => ({ insert, label: label || insert.trim(), detail: detail || "" });
  const fieldItems = () => fields.map(field => item(field.id + " ", field.id, configuredText(field.label)))
    .concat([1, 2, 3].map(n => item(`media:media${n}:type `,
      `media:media${n}:type`, t("suggest.mediaType", { index: n }))));
  const ruleItems = () => rules.map(name => item("@" + name + " ", "@" + name, t("suggest.globalRule")));
  const valueItems = field => condExprFieldValues(field)
    .map(value => {
      const quoted = condExprQuoted(value);
      return quoted ? item(quoted + " ", quoted, t("suggest.fieldValue", { field: configuredText(field.label) })) : null;
    }).filter(Boolean);
  let items = [];
  switch (state.kind) {
    case "lhs":
      items = state.atRule
        ? ruleItems()
        : fieldItems().concat(ruleItems(), [item("NOT ", "NOT", t("suggest.negation"))]);
      break;
    case "operator":
      items = [
        item("empty ", "empty", t("suggest.empty")),
        item("notEmpty ", "notEmpty", t("suggest.notEmpty")),
        item("= ", "=", t("suggest.equals")),
        item("!= ", "!=", t("suggest.notEquals")),
        item("matches ", "matches", t("suggest.matches")),
        item("in (", "in (...)", t("suggest.in")),
        item("not in (", "not in (...)", t("suggest.notIn"))
      ];
      if (state.field && state.field.type === "checklist") {
        items.splice(2, 0,
          item("contains ", "contains", t("suggest.contains")),
          item("isAll ", "isAll", t("suggest.isAll")));
      }
      break;
    case "operand":
      items = state.atRule ? [] : valueItems(state.field).concat(fieldItems());
      break;
    case "matchesOperand":
      items = ruleItems();
      break;
    case "listOpen":
      items = [item("(", "(", t("suggest.openList"))];
      break;
    case "notInOpen":
      items = [item("in (", "in (...)", t("suggest.completeNotIn"))];
      break;
    case "member":
      items = valueItems(state.field).concat([item("empty", "empty", t("suggest.noValue"))]);
      break;
    case "listSep":
      items = [item(", ", ",", t("suggest.anotherValue")), item(") ", ")", t("suggest.finishList"))];
      break;
    case "logical":
      items = [
        item("AND ", "AND", "alias &&"),
        item("OR ", "OR", "alias ||")
      ];
      break;
  }
  const query = state.query.replace(/^@/, "").toLowerCase();
  if (query) {
    items = items.filter(s =>
      s.label.replace(/^@/, "").toLowerCase().includes(query) ||
      s.detail.toLowerCase().includes(query));
  }
  return { from: state.from, to: state.to == null ? cursor : state.to, items: items.slice(0, 50) };
}

function wireCondExprAutocomplete(input, form) {
  const wrap = input.closest(".cond-expr-ac");
  const list = wrap && wrap.querySelector(".autocomplete-list");
  if (!wrap || !list) return;
  const listId = list.id || `${input.id || newId()}-suggestions`;
  list.id = listId;
  list.setAttribute("role", "listbox");
  input.setAttribute("role", "combobox");
  input.setAttribute("aria-autocomplete", "list");
  input.setAttribute("aria-controls", listId);
  input.setAttribute("aria-expanded", "false");
  let activeIdx = -1;
  let current = { from: 0, to: 0, items: [] };

  const accept = idx => {
    const suggestion = current.items[idx];
    if (!suggestion) return;
    const before = input.value.slice(0, current.from);
    const after = input.value.slice(current.to);
    input.value = before + suggestion.insert + after;
    const caret = before.length + suggestion.insert.length;
    input.setSelectionRange(caret, caret);
    input.dispatchEvent(new Event("input", { bubbles: true }));
    input.dispatchEvent(new Event("change", { bubbles: true }));
  };
  const render = () => {
    current = condExprSuggestions(input.value, input.selectionStart || 0, form);
    activeIdx = -1;
    if (!current.items.length) {
      closeAutocomplete(wrap, input);
      list.innerHTML = "";
      return;
    }
    list.innerHTML = current.items.map((suggestion, idx) =>
      `<div class="autocomplete-item" id="${escapeHtml(listId)}-${idx}" role="option" aria-selected="false" data-cond-suggestion="${idx}">
        <code>${escapeHtml(suggestion.label)}</code>
        <span class="cond-expr-detail">${escapeHtml(suggestion.detail)}</span>
      </div>`).join("");
    list.querySelectorAll("[data-cond-suggestion]").forEach(el => {
      el.addEventListener("mousedown", e => {
        e.preventDefault();
        accept(+el.dataset.condSuggestion);
      });
    });
    wrap.classList.add("open");
    input.setAttribute("aria-expanded", "true");
    positionAutocomplete(wrap, list);
  };

  input.addEventListener("focus", render);
  input.addEventListener("click", render);
  input.addEventListener("input", render);
  input.addEventListener("blur", () => setTimeout(() => {
    closeAutocomplete(wrap, input);
    activeIdx = -1;
  }, 150));
  input.addEventListener("keydown", e => {
    let items = list.querySelectorAll("[data-cond-suggestion]");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!wrap.classList.contains("open")) {
        render();
        items = list.querySelectorAll("[data-cond-suggestion]");
      }
      if (e.key === "ArrowDown") activeIdx = Math.min(items.length - 1, activeIdx + 1);
      else activeIdx = Math.max(0, activeIdx - 1);
    } else if ((e.key === "Enter" || e.key === "Tab") &&
               wrap.classList.contains("open") && activeIdx >= 0) {
      e.preventDefault();
      accept(activeIdx);
      return;
    } else if (e.key === "Escape") {
      closeAutocomplete(wrap, input);
      activeIdx = -1;
      return;
    } else {
      return;
    }
    items.forEach((el, idx) => {
      const active = idx === activeIdx;
      el.classList.toggle("active", active);
      el.setAttribute("aria-selected", String(active));
    });
    if (activeIdx >= 0 && items[activeIdx]) input.setAttribute("aria-activedescendant", items[activeIdx].id);
    if (activeIdx >= 0 && items[activeIdx]) {
      const el = items[activeIdx];
      if (el.offsetTop < list.scrollTop) list.scrollTop = el.offsetTop;
      else if (el.offsetTop + el.offsetHeight > list.scrollTop + list.clientHeight)
        list.scrollTop = el.offsetTop + el.offsetHeight - list.clientHeight;
    }
  });
}

function evalCondition(when, inst) {
  const form = getForm(inst.formId);
  const ref = conditionReference(form, inst, when.field);
  if (!ref.found) return false;
  const raw = ref.raw;
  const values = Array.isArray(raw)
    ? raw.map(v => String(v).trim()).filter(Boolean)
    : (String(raw == null ? "" : raw).trim() ? [String(raw).trim()] : []);
  const v = values.join(",");
  const target = String(when.value == null ? "" : when.value).trim();
  const hasTarget = values.some(value => value.toLowerCase() === target.toLowerCase());
  switch (when.op) {
    case "empty":     return !values.length;
    case "notEmpty":  return !!values.length;
    case "equals":    return Array.isArray(raw) ? hasTarget : v.toLowerCase() === target.toLowerCase();
    case "notEquals": return Array.isArray(raw) ? !hasTarget : v.toLowerCase() !== target.toLowerCase();
    case "contains":  return hasTarget;
    case "isAll":     return ref.field && ref.field.type === "checklist" && ref.field.allOption &&
                             values.includes(checklistSpecialValue(ref.field));
    case "matches":
      try { return values.some(value => new RegExp(resolveRef(target), "i").test(value)); }
      catch (e) { return false; }
    // target = id de otro campo; solo cuenta si ambos tienen valor
    case "equalsField": {
      if (!getField(form, target)) return false;
      const other = String(inst.values[target] == null ? "" : inst.values[target]).trim();
      return !!v && !!other && v.toLowerCase() === other.toLowerCase();
    }
    case "notEqualsField": {
      if (!getField(form, target)) return false;
      const other = String(inst.values[target] == null ? "" : inst.values[target]).trim();
      return !!v && !!other && v.toLowerCase() !== other.toLowerCase();
    }
    default: return false;
  }
}

// Estado efectivo de cada campo según las condiciones del formulario.
// Devuelve { fieldId: { hidden, disabled } }. La acción setDefault
// rellena el campo destino solo si está vacío.
function evalFieldRules(form, inst) {
  const fx = {};
  allFields(form).forEach(({ field }) => {
    fx[field.id] = { hidden: !!field.hidden, disabled: false };
  });
  getFormRules(form).forEach(r => {
    if ((!r.when && r.whenExpr == null) || !r.then || !fx[r.then.field]) return;
    if (!ruleWhenTrue(r, inst)) return;
    const effect = fx[r.then.field];
    if (r.then.action === "show") effect.hidden = false;
    else if (r.then.action === "hide") effect.hidden = true;
    else if (r.then.action === "disable") effect.disabled = true;
    else if (r.then.action === "setDefault") {
      const cur = inst.values[r.then.field];
      if (!String(cur == null ? "" : cur).trim()) {
        inst.values[r.then.field] = resolveRef(r.then.value || "");
      }
    }
  });
  return fx;
}

function parseKeywordCountRule(raw) {
  const text = String(raw == null ? "" : raw).trim();
  const min = text.match(/^>=\s*(\d+)$/);
  if (min) return { mode: "min", count: +min[1] };
  if (/^\d+$/.test(text)) return { mode: "exact", count: +text };
  return null;
}

function revalidate(inst, paint) {
  if (paint === undefined) paint = true;
  inst.errors = {};
  const form = getForm(inst.formId);
  if (!form) return;
  const fx = evalFieldRules(form, inst);

  // Cuerpo del bug: todos los campos de texto, para el chequeo de keywords
  const bodyText = allFields(form)
    .filter(({ field }) => field.type === "text" || field.type === "textarea")
    .map(({ field }) => String(inst.values[field.id] || ""))
    .join(" ")
    .toLowerCase();

  allFields(form).forEach(({ field }) => {
    if (field.type === "mirror" || field.type === "checkbox") return;
    // Un campo oculto o bloqueado por condición no puede exigirse
    if (fx[field.id].hidden || fx[field.id].disabled) return;

    if (field.type === "keywords") {
      const arr = inst.values[field.id] || [];
      const countRule = parseKeywordCountRule(resolveRef(field.kwCount || ""));
      if (countRule && countRule.mode === "min" && arr.length < countRule.count) {
        inst.errors[field.id] = t("validation.keywordMin", { required: countRule.count, actual: arr.length });
      } else if (countRule && countRule.mode === "exact" && countRule.count && arr.length !== countRule.count) {
        inst.errors[field.id] = t("validation.keywordExact", { required: countRule.count, actual: arr.length });
      } else if (new Set(arr.map(k => k.toLowerCase())).size !== arr.length) {
        inst.errors[field.id] = t("validation.unique");
      } else if (field.kwOverlap) {
        // Se listan TODAS las que chocan (además, cada chip en conflicto
        // se pinta en rojo en el propio widget).
        const conflicts = arr.filter(k => bodyText.includes(k.toLowerCase()));
        if (conflicts.length === 1) {
          inst.errors[field.id] = tp("validation.keywordConflict", 1, { value: conflicts[0] });
        } else if (conflicts.length) {
          inst.errors[field.id] = tp("validation.keywordConflict", conflicts.length, {
            values: conflicts.map(k => "«" + k + "»").join(", ")
          });
        }
      }
      return;
    }

    if (field.type === "checklist") {
      const arr = Array.isArray(inst.values[field.id]) ? inst.values[field.id] : [];
      if (field.required && !arr.length) {
        inst.errors[field.id] = t("validation.selectOne");
      }
      return;
    }

    const v = String(inst.values[field.id] || "");
    if (field.required && !v.trim()) {
      inst.errors[field.id] = t("validation.required");
      return;
    }
    if (v.trim() && field.regex) {
      try {
        const re = new RegExp(resolveRef(field.regex));
        if (!re.test(v.trim())) {
          inst.errors[field.id] = field.regexMsg ? configuredText(field.regexMsg) : t("validation.invalidFormat");
        }
      } catch (e) { /* regex rota: se ignora, se corrige en RULES */ }
    }
  });

  // Condiciones con acción "marcar error" (ej. BSP CL igual a CL).
  // No aplican sobre campos ocultos o bloqueados.
  getFormRules(form).forEach(r => {
    if ((!r.when && r.whenExpr == null) || !r.then || r.then.action !== "error") return;
    const st = fx[r.then.field];
    if (!st || st.hidden || st.disabled) return;
    if (ruleWhenTrue(r, inst)) {
      inst.errors[r.then.field] = r.then.value ? configuredText(r.then.value) : t("validation.invalidValue");
    }
  });

  if (paint) {
    reflectErrors(inst);
    renderTiles(inst);
  }
}

// Pinta los errores en los campos sin re-renderizar el formulario.
function reflectErrors(inst) {
  const panel = $("formPanel");
  panel.querySelectorAll(".field").forEach(el => {
    const name = el.dataset.field;
    if (!name) return;
    const err = inst.errors[name] || "";
    const chips = el.querySelector("[data-kw-chips]");
    if (chips) {
      chips.classList.toggle("invalid", !!err);
      let msg = el.querySelector(".chips-error");
      if (err) {
        if (!msg) {
          msg = document.createElement("div");
          msg.className = "chips-error";
          chips.after(msg);
        }
        msg.textContent = err;
      } else if (msg) {
        msg.remove();
      }
      // Re-pinta qué chips están en conflicto sin re-renderizar el widget
      // (el cuerpo del bug pudo cambiar desde otro campo).
      const kwForm = getForm(inst.formId);
      const kwFound = kwForm && getField(kwForm, name);
      if (kwFound) {
        const bad = keywordBadSet(inst, kwFound.field);
        chips.querySelectorAll(".chip").forEach(ch => {
          const btn = ch.querySelector("[data-kw-remove]");
          ch.classList.toggle("chip-bad", !!(btn && bad.has(btn.dataset.kwRemove)));
        });
      }
      return;
    }
    el.classList.toggle("invalid", !!err);
    const errEl = el.querySelector(".field-error");
    if (errEl) errEl.textContent = err;
  });
}

/* ---------- Tiles personalizados (definidos por el usuario) ----------
   Cada form puede tener form.tiles = [ { text, message, whenExpr, color,
   group, severity, field } ]. Son independientes de los campos: aparecen
   cuando su condición es verdadera (o siempre, si la condición está vacía).
   Reutilizan el motor de expresiones (parseExpr/evalAst) y exprFieldRefs. */
function getFormTiles(form) { return (form && form.tiles) || []; }

// Rellena valores por defecto de cada tile (configs viejas / import de CSV).
function normalizeTiles(form) {
  if (!Array.isArray(form.tiles)) form.tiles = [];
  const str = (v) => v == null ? "" : String(v);
  form.tiles.forEach(tile => {
    tile.text = str(tile.text);
    tile.message = str(tile.message);
    tile.whenExpr = str(tile.whenExpr);
    // "info" fue la antigua variante no bloqueante; se migra a "warn".
    tile.severity = tile.severity === "error" ? "error" : "warn";
    if (!TILE_COLOR_MAP[tile.color]) tile.color = TILE_SEV_COLOR[tile.severity];
    tile.group = str(tile.group);
    tile.field = str(tile.field);
  });
}
function ensureTiles(cfg) {
  (cfg.schema.forms || []).forEach(normalizeTiles);
}

// Campos a los que "toca" un tile: los que menciona su condición más el campo
// destino explícito. Base del resaltado cruzado campo -> tile.
function tileFieldRefs(tile) {
  const refs = new Set(exprFieldRefs(tile.whenExpr || ""));
  if (tile.field) refs.add(tile.field);
  return [...refs];
}

// Sustituye {idCampo} en el texto por el valor actual de la instancia.
function interpolateTileText(text, inst) {
  return String(text || "").replace(/\{([A-Za-z0-9_\-.]+)\}/g, (m, id) => {
    const v = inst.values[id];
    if (v == null) return "";
    if (Array.isArray(v)) {
      const form = getForm(inst.formId);
      const found = form && getField(form, id);
      const field = found && found.field;
      if (field && field.type === "checklist" && field.allOption &&
          v.includes(checklistSpecialValue(field))) {
        return field.allOutput || field.allLabel || "Todas las anteriores";
      }
      return v.join(", ");
    }
    return String(v);
  });
}

// Tiles personalizados activos ahora. Condición vacía = siempre activo
// (tile informativo fijo). Devuelve { tile, idx, text }.
function evalTiles(form, inst) {
  const out = [];
  getFormTiles(form).forEach((tile, idx) => {
    const src = String(tile.whenExpr || "").trim();
    let active;
    if (!src) active = true;
    else {
      try {
        const ast = parseExpr(src);
        active = !astHasMissingField(ast, inst) && evalAst(ast, inst);
      } catch (e) { active = false; }
    }
    if (active) out.push({
      tile,
      idx,
      text: interpolateTileText(configuredText(tile.text || tile.group || "(tile)"), inst),
      message: interpolateTileText(configuredText(tile.message || ""), inst)
    });
  });
  return out;
}

// Salta y enfoca un campo por id.
function scrollToField(fieldId) {
  const el = document.querySelector(`#formPanel .field[data-field="${fieldId}"]`);
  if (!el) return;
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  const inp = el.querySelector("input, textarea");
  if (inp) inp.focus({ preventScroll: true });
}

// Barra de tiles: verde si todo bien; si no, grupos con los errores de campo
// (automáticos) y los tiles personalizados activos. Se puede colapsar a una
// línea con la "llave".
function renderTiles(inst) {
  const bar = $("tilesBar");
  if (!inst || !getForm(state.topTab)) { bar.innerHTML = ""; return; }
  const form = getForm(inst.formId);

  // Banda 1: errores de campo EN EL ORDEN DEL FORM.
  const fieldErrs = [];
  allFields(form).forEach(({ field }) => {
    if (inst.errors[field.id]) fieldErrs.push([field.id, inst.errors[field.id], field]);
  });
  // Errores sin campo asociado (caso raro): al final, sin color propio.
  Object.keys(inst.errors).forEach(id => {
    if (!fieldErrs.some(e => e[0] === id)) fieldErrs.push([id, inst.errors[id], null]);
  });
  // Banda 2: tiles personalizados activos, en el orden de la lista de Rules.
  const active = evalTiles(form, inst);
  const blocking = fieldErrs.length > 0 || active.some(a => a.tile.severity === "error");

  // Tiles de tipo Error activos: su campo destino también se resalta en
  // rojo en el formulario (mismo tratamiento visual que un campo inválido).
  const flagged = new Set();
  active.forEach(({ tile }) => {
    if (tile.severity !== "error") return;
    const target = tile.field || tileFieldRefs(tile)[0] || "";
    if (target) flagged.add(target);
  });
  document.querySelectorAll("#formPanel .field[data-field]").forEach(el => {
    el.classList.toggle("rule-flag", flagged.has(el.dataset.field));
  });

  // Nada que mostrar: verde y salir.
  if (!fieldErrs.length && !active.length) {
    bar.classList.remove("collapsed");
    bar.innerHTML = `<div class="tiles-wrap"><div class="tiles-band"><span class="tile ok">${escapeHtml(t("validation.ready"))}</span></div></div>`;
    return;
  }

  // Banda 1 (automáticos). Cada tile usa el color del campo (default rojo).
  let band1;
  if (fieldErrs.length) {
    band1 = fieldErrs.map(([id, msg, field]) => {
      const label = field ? configuredText(field.label) : id;
      const cid = (field && TILE_COLOR_MAP[field.errColor]) ? field.errColor : "red";
      const col = tileColor(cid);
      const style = `background:${col.bg};color:${col.fg};border-color:${col.border}`;
      return `<span class="tile sev-error" style="${style}" data-target="${escapeHtml(id)}" data-fields="${escapeHtml(id)}" role="button" tabindex="0" title="${escapeHtml(msg)}">${escapeHtml(label)}</span>`;
    }).join("");
  } else {
    band1 = `<span class="tile ok">✓ ${escapeHtml(t(blocking ? "validation.fieldsOk" : "validation.readyShort"))}</span>`;
  }

  // Banda 2 (personalizados).
  let band2 = "";
  if (active.length) {
    band2 = active.map(({ tile, text, message }) => {
      const col = tileColor(tile.color);
      const refs = tileFieldRefs(tile);
      const target = tile.field || refs[0] || "";
      const cls = "tile sev-" + tile.severity + (target ? "" : " no-target");
      const style = `background:${col.bg};color:${col.fg};border-color:${col.border}`;
      const tip = message || (tile.whenExpr ? t("validation.when", { expression: tile.whenExpr }) : "");
      return `<span class="${cls}" style="${style}"${target ? ` data-target="${escapeHtml(target)}" role="button" tabindex="0"` : ""}`
        + ` data-fields="${escapeHtml(refs.join(" "))}"${tip ? ` title="${escapeHtml(tip)}"` : ""}>${escapeHtml(text)}</span>`;
    }).join("");
  }

  const collapsed = !!state.prefs.tilesCollapsed;
  bar.classList.toggle("collapsed", collapsed);
  bar.innerHTML =
    `<div class="tiles-wrap">` +
      `<div class="tiles-band band-auto">${band1}</div>` +
      (band2 ? `<div class="tiles-band band-custom">${band2}</div>` : "") +
    `</div>` +
    `<button class="tiles-toggle" id="tilesToggle" aria-expanded="${!collapsed}" title="${escapeHtml(t(collapsed ? "validation.expandTiles" : "validation.collapseTiles"))}">` +
    `<span class="chev">▾</span></button>`;

  // Click en un tile con destino = saltar a ese campo.
  bar.querySelectorAll("[data-target]").forEach(tile => {
    tile.addEventListener("click", () => scrollToField(tile.dataset.target));
    tile.addEventListener("keydown", event => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      scrollToField(tile.dataset.target);
    });
  });
}

// Split horizontal del formulario y output. El ratio es una preferencia de
// sesión mientras el formulario esté abierto; colapsarlo lo restablece al
// reparto normal de CSS (50/50) antes de abrirlo de nuevo.
function formOutputSplitBounds() {
  const main = $("main");
  const handle = $("formOutputResizer");
  if (!main || !handle) return null;
  const available = main.clientWidth - handle.offsetWidth;
  if (available <= 0) return null;
  // Conserva un formulario utilizable y espacio suficiente para el textarea
  // y sus acciones. En ventanas angostas los mínimos se reducen en conjunto.
  const minForm = Math.min(380, Math.floor(available * 0.45));
  const minOutput = Math.min(360, Math.floor(available * 0.45));
  return { available, min: minForm, max: Math.max(minForm, available - minOutput) };
}

function applyFormOutputSplit(ratio, remember) {
  const formCol = $("formCol");
  const main = $("main");
  const bounds = formOutputSplitBounds();
  if (!formCol || !main || !bounds || formCol.classList.contains("form-collapsed")) return;
  const raw = Number(ratio);
  const safeRatio = Number.isFinite(raw) ? raw : 0.5;
  const width = Math.round(Math.max(bounds.min, Math.min(bounds.max, bounds.available * safeRatio)));
  formCol.style.width = width + "px";
  formCol.style.flex = "0 0 " + width + "px";
  formCol.style.minWidth = bounds.min + "px";
  const handle = $("formOutputResizer");
  if (handle) {
    handle.setAttribute("aria-valuemin", String(Math.round(bounds.min / bounds.available * 100)));
    handle.setAttribute("aria-valuemax", String(Math.round(bounds.max / bounds.available * 100)));
    handle.setAttribute("aria-valuenow", String(Math.round(width / bounds.available * 100)));
  }
  if (remember) state.prefs.formSplitRatio = width / bounds.available;
}

function resetFormOutputSplit() {
  const formCol = $("formCol");
  if (formCol) {
    formCol.style.removeProperty("width");
    formCol.style.removeProperty("flex");
    formCol.style.removeProperty("min-width");
  }
  const handle = $("formOutputResizer");
  if (handle) handle.setAttribute("aria-valuenow", "50");
  delete state.prefs.formSplitRatio;
}

function restoreFormOutputSplit() {
  const formCol = $("formCol");
  const ratio = state.prefs.formSplitRatio;
  if (!formCol || formCol.classList.contains("form-collapsed") || !Number.isFinite(ratio)) return;
  applyFormOutputSplit(ratio, false);
}

function wireFormOutputResizer() {
  const main = $("main");
  const handle = $("formOutputResizer");
  const formCol = $("formCol");
  if (!main || !handle || !formCol) return;
  let pointerId = null;
  const finish = () => {
    if (pointerId == null) return;
    try { handle.releasePointerCapture(pointerId); } catch (e) {}
    pointerId = null;
    main.classList.remove("split-resizing");
    document.body.classList.remove("split-resizing");
    scheduleSave();
  };
  handle.addEventListener("pointerdown", e => {
    if (pointerId != null || e.button !== 0 || formCol.classList.contains("form-collapsed")) return;
    const bounds = formOutputSplitBounds();
    if (!bounds) return;
    e.preventDefault();
    pointerId = e.pointerId;
    handle.setPointerCapture(pointerId);
    main.classList.add("split-resizing");
    document.body.classList.add("split-resizing");
  });
  handle.addEventListener("pointermove", e => {
    if (e.pointerId !== pointerId) return;
    const bounds = formOutputSplitBounds();
    if (!bounds) return;
    const left = main.getBoundingClientRect().left;
    applyFormOutputSplit((e.clientX - left) / bounds.available, true);
  });
  handle.addEventListener("pointerup", finish);
  handle.addEventListener("pointercancel", finish);
  handle.addEventListener("lostpointercapture", finish);
  handle.addEventListener("keydown", event => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
    const bounds = formOutputSplitBounds();
    if (!bounds || formCol.classList.contains("form-collapsed")) return;
    event.preventDefault();
    const current = Number.isFinite(state.prefs.formSplitRatio)
      ? state.prefs.formSplitRatio : formCol.getBoundingClientRect().width / bounds.available;
    const ratio = event.key === "Home" ? bounds.min / bounds.available
      : event.key === "End" ? bounds.max / bounds.available
      : current + (event.key === "ArrowLeft" ? -0.03 : 0.03);
    applyFormOutputSplit(ratio, true);
    scheduleSave();
  });
  window.addEventListener("resize", () => restoreFormOutputSplit());
}

// Al reducir la ventana a un ancho típico de media pantalla, el panel derecho
// deja el formulario como foco. Reabrirlo es una preferencia temporal del
// usuario: se respeta mientras la ventana siga angosta y se vuelve a evaluar
// al recuperar ancho.
const OUTPUT_AUTO_COLLAPSE_MAX_WIDTH = 1100;
function applyOutputPanelCollapse(collapsed) {
  const panel = $("outputPanel");
  const main = $("main");
  const btn = $("outputPanelCollapseBtn");
  if (!panel || !main || !btn) return;
  uiCollapse.output = !!collapsed;
  panel.classList.toggle("output-collapsed", uiCollapse.output);
  main.classList.toggle("output-collapsed", uiCollapse.output);
  btn.innerHTML = uiCollapse.output ? "‹" : "›";
  btn.title = t(uiCollapse.output ? "output.reopenPanel" : "output.collapsePanel");
  btn.setAttribute("aria-label", btn.title);
  btn.setAttribute("aria-expanded", String(!uiCollapse.output));
}

function syncOutputPanelForViewport() {
  const isNarrow = window.innerWidth <= OUTPUT_AUTO_COLLAPSE_MAX_WIDTH;
  if (isNarrow) {
    if (!uiCollapse.outputManualInNarrow) {
      uiCollapse.outputAutoCollapsed = true;
      applyOutputPanelCollapse(true);
    }
    return;
  }
  if (uiCollapse.outputAutoCollapsed) applyOutputPanelCollapse(false);
  uiCollapse.outputAutoCollapsed = false;
  uiCollapse.outputManualInNarrow = false;
}

function syncCollapseControlLabels() {
  const controls = [
    ["formCollapseBtn", "form", "form.collapseTitle", "form.expandTitle"],
    ["mediaCollapseBtn", "media", "media.collapseTitle", "media.expandTitle"],
    ["actionsCollapseBtn", "actions", "output.actionsCollapse", "output.actionsExpand"],
    ["outputPanelCollapseBtn", "output", "output.collapsePanel", "output.reopenPanel"]
  ];
  controls.forEach(([id, key, collapseKey, expandKey]) => {
    const button = $(id);
    if (!button) return;
    const label = t(uiCollapse[key] ? expandKey : collapseKey);
    button.title = label;
    button.setAttribute("aria-label", label);
    button.setAttribute("aria-expanded", String(!uiCollapse[key]));
  });
}

// Compactación: colapso de secciones y repliegue de paneles. Se cablea UNA
// vez en boot sobre elementos persistentes (no se reemplazan, solo su
// innerHTML), así sobrevive a los re-render. El estado vive en uiCollapse.
function wireCollapse() {
  // Secciones: delegación en #formPanel (persistente). Solo el chevron
  // dispara; el nombre no. Toggle de clase directo = respuesta inmediata +
  // animación CSS; el próximo renderForm reaplica la clase desde uiCollapse.
  const panel = $("formPanel");
  if (panel) {
    panel.addEventListener("click", e => {
      const btn = e.target.closest("[data-sec-collapse]");
      if (!btn) return;
      const form = getForm(state.topTab);
      if (!form) return;
      const key = sectionCollapseKey(form, btn.dataset.secCollapse);
      uiCollapse.sections[key] = !uiCollapse.sections[key];
      const sec = btn.closest(".form-section");
      if (sec) sec.classList.toggle("collapsed", uiCollapse.sections[key]);
      btn.setAttribute("aria-expanded", String(!uiCollapse.sections[key]));
    });
  }
  // Paneles: sus cabeceras son markup estático, listeners directos por id.
  const panelToggle = (btnId, elId, cls, key) => {
    const btn = $(btnId), el = $(elId);
    if (!btn || !el) return;
    btn.addEventListener("click", () => {
      // Replegar o reabrir el formulario cancela cualquier ajuste manual y
      // devuelve ambas columnas al reparto normal de CSS al reabrirlo.
      if (key === "form") resetFormOutputSplit();
      uiCollapse[key] = !uiCollapse[key];
      el.classList.toggle(cls, uiCollapse[key]);
      syncCollapseControlLabels();
      if (key === "form") scheduleSave();
    });
  };
  panelToggle("formCollapseBtn",    "formCol",    "form-collapsed",    "form");
  panelToggle("mediaCollapseBtn",   "mediaPanel", "collapsed",         "media");
  panelToggle("actionsCollapseBtn", "outputSide", "actions-collapsed", "actions");
  const outputBtn = $("outputPanelCollapseBtn");
  if (outputBtn) {
    outputBtn.addEventListener("click", () => {
      if (window.innerWidth <= OUTPUT_AUTO_COLLAPSE_MAX_WIDTH) {
        uiCollapse.outputManualInNarrow = true;
        uiCollapse.outputAutoCollapsed = false;
      }
      applyOutputPanelCollapse(!uiCollapse.output);
    });
  }
  window.addEventListener("resize", syncOutputPanelForViewport);
  syncOutputPanelForViewport();
  syncCollapseControlLabels();
}

// Interacciones de la barra de tiles. Se cablean UNA vez sobre elementos
// persistentes (#tilesBar y #formPanel no se reemplazan, solo su innerHTML),
// así que la delegación sobrevive a los re-render de la barra y del form.
function wireTileInteractions() {
  const bar = $("tilesBar");
  const panel = $("formPanel");
  if (!bar || !panel) return;

  // La "llave": colapsar / expandir. El estado se guarda en la sesión.
  // (Este patrón se reutilizará luego para colapsar secciones del form.)
  bar.addEventListener("click", e => {
    if (!e.target.closest("#tilesToggle")) return;
    state.prefs.tilesCollapsed = !state.prefs.tilesCollapsed;
    bar.classList.toggle("collapsed", state.prefs.tilesCollapsed);
    const btn = $("tilesToggle");
    if (btn) {
      btn.title = t(state.prefs.tilesCollapsed ? "validation.expandTiles" : "validation.collapseTiles");
      btn.setAttribute("aria-expanded", String(!state.prefs.tilesCollapsed));
    }
    scheduleSave();
  });

  // Resaltado cruzado: al pasar el mouse o enfocar un campo, todas las tiles
  // que ese campo "toca" se marcan (.tile-hot) y las demás se atenúan.
  let hotField = null;
  const clear = () => {
    if (!hotField) return;
    bar.classList.remove("tiles-focus");
    bar.querySelectorAll(".tile-hot").forEach(tile => tile.classList.remove("tile-hot"));
    hotField = null;
  };
  const apply = (fieldId) => {
    if (fieldId === hotField) return;
    clear();
    let any = false;
    bar.querySelectorAll(".tile[data-fields]").forEach(tile => {
      const fs = (tile.dataset.fields || "").split(" ").filter(Boolean);
      if (fs.includes(fieldId)) { tile.classList.add("tile-hot"); any = true; }
    });
    if (any) { bar.classList.add("tiles-focus"); hotField = fieldId; }
  };
  const leave = (e) => {
    const f = e.target.closest(".field[data-field]");
    if (!f) return;
    if (!e.relatedTarget || !f.contains(e.relatedTarget)) clear();
  };
  panel.addEventListener("mouseover", e => {
    const f = e.target.closest(".field[data-field]");
    if (f) apply(f.dataset.field);
  });
  panel.addEventListener("mouseout", leave);
  panel.addEventListener("focusin", e => {
    const f = e.target.closest(".field[data-field]");
    if (f) apply(f.dataset.field);
  });
  panel.addEventListener("focusout", leave);
}

/* MONOLITH:SECTION 10-validation-rules-tiles END */
/* MONOLITH:SECTION 11-output-generator START */
/* ================================================================
   [11] GENERADOR DE OUTPUT
   ================================================================
   Recorre las secciones en el orden del formulario (el orden visual
   ES el orden del output) y aplica las plantillas de cada campo.
   Nada del texto está fijo en el código: todo sale del schema. */

// Valor crudo de un campo para insertarlo dentro de la plantilla de OTRO
// campo. No se usa su template: así {perfil} inserta solo lo que escribió el
// tester, sin repetir etiquetas, markdown ni crear dependencias recursivas.
function templateValueForField(field, raw) {
  if (Array.isArray(raw)) {
    if (field && field.type === "checklist" && field.allOption &&
        raw.includes(checklistSpecialValue(field))) {
      return field.allOutput || field.allLabel || "Todas las anteriores";
    }
    return raw.map(v => String(v)).join(", ");
  }
  return String(raw == null ? "" : raw);
}

// Busca una media por su id y devuelve el nombre ya generado. null significa
// que falta la fila o alguno de los datos que necesita su formato.
function mediaNameById(inst, id) {
  const form = inst && getForm(inst.formId);
  if (!form) return null;
  const media = normalizeMediaRows(inst, form).find(row => row.id === id);
  if (!media) return null;
  const built = buildMediaName(media, inst, form);
  return built.missing.length ? null : built.name;
}

// Resuelve una plantilla de campo. {value} conserva el valor propio; {id}
// trae el valor crudo de otro campo del mismo formulario y {media:mediaN}
// inserta el nombre generado de esa fila. {{ y }} dejan llaves literales.
function interpolateFieldTemplate(text, field, inst, value) {
  const form = getForm(inst.formId);
  const missingMedia = [];
  const unresolved = [];
  const expanded = protectedTemplateText(unescapeNl(text)).replace(/\{([A-Za-z0-9_.:-]+)\}/g, (match, id) => {
    if (id === "value") return String(value == null ? "" : value);
    if (id.startsWith("media:")) {
      const name = mediaNameById(inst, id.slice("media:".length));
      if (name == null) {
        missingMedia.push(id);
        return "";
      }
      return name;
    }
    const found = form && getField(form, id);
    // Un mirror no tiene valor propio; se evita enlazar outputs entre sí.
    if (!found || found.field.type === "mirror") {
      unresolved.push(id);
      return match;
    }
    return templateValueForField(found.field, inst.values[id]);
  });
  return {
    text: expanded.replace(/\uE000/g, "{").replace(/\uE001/g, "}"),
    missingMedia,
    unresolved
  };
}

// Texto de un campo listo para el output, o null si se omite.
function fieldOutputPart(field, inst) {
  // Las casillas sí/no nunca imprimen: solo alimentan RULES y tiles.
  if (field.type === "checkbox") return null;
  let raw;
  if (field.type === "mirror") raw = inst.values[field.source];
  else raw = inst.values[field.id];

  if (field.type === "keywords") {
    const arr = Array.isArray(raw) ? raw : [];
    if (!arr.length) return null;
    if (field.kwMode === "newline") {
      const kwTpl = field.template || "{value}";
      if (field.kwPerChip !== false) {
        const filled = arr.map(value => interpolateFieldTemplate(kwTpl, field, inst, value));
        if (filled.some(part => part.missingMedia.length)) return null;
        const out = filled.map(part => part.text);
        if (field.kwHeader) out.unshift(unescapeNl(field.kwHeader));
        return out;
      }
      raw = arr.join("\n");
    } else {
      raw = arr.join(unescapeNl(field.kwSep != null ? field.kwSep : ", "));
    }
  }
  if (field.type === "checklist") {
    // Salen solo las opciones marcadas. Inline: una línea unida por el
    // separador. Una por línea: la plantilla se aplica a cada opción.
    // El título opcional se imprime antes (misma línea en inline).
    let arr = Array.isArray(raw) ? raw : [];
    if (!arr.length) return null;
    if (field.allOption && arr.includes(checklistSpecialValue(field))) {
      arr = [field.allOutput || field.allLabel || "Todas las anteriores"];
    }
    const ckTpl = field.template || "{value}";
    const ckFill = (v) => interpolateFieldTemplate(ckTpl, field, inst, v);
    const filled = field.checkLayout === "newline"
      ? arr.map(ckFill)
      : [ckFill(arr.join(unescapeNl(field.checkSep != null ? field.checkSep : ", ")) )];
    if (filled.some(part => part.missingMedia.length)) return null;
    const out = filled.map(part => part.text);
    if (field.checkLayout === "newline") {
      if (field.checkTitle) out.unshift(unescapeNl(field.checkTitle));
      return out;
    }
    return field.checkTitle ? unescapeNl(field.checkTitle) + " " + out[0] : out[0];
  }
  let value = String(raw == null ? "" : raw);
  const hasExternalRefs = templateFieldRefs(field.template).length || templateMediaRefs(field.template).length;
  if (!value.trim()) {
    if (field.emptyAs) value = field.emptyAs;
    // Un mirror compuesto puede no tener source: en ese caso sus referencias
    // externas son el contenido que determina si sale en el output.
    else if (field.type !== "mirror" || !hasExternalRefs) return null;
  }
  if (field.omitValue && value.trim() === field.omitValue) return null;

  // \n y <br> se normalizan antes de resolver cada placeholder. El valor
  // propio se inserta por función para que $&, $' etc. permanezcan literales.
  const tpl = field.template || "{value}";
  const fill = (v) => interpolateFieldTemplate(tpl, field, inst, v);
  if (field.perLine) {
    const lines = value.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) return null;
    const out = lines.map(fill);
    if (out.some(part => part.missingMedia.length)) return null;
    const result = out.map(part => part.text);
    // Encabezado opcional: una línea fija antes de las líneas plantillada,
    // p. ej. "* *Material:*" seguido de "** mp/asset01", "** mp/asset02"...
    if (field.perLineHeader) {
      const header = interpolateFieldTemplate(field.perLineHeader, field, inst, value);
      if (header.missingMedia.length) return null;
      result.unshift(header.text);
    }
    return result;
  }
  const result = fill(value);
  return result.missingMedia.length ? null : result.text;
}

function buildOutput(inst) {
  const form = getForm(inst.formId);
  if (!form) return { full: "", summary: "", description: "", segments: [], ranges: {} };
  const blocks = [];
  let summaryLine = "";
  const partIndexByField = Object.create(null);
  // Campos ocultos por condición: fuera del output
  const fx = evalFieldRules(form, inst);

  // Cada entrada conserva qué fracción sale de la plantilla del campo. Los
  // encabezados y separadores quedan sin segmento: se pueden editar, pero no
  // desconectan ningún campo del formulario.
  const outputEntries = (field, part) => {
    const arr = Array.isArray(part) ? part : [part];
    let untrackedHeaders = 0;
    if (Array.isArray(part)) {
      if (field.type === "checklist" && field.checkLayout === "newline" && field.checkTitle) untrackedHeaders = 1;
      else if (field.type === "keywords" && field.kwMode === "newline" && field.kwPerChip !== false && field.kwHeader) untrackedHeaders = 1;
      else if (field.perLine && field.perLineHeader) untrackedHeaders = 1;
    }
    const inlinePrefix = !Array.isArray(part) && field.type === "checklist" &&
      field.checkLayout !== "newline" && field.checkTitle
      ? unescapeNl(field.checkTitle).length + 1 : 0;
    return arr.map((text, index) => ({
      text: String(text),
      trackStart: index < untrackedHeaders ? null : (index === 0 ? inlinePrefix : 0)
    }));
  };
  const newLine = () => ({ text: "", segments: [] });
  const appendEntry = (line, entry, prefix, fieldId) => {
    const leading = prefix || "";
    const base = line.text.length + leading.length;
    line.text += leading + entry.text;
    if (entry.trackStart != null && entry.trackStart < entry.text.length) {
      const index = partIndexByField[fieldId] || 0;
      line.segments.push({
        fieldId,
        index,
        start: base + entry.trackStart,
        end: base + entry.text.length
      });
      partIndexByField[fieldId] = index + 1;
    }
  };

  form.sections.forEach(sec => {
    const lines = [];
    if (sec.mode === "joined") {
      // Todo en una sola línea, con separadores por campo
      const line = newLine();
      sec.fields.forEach(field => {
        if (fx[field.id] && fx[field.id].hidden) return;
        const part = fieldOutputPart(field, inst);
        if (part == null) return;
        const entries = outputEntries(field, part);
        const fieldText = entries.map(entry => entry.text).join(" ");
        const prefix = line.text ? unescapeNl(field.sep != null ? field.sep : (sec.sep != null ? sec.sep : " - ")) : "";
        // Conserva los rangos de cada entrada aunque varias compongan la misma
        // línea de una sección unida.
        const base = line.text.length + prefix.length;
        line.text += prefix + fieldText;
        let entryOffset = 0;
        entries.forEach((entry, index) => {
          if (entry.trackStart != null && entry.trackStart < entry.text.length) {
            const partIndex = partIndexByField[field.id] || 0;
            line.segments.push({ fieldId: field.id, index: partIndex,
              start: base + entryOffset + entry.trackStart,
              end: base + entryOffset + entry.text.length });
            partIndexByField[field.id] = partIndex + 1;
          }
          entryOffset += entry.text.length + (index < entries.length - 1 ? 1 : 0);
        });
      });
      if (line.text) {
        lines.push(line);
        if (!summaryLine) summaryLine = line.text;
      }
    } else {
      // Cada campo aporta su(s) línea(s)
      sec.fields.forEach(field => {
        if (fx[field.id] && fx[field.id].hidden) return;
        const part = fieldOutputPart(field, inst);
        if (part == null) return;
        const entries = outputEntries(field, part);
        if (field.joinPrev) {
          // Continúa en la línea anterior; si no hay línea previa
          // (p. ej. timestamp vacío) no se imprime suelto.
          if (!lines.length) return;
          const sep = unescapeNl(field.sep != null ? field.sep : " ");
          appendEntry(lines[lines.length - 1], entries[0], sep, field.id);
          entries.slice(1).forEach(entry => {
            const line = newLine();
            appendEntry(line, entry, "", field.id);
            lines.push(line);
          });
        } else {
          entries.forEach(entry => {
            const line = newLine();
            appendEntry(line, entry, "", field.id);
            lines.push(line);
          });
        }
      });
      if (lines.length && sec.heading) {
        const heading = newLine();
        heading.text = unescapeNl(sec.heading);
        lines.unshift(heading);
      }
    }
    if (lines.length) blocks.push({ lines, noGap: !!sec.noGap });
  });

  const out = [];
  blocks.forEach((b, i) => {
    out.push(...b.lines);
    if (i < blocks.length - 1 && !b.noGap) out.push(newLine());
  });
  const segments = [];
  let cursor = 0;
  out.forEach((line, index) => {
    (line.segments || []).forEach(segment => segments.push({ ...segment,
      start: segment.start + cursor, end: segment.end + cursor }));
    cursor += line.text.length + (index < out.length - 1 ? 1 : 0);
  });

  // Chunks para los botones de copia:
  //   summary     = la línea de la PRIMERA sección (la unida por guiones)
  //   description = todas las demás secciones
  const isSummaryFirst = blocks.length > 0 && !!summaryLine
                      && blocks[0].lines.length === 1
                      && blocks[0].lines[0].text === summaryLine;
  const rest = [];
  blocks.forEach((b, i) => {
    if (isSummaryFirst && i === 0) return;
    rest.push(...b.lines);
    if (i < blocks.length - 1 && !b.noGap) rest.push(newLine());
  });
  while (rest.length && rest[rest.length - 1].text === "") rest.pop();
  const full = out.map(line => line.text).join("\n");
  const summary = isSummaryFirst ? summaryLine : "";
  const description = rest.map(line => line.text).join("\n");
  const ranges = {

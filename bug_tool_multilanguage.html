async function saveSessionToFile() {
  const snap = {
    exportedAt: new Date().toISOString(),
    config: config,
    session: {
      topTab: state.topTab,
      instances: state.instances,
      activeInstanceId: state.activeInstanceId,
      notebook: state.notebook
    }
  };
  await downloadFile("bug_session_" + isoStamp() + ".json", JSON.stringify(snap, null, 2));
}

function loadSessionFromFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const snap = JSON.parse(e.target.result);
      if (!snap.session) throw new Error(t("session.invalidFile"));
      const apply = () => {
        if (snap.config && snap.config.schema && snap.config.data) {
          config = normalizeConfig(snap.config);
        }
        state.instances = snap.session.instances || [];
        state.activeInstanceId = snap.session.activeInstanceId
          || (state.instances[0] ? state.instances[0].id : null);
        state.topTab = snap.session.topTab || (getForms()[0] && getForms()[0].id);
        state.notebook = snap.session.notebook || { tabs: [], activeTabId: "", mode: "closed" };
        ensureSessionConsistency();
        refreshAll();
        scheduleSave();
        flashBanner(t("session.loaded"));
      };
      if (state.instances.some(i => i.dirty)) {
        showConfirmModal({
          title: t("session.loadTitle"),
          body: t("session.loadBody"),
          confirmText: t("session.replace"),
          confirmClass: "danger",
          onConfirm: apply
        });
      } else {
        apply();
      }
    } catch (err) {
      flashBanner(t("session.loadError", { error: err.message }), true);
    }
  };
  reader.readAsText(file);
}

// ---- Modales ----
// Cascarón común: título, cuerpo y ancho. Devuelve el contenedor de
// acciones ya vacío para que cada modal agregue lo suyo.
let modalReturnFocus = null;
function openModalShell(title, bodyHtml, wide) {
  modalReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  $("modalBox").classList.toggle("wide", !!wide);
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = bodyHtml;
  const actions = $("modalActions");
  actions.innerHTML = "";
  return actions;
}

// Par estándar Cancelar / botón principal, y abre el modal.
// `onOk` decide el cierre (los modales de confirmación cierran ellos mismos
// antes de ejecutar; el editor permanece abierto si onConfirm devuelve false).
function addModalButtons(actions, { cancelText, okText, okClass, onOk }) {
  const cancel = document.createElement("button");
  cancel.textContent = cancelText || t("common.cancel");
  cancel.addEventListener("click", closeModal);
  actions.appendChild(cancel);
  const ok = document.createElement("button");
  ok.textContent = okText || t("common.ok");
  if (okClass) ok.classList.add(okClass);
  ok.addEventListener("click", onOk);
  actions.appendChild(ok);
  $("modal").classList.add("open");
  setTimeout(() => ok.focus(), 0);
}

function showConfirmModal({ title, body, confirmText, cancelText, confirmClass, showDontAsk, onConfirm }) {
  const actions = openModalShell(title || t("common.confirm"), body || "", false);
  if (showDontAsk) {
    const lbl = document.createElement("label");
    lbl.className = "checkbox";
    lbl.style.marginRight = "auto";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.id = "modalDontAsk";
    lbl.append(input, document.createTextNode(" " + t("common.dontAsk")));
    actions.appendChild(lbl);
  }
  addModalButtons(actions, {
    cancelText,
    okText: confirmText,
    okClass: confirmClass,
    onOk: () => {
      const dontAsk = $("modalDontAsk");
      closeModal();
      onConfirm(dontAsk ? dontAsk.checked : false);
    }
  });
}

function showPromptModal({ title, body, placeholder, initialValue, confirmText, onConfirm }) {
  const actions = openModalShell(title || t("common.enterValue"),
    (body ? `<div style="margin-bottom:8px;">${escapeHtml(body)}</div>` : "")
    + `<input type="text" id="modalPromptInput" placeholder="${escapeHtml(placeholder || "")}" value="${escapeHtml(initialValue || "")}" />`,
    false);
  const submit = () => {
    const v = $("modalPromptInput").value;
    closeModal();
    onConfirm(v);
  };
  addModalButtons(actions, { okText: confirmText, okClass: "primary", onOk: submit });
  setTimeout(() => {
    const inp = $("modalPromptInput");
    inp.focus();
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }, 50);
}

// Selector simple para decisiones cerradas (mismo <select> nativo de RULES).
function showSelectModal({ title, body, options, confirmText, onConfirm }) {
  const normalizedOptions = (options || []).map(option => typeof option === "string"
    ? { value: option, label: option }
    : { value: String(option.value == null ? "" : option.value), label: String(option.label == null ? option.value : option.label) });
  const actions = openModalShell(title || t("common.selectValue"),
    (body ? `<div style="margin-bottom:8px;">${escapeHtml(body)}</div>` : "")
    + `<select id="modalSelectInput" style="width:100%">${
      normalizedOptions.map(option => `<option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>`).join("")
    }</select>`,
    false);
  addModalButtons(actions, {
    okText: confirmText,
    okClass: "primary",
    onOk: () => {
      const v = $("modalSelectInput").value;
      closeModal();
      onConfirm(v);
    }
  });
  setTimeout(() => $("modalSelectInput").focus(), 50);
}

// Modal genérico para los editores de sección/campo.
// onConfirm devuelve false para mantener el modal abierto (error).
function showEditorModal({ title, bodyHtml, wide, onOpen, onConfirm }) {
  const actions = openModalShell(title || "", bodyHtml || "", wide);
  addModalButtons(actions, {
    okText: t("common.save"),
    okClass: "primary",
    onOk: () => { if (onConfirm() !== false) closeModal(); }
  });
  if (onOpen) onOpen();
}

function closeModal() {
  const wasOpen = $("modal").classList.contains("open");
  $("modal").classList.remove("open");
  $("modalBox").classList.remove("wide");
  if (wasOpen && modalReturnFocus && document.contains(modalReturnFocus)) {
    modalReturnFocus.focus();
  }
  modalReturnFocus = null;
}

// ---- Banner ----
let bannerTimer = null;
function flashBanner(text, isError) {
  const b = $("banner");
  $("bannerText").textContent = text;
  $("bannerDismiss").style.display = isError ? "inline-block" : "none";
  b.classList.remove("hidden", "error");
  if (isError) b.classList.add("error");
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.add("hidden"), isError ? 6000 : 3000);
}

/* MONOLITH:SECTION 17-session-modals-controls END */
/* MONOLITH:SECTION 18-boot START */
/* ================================================================
   [18] BOOT Y CONEXIÓN DE CONTROLES FIJOS
   ================================================================ */
function wireStaticControls() {
  // Preferencias visuales independientes de config/session: no ensucian el
  // indicador de configuración y se pueden alternar sin perder formularios.
  $("languageSelect").value = appearance.language;
  $("themeSelect").value = appearance.theme;
  $("languageSelect").addEventListener("change", event => {
    setLanguage(event.target.value, true, true);
  });
  $("themeSelect").addEventListener("change", event => {
    setTheme(event.target.value, true);
  });

  // Pestañas fijas Data / Rules
  const activateFixedTab = el => {
    state.topTab = el.dataset.tab;
    refreshAll();
    scheduleSave();
  };
  document.querySelectorAll("#topTabs [data-tab]").forEach(el => {
    el.addEventListener("click", () => activateFixedTab(el));
    el.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        activateFixedTab(el);
      }
    });
  });

  // Menús desplegables
  document.querySelectorAll(".menu-wrap").forEach(wrap => {
    const trigger = wrap.querySelector(":scope > button");
    trigger.setAttribute("aria-expanded", "false");
    trigger.addEventListener("click", (e) => {
      e.stopPropagation();
      const wasOpen = wrap.classList.contains("open");
      document.querySelectorAll(".menu-wrap.open").forEach(w => w.classList.remove("open"));
      if (!wasOpen) wrap.classList.add("open");
      document.querySelectorAll(".menu-wrap").forEach(menu => {
        const button = menu.querySelector(":scope > button");
        if (button) button.setAttribute("aria-expanded", String(menu.classList.contains("open")));
      });
    });
    wrap.querySelectorAll(".menu-pop button").forEach(b =>
      b.addEventListener("click", () => {
        wrap.classList.remove("open");
        trigger.setAttribute("aria-expanded", "false");
      }));
  });
  document.addEventListener("mousedown", (e) => {
    if (!e.target.closest(".menu-wrap")) {
      document.querySelectorAll(".menu-wrap.open").forEach(w => {
        w.classList.remove("open");
        const button = w.querySelector(":scope > button");
        if (button) button.setAttribute("aria-expanded", "false");
      });
    }
    if (!e.target.closest(".autocomplete")) {
      document.querySelectorAll(".autocomplete.open").forEach(el => closeAutocomplete(el));
    }
  });

  // Botón de modo edición
  $("editToggle").addEventListener("click", () => {
    state.editMode = !state.editMode;
    renderForm();
  });
  $("exportToOtherFormBtn").addEventListener("click", showExportToOtherFormModal);
  $("fieldDragModeToggle").addEventListener("change", e => {
    state.prefs.dragFields = e.target.checked;
    renderForm();
    scheduleSave();
  });
  $("addSectionTopBtn").addEventListener("click", () => {
    const form = getForm(state.topTab);
    if (form) showSectionEditor(form, null);
  });
  wireFormSearch();

  // Exportar herramienta / CSVs / sesión
  $("exportToolBtn").addEventListener("click", exportToolHtml);
  $("exportDataBtn").addEventListener("click", exportDataCsv);
  $("exportFieldsBtn").addEventListener("click", exportFieldsCsv);
  $("dataExportBtn").addEventListener("click", exportDataCsv);
  $("importDataBtn").addEventListener("click", () => $("dataCsvInput").click());
  $("dataImportBtn").addEventListener("click", () => $("dataCsvInput").click());
  $("importFieldsBtn").addEventListener("click", () => $("fieldsCsvInput").click());
  $("saveSessionBtn").addEventListener("click", saveSessionToFile);
  $("loadSessionBtn").addEventListener("click", () => $("sessionFileInput").click());

  $("dataCsvInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        importDataCsv(ev.target.result);
        flashBanner(t("boot.dataLoaded", { name: file.name }));
      } catch (err) {
        flashBanner(t("boot.dataCsvError", { error: err.message }), true);
      }
    };
    reader.readAsText(file);
  });
  $("fieldsCsvInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try { importFieldsCsv(ev.target.result); }
      catch (err) { flashBanner(t("boot.fieldsCsvError", { error: err.message }), true); }
    };
    reader.readAsText(file);
  });
  $("sessionFileInput").addEventListener("change", (e) => {
    if (e.target.files[0]) loadSessionFromFile(e.target.files[0]);
    e.target.value = "";
  });

  // Restaurar vanilla / borrar todo
  $("resetVanillaBtn").addEventListener("click", () => {
    showConfirmModal({
      title: t("session.resetTitle"),
      body: t("session.resetBody"),
      confirmText: t("session.reset"),
      confirmClass: "danger",
      onConfirm: () => {
        config = deepClone(vanilla);
        ensureSessionConsistency();
        refreshAll();
        scheduleSave();
      }
    });
  });
  $("clearLocalBtn").addEventListener("click", () => {
    showPromptModal({
      title: t("session.clearTitle"),
      body: t("session.clearBody"),
      placeholder: t("session.clearPlaceholder"),
      confirmText: t("session.clearAll"),
      onConfirm: (v) => {
        if (!["BORRAR", "DELETE"].includes(String(v || "").trim().toUpperCase())) {
          flashBanner(t("session.cancelled"), true); return;
        }
        // Evitar que el guardado de beforeunload re-escriba lo borrado
        suppressSave = true;
        if (saveTimer) clearTimeout(saveTimer);
        Storage.remove(CONFIG_KEY);
        Storage.remove(SESSION_KEY);
        Storage.writeJson(UI_PREFS_KEY, { language: "es", theme: "light" });
        location.reload();
      }
    });
  });

  // Toolbar de la pestaña DATA
  $("addRowBtn").addEventListener("click", addDataRow);
  $("addListBtn").addEventListener("click", addNewList);
  $("addLinkBtn").addEventListener("click", addChildList);

  // Output editable a mano
  $("outputTextarea").addEventListener("input", (e) => {
    const inst = getActiveInstance();
    if (!inst) return;
    captureOutputTextareaEdit(inst, e.target.value);
    renderOutputPreview(e.target.value);
    markInstanceDirty(inst);
  });
  $("outputTextarea").addEventListener("blur", () => {
    saveAll();
    setSaveIndicator("saved");
  });
  $("notebookTabs").addEventListener("click", (e) => {
    const close = e.target.closest("[data-notebook-close]");
    const edit = e.target.closest("[data-notebook-edit]");
    const tab = e.target.closest("[data-notebook-tab]");
    normalizeNotebook();
    if (close) {
      state.notebook.tabs = state.notebook.tabs.filter(item => item.id !== close.dataset.notebookClose);
      if (!state.notebook.tabs.length) state.notebook.tabs.push({ id: newId(), title: t("notebook.defaultTitle"), content: "" });
      if (!state.notebook.tabs.some(item => item.id === state.notebook.activeTabId)) {
        state.notebook.activeTabId = state.notebook.tabs[0].id;
      }
      saveNotebook();
    } else if (edit) {
      renameNotebookTab(state.notebook.tabs.find(item => item.id === edit.dataset.notebookEdit));
    } else if (tab) {
      state.notebook.activeTabId = tab.dataset.notebookTab;
      if (state.notebook.mode === "closed") state.notebook.mode = "half";
      saveNotebook();
    }
  });
  $("notebookTabs").addEventListener("dblclick", (e) => {
    const tabEl = e.target.closest("[data-notebook-tab]");
    if (!tabEl) return;
    const tab = state.notebook.tabs.find(item => item.id === tabEl.dataset.notebookTab);
    renameNotebookTab(tab);
  });
  $("notebookAddBtn").addEventListener("click", () => {
    normalizeNotebook();
    const tab = { id: newId(), title: nextNotebookTitle(state.notebook.tabs), content: "" };
    state.notebook.tabs.push(tab);
    state.notebook.activeTabId = tab.id;
    state.notebook.mode = "half";
    saveNotebook();
  });
  $("notebookHalfBtn").addEventListener("click", () => setNotebookMode("half"));
  $("notebookFullBtn").addEventListener("click", () => setNotebookMode("full"));
  $("notebookCloseBtn").addEventListener("click", () => setNotebookMode("closed"));
  $("notesTextarea").addEventListener("input", (e) => {
    const tab = activeNotebookTab();
    if (!tab) return;
    tab.content = e.target.value;
    scheduleSave();
  });
  $("notesTextarea").addEventListener("blur", () => {
    saveAll();
    setSaveIndicator("saved");
  });

  // Modal: doble click fuera o Escape para cerrar. El doble click evita perder
  // cambios cuando una selección de texto termina accidentalmente en el fondo.
  $("modal").addEventListener("dblclick", (e) => {
    if (e.target.id === "modal") closeModal();
  });
  $("modal").addEventListener("keydown", event => {
    if (event.key !== "Tab" || !$("modal").classList.contains("open")) return;
    const focusable = [...$("modalBox").querySelectorAll(
      'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
    )].filter(el => !el.hidden && el.offsetParent !== null);
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault(); last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault(); first.focus();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });
  $("bannerDismiss").addEventListener("click", () => $("banner").classList.add("hidden"));

  // Última oportunidad de guardar al cerrar la ventana
  window.addEventListener("beforeunload", () => saveAll());
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") saveAll();
  });
  // La misma herramienta abierta en otra ventana comparte las pestañas y el
  // texto del bloc mediante localStorage. La última edición guardada gana si
  // dos ventanas modifican exactamente la misma nota a la vez.
  window.addEventListener("storage", (e) => {
    if (e.key !== SESSION_KEY || !e.newValue) return;
    try {
      const snap = JSON.parse(e.newValue);
      if (!snap.notebook) return;
      state.notebook = snap.notebook;
      normalizeNotebook();
      renderNotebook();
    } catch (err) {
      console.error("notebook sync", err);
    }
  });
}

function boot() {
  validateMessageCatalogs();
  setTheme(appearance.theme, false);
  setLanguage(appearance.language, false, false);
  persistAppearance();
  try {
    loadVanillaConfig();
  } catch (e) {
    document.body.innerHTML = `<div style="padding:40px;font-family:sans-serif;">
      <h2>${escapeHtml(t("boot.configDamagedTitle"))}</h2>
      <p>${escapeHtml(t("boot.configDamaged", { error: e.message }))}</p>
      <p>${escapeHtml(t("boot.configDamagedHelp"))}</p>
    </div>`;
    return;
  }
  normalizeConfig(vanilla);
  loadConfig();
  loadSession();

  // Sanear la sesión restaurada contra el schema actual
  ensureSessionConsistency();

  wireStaticControls();
  wireMediaPanel();
  wireTileInteractions();
  wireFormOutputResizer();
  wireCollapse();
  refreshAll();
  restoreFormOutputSplit();
}

boot();
/* MONOLITH:SECTION 18-boot END */
</script>

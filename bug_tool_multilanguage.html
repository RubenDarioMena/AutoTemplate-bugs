    full: { start: 0, end: full.length },
    summary: { start: 0, end: summary.length },
    description: { start: description ? full.length - description.length : full.length, end: full.length }
  };
  return { full, summary, description, segments, ranges };
}

function activeNotebookTab() {
  normalizeNotebook();
  return state.notebook.tabs.find(tab => tab.id === state.notebook.activeTabId) || state.notebook.tabs[0];
}

function nextNotebookTitle(tabs) {
  const used = new Set((tabs || []).map(tab => {
    const match = /^(?:nota|note)\s+(\d+)$/i.exec(String(tab && tab.title || "").trim());
    return match ? +match[1] : 0;
  }).filter(Boolean));
  let n = 1;
  while (used.has(n)) n++;
  return t("notebook.noteNumber", { count: n });
}

function renameNotebookTab(tab) {
  if (!tab) return;
  showPromptModal({
    title: t("notebook.renameTitle"),
    body: t("notebook.renameBody"),
    placeholder: t("notebook.namePlaceholder"),
    initialValue: tab.title,
    confirmText: t("common.save"),
    onConfirm: value => {
      const title = String(value || "").trim();
      if (!title) { flashBanner(t("notebook.nameRequired"), true); return; }
      tab.title = title;
      saveNotebook();
    }
  });
}

function renderNotebook() {
  const box = $("outputNotes");
  const tabsEl = $("notebookTabs");
  const notes = $("notesTextarea");
  if (!box || !tabsEl || !notes) return;
  const book = state.notebook;
  const active = activeNotebookTab();
  box.className = "output-notes " + book.mode;

    <button type="button" class="notebook-tab-edit" data-notebook-edit="${escapeHtml(tab.id)}" title="${escapeHtml(t("notebook.renameTab", { title: tab.title }))}" aria-label="${escapeHtml(t("notebook.renameTab", { title: tab.title }))}">✎</button>
    ${book.tabs.length > 1 ? `<button type="button" class="notebook-tab-close" data-notebook-close="${escapeHtml(tab.id)}" title="${escapeHtml(t("notebook.closeNote"))}" aria-label="${escapeHtml(t("notebook.closeTab", { title: tab.title }))}">×</button>` : ""}
  </span>`).join("");
  if (document.activeElement !== notes) notes.value = active.content;
  $("notebookHalfBtn").classList.toggle("active", book.mode === "half");
  $("notebookFullBtn").classList.toggle("active", book.mode === "full");
}

function saveNotebook() {
  renderNotebook();
  scheduleSave();
}

function setNotebookMode(mode) {
  normalizeNotebook();
  state.notebook.mode = mode;
  saveNotebook();
  if (mode !== "closed") $("notesTextarea").focus();
}

function outputDetachedFieldIds(inst, segments) {
  return Object.keys(inst.outputDetached || {}).filter(fieldId => {
    const parts = inst.outputDetached[fieldId] && inst.outputDetached[fieldId].parts;
    return parts && typeof parts === "object" && (segments || []).some(segment =>
      segment.fieldId === fieldId && typeof parts[segment.index] === "string");
  });
}

function outputIsLegacyManual(inst) {
  if (!inst.outputEdited || Object.keys(inst.outputDetached || {}).length) return false;
  return !Array.isArray(inst.outputSegments) || !inst.outputSegments.length;
}

// La salida canónica sigue siendo texto plano. Estas vistas sólo interpretan
// la copia visible para que el tester pueda comprobar el aspecto final sin
// alterar templates, rangos de output ni el texto que se copia.
function normalizeOutputPreviewMode(mode) {
  return ["jira", "markdown"].includes(mode) ? mode : "plain";
}

function outputPreviewLine(line, mode) {
  const text = String(line == null ? "" : line);
  if (!text) return { type: "spacer", text: "" };
  if (mode === "jira") {
    const list = text.match(/^([*#]+)\s+(.+)$/);
    if (list) return {
      type: list[1][list[1].length - 1] === "*" ? "ul" : "ol",
      markers: list[1],
      text: list[2]
    };
  }
  if (mode === "markdown") {
    const heading = text.match(/^(#{1,6})\s+(.+)$/);
    if (heading) return { type: "heading", level: heading[1].length, text: heading[2] };
    const unordered = text.match(/^[-*+]\s+(.+)$/);
    if (unordered) return { type: "ul", text: unordered[1] };
    const ordered = text.match(/^\d+[.)]\s+(.+)$/);
    if (ordered) return { type: "ol", text: ordered[1] };
    const quote = text.match(/^>\s?(.+)$/);
    if (quote) return { type: "quote", text: quote[1] };
  }
  return { type: "paragraph", text };
}

function jiraCodeFence(line) {
  const match = String(line == null ? "" : line).trim().match(/^\{code(?::([A-Za-z0-9_+-]+))?\}$/i);
  return match ? { language: match[1] || "" } : null;
}

function appendJiraCodeBlock(parent, block) {
  const pre = document.createElement("pre");
  const code = document.createElement("code");
  if (block.language) code.dataset.language = block.language;
  code.textContent = block.lines.join("\n");
  pre.append(code);
  parent.append(pre);
}

function safePreviewUrl(value) {
  try {
    const url = new URL(String(value || ""), window.location.href);
    return ["http:", "https:", "mailto:"].includes(url.protocol) ? url.href : "";
  } catch (e) {
    return "";
  }
}

function jiraInlineBoundary(text, index) {
  if (index < 0 || index >= text.length) return true;
  return !/[\p{L}\p{N}_]/u.test(text[index]);
}

function jiraClosingDelimiter(text, delimiter, start) {
  for (let index = start + 1; index < text.length; index++) {
    if (text[index] !== delimiter) continue;
    if (/\s/.test(text[index - 1] || "") || !jiraInlineBoundary(text, index + 1)) continue;
    return index;
  }
  return -1;
}

function appendJiraPreviewInline(parent, source) {
  const text = String(source == null ? "" : source);
  let plain = "";
  const flushPlain = () => {
    if (!plain) return;
    parent.append(document.createTextNode(plain));
    plain = "";
  };
  for (let index = 0; index < text.length;) {
    if (text.startsWith("{{", index)) {
      const close = text.indexOf("}}", index + 2);
      if (close >= 0) {
        flushPlain();
        const code = document.createElement("code");
        code.textContent = text.slice(index + 2, close);
        parent.append(code);
        index = close + 2;
        continue;
      }
    }
    if (text[index] === "[") {
      const rest = text.slice(index);
      const link = rest.match(/^\[([^\]|\n]+)\|([^\]\n]+)\]/);
      const attachment = rest.match(/^\[\^([^\]\n]+)\]/);
      const mention = rest.match(/^\[~([^\]\n]+)\]/);
      const token = link || attachment || mention;
      if (token) {
        flushPlain();
        const element = document.createElement("span");
        element.className = "jira-preview-link";
        appendJiraPreviewInline(element, token[1]);
        parent.append(element);
        index += token[0].length;
        continue;
      }
    }
    const delimiter = text[index];
    if (["*", "+", "_"].includes(delimiter)
        && jiraInlineBoundary(text, index - 1)
        && !/\s/.test(text[index + 1] || "")) {
      const close = jiraClosingDelimiter(text, delimiter, index);
      if (close >= 0) {
        flushPlain();
        const element = document.createElement(delimiter === "*" ? "strong" : delimiter === "+" ? "u" : "em");
        appendJiraPreviewInline(element, text.slice(index + 1, close));
        parent.append(element);
        index = close + 1;
        continue;
      }
    }
    plain += text[index];
    index++;
  }
  flushPlain();
}

function appendOutputPreviewInline(parent, source, mode) {
  const text = String(source == null ? "" : source);
  if (mode === "jira") {
    appendJiraPreviewInline(parent, text);
    return;
  }
  const pattern = /(\[([^\]\n]+)\]\(([^)\s]+)\)|\*\*([^*\n]+)\*\*|__([^_\n]+)__|~~([^~\n]+)~~|`([^`\n]+)`|\*([^*\n]+)\*|_([^_\n]+)_)/g;
  let cursor = 0;
  let match;
  while ((match = pattern.exec(text))) {
    if (match.index > cursor) parent.append(document.createTextNode(text.slice(cursor, match.index)));
    let element;
    if (match[2]) {
      const href = safePreviewUrl(match[3]);
      element = href ? document.createElement("a") : document.createElement("span");
      if (href) { element.href = href; element.target = "_blank"; element.rel = "noopener noreferrer"; }
      element.textContent = match[2];
    } else if (match[4] || match[5]) element = document.createElement("strong");
    else if (match[6]) element = document.createElement("s");
    else if (match[7]) element = document.createElement("code");
    else element = document.createElement("em");
    if (element.textContent === "") element.textContent = match[4] || match[5] || match[6] || match[7] || match[8] || match[9] || "";
    parent.append(element);
    cursor = pattern.lastIndex;
  }
  if (cursor < text.length) parent.append(document.createTextNode(text.slice(cursor)));
}

function renderOutputPreview(text) {
  const preview = $("outputPreview");
  const wrap = preview && preview.closest(".output-textarea-wrap");
  const hint = $("outputPreviewHint");
  const mode = normalizeOutputPreviewMode(state.prefs.outputPreviewMode);
  if (state.prefs.outputPreviewMode !== mode) state.prefs.outputPreviewMode = mode;
  if (!preview || !wrap) return;
  wrap.classList.toggle("previewing", mode !== "plain");
  if (hint) hint.textContent = mode === "plain" ? "" : t("output.previewHint", {
    mode: mode === "jira" ? "Jira" : "Markdown"
  });
  preview.replaceChildren();
  if (mode === "plain") return;
  const source = String(text == null ? "" : text);
  if (!source) {
    const empty = document.createElement("p");
    empty.className = "output-preview-empty";
    empty.textContent = t("output.previewEmpty");
    preview.append(empty);
    return;
  }
  const fragment = document.createDocumentFragment();
  let activeLists = [];
  let codeBlock = null;
  source.split("\n").forEach(line => {
    const fence = mode === "jira" ? jiraCodeFence(line) : null;
    if (fence) {
      activeLists = [];
      if (codeBlock) {
        appendJiraCodeBlock(fragment, codeBlock);
        codeBlock = null;
      } else {
        codeBlock = { language: fence.language, lines: [] };
      }
      return;
    }
    if (codeBlock) {
      codeBlock.lines.push(line);
      return;
    }
    const block = outputPreviewLine(line, mode);
    if (block.type === "ul" || block.type === "ol") {
      const markers = mode === "jira" ? block.markers : (block.type === "ul" ? "*" : "#");
      const types = [...markers].map(marker => marker === "*" ? "ul" : "ol");
      let common = 0;
      while (common < activeLists.length && common < types.length
          && activeLists[common].type === types[common]) common++;
      activeLists.length = common;
      for (let depth = common; depth < types.length; depth++) {
        const list = document.createElement(types[depth]);
        if (depth === 0) fragment.append(list);
        else {
          const parent = activeLists[depth - 1];
          if (!parent.lastItem) {
            parent.lastItem = document.createElement("li");
            parent.list.append(parent.lastItem);
          }
          parent.lastItem.append(list);
        }
        activeLists.push({ type: types[depth], list, lastItem: null });
      }
      const item = document.createElement("li");
      appendOutputPreviewInline(item, block.text, mode);
      const current = activeLists[activeLists.length - 1];
      current.list.append(item);
      current.lastItem = item;
      return;
    }
    activeLists = [];
    if (block.type === "spacer") {
      const spacer = document.createElement("div");
      spacer.className = "preview-spacer";
      fragment.append(spacer);
      return;
    }
    const element = document.createElement(block.type === "heading" ? `h${block.level}`
      : block.type === "quote" ? "blockquote" : "p");
    appendOutputPreviewInline(element, block.text, mode);
    fragment.append(element);
  });
  if (codeBlock) appendJiraCodeBlock(fragment, codeBlock);
  preview.append(fragment);
}

function renderOutputPreviewControls() {
  const controls = $("outputPreviewControls");
  if (!controls) return;
  const mode = normalizeOutputPreviewMode(state.prefs.outputPreviewMode);
  controls.innerHTML = "";
  [["jira", "Jira"], ["markdown", "Markdown"]].forEach(([id, label]) => {
    const switchLabel = document.createElement("label");
    switchLabel.className = "output-preview-switch";
    switchLabel.append(document.createTextNode(label));
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = mode === id;
    input.setAttribute("role", "switch");
    input.setAttribute("aria-label", t(id === "jira" ? "output.previewJira" : "output.previewMarkdown"));
    input.addEventListener("change", () => {
      state.prefs.outputPreviewMode = input.checked ? id : "plain";
      renderOutputPreview($("outputTextarea").value);
      renderOutputPreviewControls();
      scheduleSave();
    });
    const track = document.createElement("span");
    track.className = "output-preview-switch-track";
    switchLabel.append(input, track);
    controls.append(switchLabel);
  });
}

function renderOutputDisconnectBadge(inst, segments) {
  const badge = $("outputDisconnectBadge");
  if (!badge) return;
  const fields = outputDetachedFieldIds(inst, segments);
  const legacy = outputIsLegacyManual(inst);
  if (legacy) {
    badge.textContent = t("output.disconnectedLegacy");
    badge.classList.add("visible");
  } else if (fields.length) {
    badge.textContent = tp("output.disconnected", fields.length);
    badge.classList.add("visible");
  } else {
    badge.textContent = "";
    badge.classList.remove("visible");
  }
}

function applyOutputDetachment(chunks, detached) {
  const segments = chunks.segments || [];
  let cursor = 0;
  let full = "";
  const appliedSegments = [];
  segments.forEach(segment => {
    full += chunks.full.slice(cursor, segment.start);
    const record = detached && detached[segment.fieldId];
    const manual = record && record.parts && record.parts[segment.index];
    const text = typeof manual === "string" ? manual : chunks.full.slice(segment.start, segment.end);
    const start = full.length;
    full += text;
    appliedSegments.push({ ...segment, start, end: full.length });
    cursor = segment.end;
  });
  full += chunks.full.slice(cursor);
  const mapOffset = offset => {
    let delta = 0;
    segments.forEach((segment, index) => {
      if (segment.end > offset) return;
      delta += (appliedSegments[index].end - appliedSegments[index].start) -
        (segment.end - segment.start);
    });
    return offset + delta;
  };
  const ranges = {};
  Object.entries(chunks.ranges || {}).forEach(([name, range]) => {
    ranges[name] = { start: mapOffset(range.start), end: mapOffset(range.end) };
  });
  const chunkText = name => {
    const range = ranges[name];
    return range ? full.slice(range.start, range.end) : String(chunks[name] || "");
  };
  return {
    full,
    summary: chunkText("summary"),
    description: chunkText("description"),
    segments: appliedSegments,
    ranges
  };
}

function outputChangeRange(before, after) {
  let start = 0;
  while (start < before.length && start < after.length && before[start] === after[start]) start++;
  let oldEnd = before.length, newEnd = after.length;
  while (oldEnd > start && newEnd > start && before[oldEnd - 1] === after[newEnd - 1]) {
    oldEnd--; newEnd--;
  }
  return { start, oldEnd, newEnd, delta: newEnd - oldEnd };
}

function outputSegmentAfterChange(segment, change, textLength) {
  let start = segment.start;
  let end = segment.end;
  if (segment.end <= change.start) return { ...segment };
  if (segment.start >= change.oldEnd) return { ...segment, start: start + change.delta, end: end + change.delta };
  start = segment.start < change.start ? segment.start : change.start;
  end = segment.end > change.oldEnd ? segment.end + change.delta : change.newEnd;
  return { ...segment, start: Math.max(0, start), end: Math.max(0, Math.min(textLength, end)) };
}

function outputRangesAfterChange(ranges, change, textLength) {
  const next = {};
  Object.entries(ranges || {}).forEach(([name, range]) => {
    next[name] = outputSegmentAfterChange(range, change, textLength);
  });
  return next;
}

function outputSegmentTouchesChange(segment, change) {
  if (change.start === change.oldEnd) {
    return segment.start < change.start && change.start < segment.end;
  }
  return segment.start < change.oldEnd && segment.end > change.start;
}

function captureOutputTextareaEdit(inst, text) {
  const before = String(inst.output || "");
  const segments = Array.isArray(inst.outputSegments) ? inst.outputSegments : [];
  inst.output = text;
  if (!segments.length) {
    const change = outputChangeRange(before, text);
    inst.outputRanges = outputRangesAfterChange(inst.outputRanges, change, text.length);
    inst.outputLayoutEdited = true;
    inst.outputEdited = false;
    renderOutputDisconnectBadge(inst, []);
    return;
  }
  const change = outputChangeRange(before, text);
  const nextSegments = segments.map(segment => outputSegmentAfterChange(segment, change, text.length));
  inst.outputRanges = outputRangesAfterChange(inst.outputRanges, change, text.length);
  const changedFields = new Set(segments.filter(segment => outputSegmentTouchesChange(segment, change))
    .map(segment => segment.fieldId));
  if (changedFields.size) {
    inst.outputDetached = inst.outputDetached || {};
    changedFields.forEach(fieldId => {
      const record = inst.outputDetached[fieldId] = inst.outputDetached[fieldId] || { parts: {} };
      nextSegments.filter(segment => segment.fieldId === fieldId).forEach(segment => {
        record.parts[segment.index] = text.slice(segment.start, segment.end);
      });
    });
    inst.outputEdited = true;
  } else {
    // Los cambios de formato se conservan mientras se copia este texto, pero
    // no desconectan campos y se recalculan ante el siguiente cambio del form.
    inst.outputLayoutEdited = true;
    inst.outputEdited = outputDetachedFieldIds(inst, nextSegments).length > 0;
  }
  inst.outputSegments = nextSegments;
  renderOutputDisconnectBadge(inst, nextSegments);
}

function renderOutput() {
  const inst = getActiveInstance();
  if (!inst || !getForm(state.topTab)) return;
  refreshSystemFieldValues(inst);
  const chunks = buildOutput(inst);

  const ta = $("outputTextarea");
  if (!outputIsLegacyManual(inst)) {
    const rendered = applyOutputDetachment(chunks, inst.outputDetached);
    inst.output = rendered.full;
    inst.outputSegments = rendered.segments;
    inst.outputRanges = rendered.ranges;
    inst.outputEdited = outputDetachedFieldIds(inst, rendered.segments).length > 0;
    inst.outputLayoutEdited = false;
  }
  ta.value = inst.output;
  renderOutputDisconnectBadge(inst, inst.outputSegments);
  renderOutputPreview(inst.output);
  renderNotebook();

  const actions = $("outputActions");
  actions.innerHTML = "";
  addBtn(actions, t("output.copyAll"), () => copyToClipboard(refreshOutputForCopy(inst, "full")), "primary");
  if (chunks.summary) {
    addBtn(actions, t("output.copySummary"), () => copyToClipboard(refreshOutputForCopy(inst, "summary")));
  }
  if (chunks.description) {
    addBtn(actions, t("output.copyDescription"), () => copyToClipboard(refreshOutputForCopy(inst, "description")));
  }
  addBtn(actions, t("output.regenerate"), () => {
    inst.outputEdited = false;
    inst.outputLayoutEdited = false;
    inst.outputDetached = {};
    inst.outputSegments = [];
    inst.outputRanges = {};
    inst.output = "";
    renderOutput();
    scheduleSave();
  });
  addBtn(actions, t("output.clear"), () => {
    showConfirmModal({
      title: t("output.clearTitle"),
      body: t("output.clearBody", { title: escapeHtml(inst.title) }),
      confirmText: t("output.clear"),
      confirmClass: "danger",
      onConfirm: () => {
        const blank = makeInstance(inst.formId);
        inst.values = blank.values;
        inst.ticketKey = "";
        inst.output = "";
        inst.outputEdited = false;
        inst.outputLayoutEdited = false;
        inst.outputDetached = {};
        inst.outputSegments = [];
        inst.outputRanges = {};
        inst.checklistExtras = blank.checklistExtras;
        markInstanceDirty(inst);
        scheduleSave();
        renderForm();
        renderMediaPanel();
      }
    });
  }, "danger");
  renderOutputPreviewControls();
}

// Copiar es un punto explícito de actualización de los valores del sistema.
// El output editado a mano se conserva al copiarlo completo; summary y
// description siempre se derivan del schema actualizado.
function refreshOutputForCopy(inst, chunk) {
  refreshSystemFieldValues(inst);
  const chunks = buildOutput(inst);
  let rendered = null;
  if (!outputIsLegacyManual(inst) && !inst.outputLayoutEdited) {
    rendered = applyOutputDetachment(chunks, inst.outputDetached);
    inst.output = rendered.full;
    inst.outputSegments = rendered.segments;
    inst.outputRanges = rendered.ranges;
    inst.outputEdited = outputDetachedFieldIds(inst, rendered.segments).length > 0;
    const ta = $("outputTextarea");
    if (ta) ta.value = inst.output;
    renderOutputDisconnectBadge(inst, rendered.segments);
  }
  if (chunk === "full") return inst.output;
  if (rendered) return rendered[chunk];
  if (!outputIsLegacyManual(inst) && inst.outputRanges && inst.outputRanges[chunk]) {
    const range = inst.outputRanges[chunk];
    return inst.output.slice(range.start, range.end);
  }
  return chunks[chunk];
}

function addBtn(container, label, fn, cls) {
  const b = document.createElement("button");
  b.textContent = label;
  if (cls) b.classList.add(cls);
  b.addEventListener("click", fn);
  container.appendChild(b);
}

/* MONOLITH:SECTION 11-output-generator END */
/* MONOLITH:SECTION 12-media-panel START */
/* ================================================================
   [12] PANEL DE MEDIA
   ================================================================
   Los nombres se generan SOLOS a partir de la regla `media_fmt`
   (editable en DATA/RULES — cada cliente puede tener su formato):

     {type}     → el tipo de media de la fila (lista mediaTypes)
     {key}      → la Key del ticket (el textbox de arriba)
     {platform} → plataforma(cliente) combinados, sin duplicar parens
     {loQueSea} → el valor de cualquier campo del formulario por id
                  (ej. {cl}, {map}, {bugType})

   Cada fila tiene un id `mediaN` visible en modo edición. Ese id se usa desde
   las plantillas de campo como `{media:mediaN}` y se reutiliza cuando queda
   libre (sin renumerar las demás filas). Los tipos de fila salen de la lista
   `mediaTypes` en DATA.

   La lista y la regla se pueden configurar POR SECCIÓN (bug, regression...)
   con el lápiz del panel de media: `form.media = { source, fmt }`. Si la
   sección no tiene override, usa la lista "mediaTypes" y la regla global
   `config.data.rules.media_fmt`. Así la media de regresión puede llevar,
   por ejemplo, un prefijo "Open_" distinto al del bug. */

// Formulario cuya media se está mostrando (la pestaña activa).
function currentMediaForm() { return getForm(state.topTab); }

// Lista de DATA que alimenta el dropdown de tipo de media de la sección.
function mediaSource(form) {
  form = form || currentMediaForm();
  return (form && form.media && form.media.source) || "mediaTypes";
}

function mediaTypes(form) {
  return config.data.lists[mediaSource(form)] || ["Vid", "Pic", "ConsoleLog", "DxDiag"];
}

// Tipo con el que nace una fila de media nueva (el primero de la lista).
// Recibe el formulario dueño de la instancia; sin él usa el de la pestaña.
function defaultMediaType(form) {
  const types = mediaTypes(form);
  return types.length ? types[0] : "Pic";
}

function mediaFormat(form) {
  form = form || currentMediaForm();
  return (form && form.media && form.media.fmt) || config.data.rules.media_fmt
    || "{type}_{key}_{platform}_{cl}_(1)";
}

function getPlatformForMedia(inst) {
  const plat = String(inst.values.platform || "").trim();
  const client = String(inst.values.client || "").trim();
  if (!plat) return "";
  if (plat.includes("(") || !client) return plat;
  return `${plat}(${client})`;
}

// Devuelve { name, missing: [placeholders sin valor] }
function buildMediaName(media, inst, form) {
  const mediaType = media && typeof media === "object" ? media.type : media;
  form = form || (inst && getForm(inst.formId)) || currentMediaForm();
  const missing = [];
  const name = mediaFormat(form).replace(/\{([A-Za-z0-9_]+)\}/g, (m, ph) => {
    let v = "";
    if (ph === "type") v = mediaType;
    else if (ph === "key") v = String(inst.ticketKey || "").trim();
    else if (ph === "platform") v = getPlatformForMedia(inst);
    else v = String(inst.values[ph] == null ? "" : inst.values[ph]).trim();
    if (!v) missing.push(ph);
    return v;
  });
  return { name, missing };
}

function renderMediaPanel() {
  const inst = getActiveInstance();
  if (!inst) return;
  const mform = currentMediaForm();
  if (inst.ticketKey === undefined) inst.ticketKey = "";
  normalizeMediaRows(inst, mform);
  $("mediaFmtHint").textContent = t("media.formatHint", { format: mediaFormat(mform) });
  const cfgBtn = $("mediaConfigBtn");
  if (cfgBtn) cfgBtn.onclick = () => showMediaConfigEditor();
  const keyInput = $("mediaTicketKey");
  if (document.activeElement !== keyInput) keyInput.value = inst.ticketKey;

  // Una fila por cada media que el tester quiera. Cada fila tiene un
  // selector de tipo (text+dropdown vía datalist) y el nombre generado
  // al lado (solo lectura + copiar). Se pueden agregar y borrar.
  const rows = $("mediaRows");
  rows.innerHTML = inst.media.map((media, i) => {
    const { name, missing } = buildMediaName(media, inst, mform);
    const ok = !missing.length;
    return `<div class="media-row" data-media-i="${i}">
      <code class="media-id" title="${escapeHtml(t("form.templateReference", { reference: `{media:${media.id}}` }))}">${escapeHtml(media.id)}</code>
      <div class="field autocomplete media-type-ac">
        <div class="autocomplete-input-wrap">
          <input id="media-type-${escapeHtml(media.id)}" type="text" class="media-type-input" data-media-type="${i}"
            value="${escapeHtml(media.type)}" placeholder="${escapeHtml(t("media.typePlaceholder"))}"
            role="combobox" aria-label="${escapeHtml(t("media.typeLabel"))}" aria-autocomplete="list"
            aria-expanded="false" aria-controls="media-type-list-${escapeHtml(media.id)}" />
          <span class="autocomplete-arrow" data-ac-toggle title="${escapeHtml(t("form.autocompleteShowAll"))}">▼</span>
        </div>
        <div class="autocomplete-list" id="media-type-list-${escapeHtml(media.id)}" role="listbox"></div>
      </div>
      <input type="text" readonly data-media-name="${i}" value="${ok ? escapeHtml(name) : ""}"
        placeholder="${ok ? "" : escapeHtml(t("media.missingPlaceholder", { fields: missing.join(", ") }))}" />
      <span class="media-row-actions">
        <button data-media-copy="${i}"${ok ? "" : " disabled"}
          title="${escapeHtml(ok ? t("media.copyTitle", { name }) : t("media.missingTitle", { fields: missing.join(", ") }))}">${escapeHtml(t("common.copy"))}</button>
        <button class="row-del" data-media-del="${i}" title="${escapeHtml(t("media.removeTitle"))}">✕</button>
      </span>
    </div>`;
  }).join("")
    + `<button id="addMediaBtn" class="add-media-btn" title="${escapeHtml(t("media.addTitle"))}">${escapeHtml(t("media.add"))}</button>`;

  // Actualiza solo el nombre generado de una fila (sin re-render: así el
  // selector de tipo no pierde el foco mientras el tester escribe).
  const refreshRowName = (i) => {
    const { name, missing } = buildMediaName(inst.media[i], inst, mform);
    const ok = !missing.length;
    const nameInp = rows.querySelector(`[data-media-name="${i}"]`);
    const copyBtn = rows.querySelector(`[data-media-copy="${i}"]`);
    if (nameInp) {
      nameInp.value = ok ? name : "";
      nameInp.placeholder = ok ? "" : t("media.missingPlaceholder", { fields: missing.join(", ") });
    }
    if (copyBtn) {
      copyBtn.disabled = !ok;
      copyBtn.title = ok ? t("media.copyTitle", { name }) : t("media.missingTitle", { fields: missing.join(", ") });
    }
  };

  // El tipo de media usa el MISMO widget autocomplete que los campos del
  // formulario, respaldado por la lista de media de la sección (agregar/borrar
  // opciones in situ). Campo sintético: fuente = lista configurada.
  const mediaTypeField = { id: "mediaType", label: t("media.typeLabel"), source: mediaSource(mform) };
  rows.querySelectorAll("[data-media-type]").forEach(inp => {
    const i = +inp.dataset.mediaType;
    // Sincroniza a inst.media[i] tanto al escribir como al elegir del dropdown
    // (la selección despacha un evento "input").
    inp.addEventListener("input", () => {
      inst.media[i].type = inp.value;
      markInstanceDirty(inst);
      refreshRowName(i);
    });
    inp.addEventListener("blur", () => { saveAll(); setSaveIndicator("saved"); });
    wireAutocomplete(inp, inst, mediaTypeField);
  });
  rows.querySelectorAll("[data-media-copy]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = +btn.dataset.mediaCopy;
      const { name, missing } = buildMediaName(inst.media[i], inst, mform);
      if (missing.length) { flashBanner(t("media.missingTitle", { fields: missing.join(", ") }), true); return; }
      copyToClipboard(name);
    });
  });
  rows.querySelectorAll("[data-media-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      inst.media.splice(+btn.dataset.mediaDel, 1);
      markInstanceDirty(inst);
      renderMediaPanel();
      saveAll();
    });
  });
  $("addMediaBtn").addEventListener("click", () => {
    inst.media.push(newMediaRow(inst.media, mform));
    markInstanceDirty(inst);
    renderMediaPanel();
    saveAll();
  });
}

let _mediaPanelWired = false;
function wireMediaPanel() {
  if (_mediaPanelWired) return;
  _mediaPanelWired = true;
  const keyInput = $("mediaTicketKey");
  keyInput.addEventListener("input", () => {
    const inst = getActiveInstance();
    if (!inst) return;
    inst.ticketKey = keyInput.value;
    markInstanceDirty(inst);
    // Solo refrescar las filas generadas, sin pisar el input activo
    renderMediaPanel();
  });
  keyInput.addEventListener("blur", () => {
    saveAll();
    setSaveIndicator("saved");
  });
}

// Editor (modo edición) de la media de la sección activa: qué lista de DATA
// alimenta su dropdown y qué regla genera el nombre. Se guarda en
// `form.media`, de modo que bug y regression pueden tener reglas distintas
// (p. ej. regression con prefijo "Open_").
function showMediaConfigEditor() {
  const form = currentMediaForm();
  if (!form) return;
  const curSource = mediaSource(form);
  const curFmt = mediaFormat(form);
  const listOpts = Object.keys(config.data.lists).map(k =>
    `<option value="${escapeHtml(k)}"${k === curSource ? " selected" : ""}>${escapeHtml(k)}</option>`).join("");
  const overridden = !!(form.media && (form.media.source || form.media.fmt));
  const body = `
    <div class="fe-grid">
      <div class="fe-full">
        <label>${escapeHtml(t("media.listLabel"))}</label>
        <select id="mc_source">${listOpts}</select>
        <div class="field-help">${escapeHtml(t("media.listHelp"))}</div>
      </div>
      <div class="fe-full">
        <label>${escapeHtml(t("media.ruleLabel"))}</label>
        <input type="text" id="mc_fmt" value="${escapeHtml(curFmt)}" />
        <div class="field-help">${escapeHtml(t("media.ruleHelp"))}</div>
      </div>
      <div class="fe-full">
        <label class="checkbox"><input type="checkbox" id="mc_reset"${overridden ? "" : " disabled"} /> ${escapeHtml(t("media.resetGlobal"))}</label>
        <div class="field-help">${overridden
          ? escapeHtml(t("media.ownConfig"))
          : escapeHtml(t("media.globalConfig", { form: configuredText(form.label) }))}</div>
      </div>
    </div>`;
  showEditorModal({
    title: t("media.editorTitle", { form: configuredText(form.label) }),
    wide: false,
    bodyHtml: body,
    onConfirm: () => {
      if ($("mc_reset") && $("mc_reset").checked) {
        delete form.media;
      } else {
        const src = $("mc_source").value || "mediaTypes";
        const fmt = $("mc_fmt").value.trim();
        if (!fmt) { flashBanner(t("media.emptyRule"), true); return false; }
        // Guarda la config COMPLETA (lista + regla), no solo el diff contra el
        // global: así el export es autodescriptivo y no depende de que quien
        // importe tenga el mismo global (puede tener una versión desfasada).
        // Para "seguir el global" está el checkbox de reset (borra form.media).
        form.media = { source: src, fmt: fmt };
      }
      renderMediaPanel();
      scheduleSave();
      flashBanner(t("media.updated"));
      return true;
    }
  });
}

/* ================================================================
   [13] PESTAÑA DATA
   ================================================================
   Edita config.data (listas, mapas, POIs, reglas). Los
   cambios quedan en el DOM/localStorage al momento; para
   compartirlos: exportar bug_data.csv o exportar la herramienta. */
function dataCategories() {
  const cats = [];
  // Raíces (planas) primero, luego las dependientes (mostrando su padre).
  Object.keys(config.data.lists).forEach(k =>
    cats.push({ id: "list:" + k, label: configuredText(listLabel(k)), kind: "list", key: k }));
  Object.keys(config.data.childLists || {}).forEach(k =>
    cats.push({ id: "list:" + k, kind: "list", key: k,
      label: t("data.childOf", {
        child: configuredText(listLabel(k)),
        parent: configuredText(listLabel(config.data.childLists[k].parent))
      }) }));
  cats.push({ id: "rules", label: t("data.rules"), kind: "rules" });
  return cats;
}

function renderDataTab() {
  const cats = dataCategories();
  if (!cats.find(c => c.id === state.dataTab.selectedCategory)) {
    state.dataTab.selectedCategory = cats[0].id;
  }
  renderDataSidebar();
  renderDataTable();
}

function renderDataSidebar() {
  const sb = $("dataSidebar");
  sb.innerHTML = "";
  dataCategories().forEach(c => {
    const el = document.createElement("div");
    const active = state.dataTab.selectedCategory === c.id;
    el.className = "item" + (active ? " active" : "");
    el.setAttribute("role", "button");
    el.setAttribute("aria-pressed", String(active));
    el.tabIndex = 0;
    el.style.display = "flex";
    el.innerHTML = `<span style="flex:1">${escapeHtml(c.label)}</span>` +
      (c.kind === "list" ? `<button class="row-del" data-dellist="${escapeHtml(c.key)}" title="${escapeHtml(t("data.deleteListTitle"))}">✕</button>` : "");
    const activate = (e) => {
      if (e.target.closest("[data-dellist]")) return;
      state.dataTab.selectedCategory = c.id;
      renderDataTab();
      scheduleSave();
    };
    el.addEventListener("click", activate);
    el.addEventListener("keydown", e => {
      if (e.target !== el || (e.key !== "Enter" && e.key !== " ")) return;
      e.preventDefault();
      activate(e);
    });
    sb.appendChild(el);
  });
  sb.querySelectorAll("[data-dellist]").forEach(btn => {
    btn.addEventListener("click", () => cascadeDeleteList(btn.dataset.dellist));
  });
}

// Borra una lista y TODAS sus dependientes (el subárbol). Avisa qué fuentes de
// campo quedarán vacías y qué listas dependientes se van con ella.
function cascadeDeleteList(id) {
  const descendants = descendantLists(id);
  const all = [id].concat(descendants);
  const users = [];
  getForms().forEach(form => allFields(form).forEach(({ field }) => {
    const s = parseSource(field.source);
    const used = s.kind === "child" ? s.link : s.list;
    if (all.includes(used)) users.push(configuredText(form.label) + " → " + configuredText(field.label));
  }));
  const descTxt = descendants.length
    ? t("data.deleteDescendants", { lists: descendants.map(x => escapeHtml(configuredText(listLabel(x)))).join(", ") }) : "";
  const usersTxt = users.length
    ? t("data.deleteUsedSources", { fields: users.map(escapeHtml).join("<br />") }) : "";
  showConfirmModal({
    title: t("data.deleteList"),
    body: t("data.deleteListBody", {
      list: escapeHtml(configuredText(listLabel(id))), details: descTxt + usersTxt
    }),
    confirmText: t("common.delete"),
    confirmClass: "danger",
    onConfirm: () => {
      all.forEach(x => {
        delete config.data.lists[x];
        if (config.data.childLists) delete config.data.childLists[x];
        if (config.data.listMeta) delete config.data.listMeta[x];
      });
      state.dataTab.selectedCategory = "";
      renderDataTab();
      scheduleSave();
    }
  });
}

// Al renombrar un valor de una lista que es padre, arrastra los buckets de
// TODAS sus dependientes (values[viejo] -> values[nuevo]).
function renameParentValue(listId, oldName, newName) {
  if (oldName === newName) return;
  childrenOf(listId).forEach(childId => {
    const vals = config.data.childLists[childId].values;
    if (vals[oldName] !== undefined) {
      vals[newName] = (vals[newName] || []).concat(vals[oldName]);
      delete vals[oldName];
    }
  });
}

function renderDataTable() {
  const wrap = $("dataTableWrap");
  const sel = dataCategories().find(c => c.id === state.dataTab.selectedCategory);
  if (!sel) { wrap.innerHTML = ""; return; }

  let cols, rowsHtml;
  const delBtn = (attr, val) =>
    `<button class="row-del" ${attr}="${escapeHtml(val)}" title="${escapeHtml(t("data.deleteRow"))}">✕</button>`;

  if (sel.kind === "rules") {
    cols = ["#", t("data.columnRule"), t("data.columnValue"), ""];
    rowsHtml = Object.entries(config.data.rules).map(([k, v], i) => `<tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(k)}</td>
      <td><input type="text" data-rule-key="${escapeHtml(k)}" value="${escapeHtml(v)}" /></td>
      <td>${delBtn("data-rule-del", k)}</td>
    </tr>`).join("");
  } else if (isChildList(sel.key)) {
    // Lista dependiente: valores agrupados por el valor del padre.
    const c = config.data.childLists[sel.key];
    const parentVals = listValues(c.parent);
    cols = ["#", configuredText(listLabel(c.parent)), configuredText(listLabel(sel.key)), ""];
    let i = 0;
    rowsHtml = Object.entries(c.values).map(([par, kids]) => {
      const isOrphan = !parentVals.includes(par);
      return (kids || []).map((p, j) => {
        i++;
        return `<tr>
          <td>${i}</td>
          <td class="${isOrphan ? "orphan" : ""}">${escapeHtml(par)}${isOrphan ? ` (${escapeHtml(t("data.orphan"))})` : ""}</td>
          <td><input type="text" data-childc-edit="${escapeHtml(par)}|${j}" value="${escapeHtml(p)}" /></td>
          <td>${delBtn("data-childc-del", par + "|" + j)}</td>
        </tr>`;
      }).join("");
    }).join("");
  } else {
    // Lista raíz (plana).
    cols = ["#", t("data.columnValue"), ""];
    const arr = config.data.lists[sel.key] || [];
    rowsHtml = arr.map((v, i) => `<tr>
      <td>${i + 1}</td>
      <td><input type="text" data-list-idx="${i}" value="${escapeHtml(v)}" /></td>
      <td>${delBtn("data-list-del", String(i))}</td>
    </tr>`).join("");
  }

  wrap.innerHTML = `<table class="data-table">
    <thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join("")}</tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table>`;

  // ---- Ediciones ----
  // Valor de lista raíz: commit al salir (change). Si la lista es padre de
  // dependientes, renombrar arrastra los buckets de sus hijas.
  wrap.querySelectorAll("[data-list-idx]").forEach(inp => {
    inp.addEventListener("change", () => {
      const i = +inp.dataset.listIdx;
      const oldName = config.data.lists[sel.key][i];
      const newName = inp.value;
      if (newName === oldName) return;
      const isParent = childrenOf(sel.key).length > 0;
      if (isParent && newName.trim()) renameParentValue(sel.key, oldName, newName);
      config.data.lists[sel.key][i] = newName;
      scheduleSave();
      if (isParent) renderDataTable(); // refresca closures tras el arrastre
    });
  });
  // Valor de lista dependiente. La clave es "padre|índice"; se corta por el
  // ÚLTIMO | porque el valor del padre es texto libre y puede contener |.
  const childKey = (raw) => {
    const cut = raw.lastIndexOf("|");
    return [raw.slice(0, cut), +raw.slice(cut + 1)];
  };
  wrap.querySelectorAll("[data-childc-edit]").forEach(inp => {
    inp.addEventListener("input", () => {
      const [par, j] = childKey(inp.dataset.childcEdit);
      config.data.childLists[sel.key].values[par][j] = inp.value;
      scheduleSave();
    });
  });
  wrap.querySelectorAll("[data-rule-key]").forEach(inp => {
    inp.addEventListener("input", () => {
      config.data.rules[inp.dataset.ruleKey] = inp.value;
      scheduleSave();
    });
  });

  // ---- Borrado de filas (con confirmación) ----
  const confirmRowDelete = (desc, doIt) => showConfirmModal({
    title: t("data.deleteRow"),
    body: t("data.deletePermanent", { item: desc }),
    confirmText: t("common.delete"),
    confirmClass: "danger",
    onConfirm: () => { doIt(); renderDataTable(); scheduleSave(); }
  });
  wrap.querySelectorAll("[data-list-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = +btn.dataset.listDel;
      const warn = childrenOf(sel.key).length ? t("data.childrenOrphaned") : "";
      confirmRowDelete(`«${escapeHtml(config.data.lists[sel.key][i])}»${warn}`,
        () => config.data.lists[sel.key].splice(i, 1));
    });
  });
  wrap.querySelectorAll("[data-childc-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [par, j] = childKey(btn.dataset.childcDel);
      confirmRowDelete(t("data.fromParent", {
        value: escapeHtml(config.data.childLists[sel.key].values[par][j]), parent: escapeHtml(par)
      }),
        () => config.data.childLists[sel.key].values[par].splice(j, 1));
    });
  });
  wrap.querySelectorAll("[data-rule-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.ruleDel;
      confirmRowDelete(t("data.ruleDeleteDescription", { rule: escapeHtml(k) }),
        () => delete config.data.rules[k]);
    });
  });
}

function addDataRow() {
  const sel = dataCategories().find(c => c.id === state.dataTab.selectedCategory);
  if (!sel) return;
  if (sel.kind === "rules") {
    showPromptModal({
      title: t("data.newRule"),
      body: t("data.newRuleBody"),
      placeholder: t("data.rulePlaceholder"),
      confirmText: t("common.add"),
      onConfirm: (k) => {
        k = (k || "").trim();
        if (!k) return;
        if (config.data.rules[k] != null) { flashBanner(t("data.ruleExists"), true); return; }
        config.data.rules[k] = "";
        renderDataTable();
        scheduleSave();
      }
    });
    return;
  }
  if (isChildList(sel.key)) {
    const c = config.data.childLists[sel.key];
    const parentVals = listValues(c.parent);
    if (!parentVals.length) {
      flashBanner(t("data.addParentsFirst", { list: configuredText(listLabel(c.parent)) }), true);
      return;
    }
    showSelectModal({
      title: t("data.newItem", { list: configuredText(listLabel(sel.key)) }),
      body: t("data.selectParent", { parent: configuredText(listLabel(c.parent)).toLowerCase() }),
      options: parentVals,
      confirmText: t("common.add"),
      onConfirm: (m) => {
        c.values[m] = c.values[m] || [];
        c.values[m].push("Nuevo" + listLabel(sel.key).replace(/\s+/g, ""));
        renderDataTable();
        scheduleSave();
      }
    });
    return;
  }
  // Lista raíz (plana)
  config.data.lists[sel.key] = config.data.lists[sel.key] || [];
  config.data.lists[sel.key].push("nuevo_valor");
  renderDataTable();
  scheduleSave();
}

function addNewList() {
  showPromptModal({
    title: t("data.newList"),
    body: t("data.newListBody"),
    placeholder: t("data.listPlaceholder"),
    confirmText: t("common.create"),
    onConfirm: (name) => {
      const key = slugify(name);
      if (!key) return;
      if (config.data.lists[key]) { flashBanner(t("data.listExists"), true); return; }
      config.data.lists[key] = [];
      state.dataTab.selectedCategory = "list:" + key;
      renderDataTab();
      scheduleSave();
    }
  });
}

// Crea una lista dependiente NUEVA bajo la lista seleccionada (su padre).
// Cualquier lista (raíz o dependiente) puede recibir hijas → árbol a cualquier
// profundidad. Los valores se agregan después, por cada valor del padre.
function addChildList() {
  const sel = dataCategories().find(c => c.id === state.dataTab.selectedCategory);
  const parentId = sel && sel.kind === "list" ? sel.key : null;
  if (!parentId) { flashBanner(t("data.chooseParentFirst"), true); return; }
  showPromptModal({
    title: t("data.newChildTitleModal"),
    body: t("data.newChildBody", { parent: escapeHtml(configuredText(listLabel(parentId))) }),
    placeholder: t("data.childPlaceholder"),
    confirmText: t("common.create"),
    onConfirm: (label) => {
      label = (label || "").trim();
      if (!label) return;
      const id = uniqueListId(label, config.data);
      config.data.childLists[id] = { parent: parentId, values: {} };
      config.data.listMeta[id] = { label };
      state.dataTab.selectedCategory = "list:" + id;
      renderDataTab();
      scheduleSave();
      flashBanner(t("data.childCreated", {
        label, parent: configuredText(listLabel(parentId)),
        parentLower: configuredText(listLabel(parentId)).toLowerCase()
      }));
    }
  });
}

/* ================================================================
   [14] PESTAÑA RULES
   ================================================================
   Vista técnica y legible de TODAS las validaciones: por campo
   (obligatorio, REGEX, mensaje, default) y las reglas globales de
   DATA. Todo editable en vivo. */
// Operadores y acciones de las condiciones entre campos
const COND_OPS = [
  ["empty",          "rules.op.empty"],
  ["notEmpty",       "rules.op.notEmpty"],
  ["equals",         "rules.op.equals"],
  ["notEquals",      "rules.op.notEquals"],
  ["matches",        "rules.op.matches"],
  // Comparan contra el VALOR de otro campo (el valor es el id del campo).
  // Solo aplican cuando ambos campos tienen algo escrito.
  ["equalsField",    "rules.op.equalsField"],
  ["notEqualsField", "rules.op.notEqualsField"]
];
const COND_ACTIONS = [
  ["show",       "rules.action.show"],
  ["hide",       "rules.action.hide"],
  ["disable",    "rules.action.disable"],
  ["setDefault", "rules.action.setDefault"],
  ["error",      "rules.action.error"]
];

// Texto de búsqueda de cada tabla de RULES. Vive fuera del render para que
// el filtro sobreviva a los re-render de la pestaña (cambiar un color, etc.).
const rulesSearch = { fields: "", globals: "", conds: "", tiles: "" };

// Filtra las filas de las tablas de un bloque de RULES: solo se muestran
// las que coinciden. Es el buscador más simple posible reutilizando el motor
// de regex; si lo escrito no es una regex válida, se busca tal cual.
function applyRulesSearch(c, key) {
  const q = String(rulesSearch[key] || "").trim();
  let re = null;
  if (q) {
    try { re = new RegExp(q, "i"); }
    catch (e) { re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"); }
  }
  const block = c.querySelector(`[data-rblock="${key}"]`);
  if (!block) return;
  block.querySelectorAll("tbody tr").forEach(tr => {
    if (!re) { tr.style.display = ""; return; }
    // El texto buscable incluye lo escrito y SOLO la opción elegida de cada
    // select. No usamos tr.textContent directamente porque incluye todas las
    // <option> (Mapa, Modo, BSP...) y provocaba falsos positivos.
    let text = "";
    tr.querySelectorAll("input, select, textarea").forEach(el => {
      if (el.type === "checkbox") return;
      if (el.tagName === "SELECT") {
        const o = el.selectedOptions && el.selectedOptions[0];
        text += " " + (o ? o.textContent : "");
      } else {
        text += " " + el.value;
      }
    });
    const staticClone = tr.cloneNode(true);
    staticClone.querySelectorAll("input, select, textarea, button").forEach(el => el.remove());
    text += " " + staticClone.textContent;
    tr.style.display = re.test(text) ? "" : "none";
  });
}

        <tbody>${fieldRows}</tbody>
      </table>
    </div>
    <div class="rules-block" data-rblock="globals">
      <h3>${escapeHtml(t("rules.globalsTitle"))}</h3>
      <p class="rules-intro">${t("rules.globalsHelp")}</p>
      ${rulesSearchInput("globals")}
      <table class="data-table" style="max-width:760px">
        <thead><tr><th>${escapeHtml(t("rules.rule"))}</th><th>${escapeHtml(t("rules.value"))}</th></tr></thead>
        <tbody>${globalRows}</tbody>
      </table>
    </div>
    <div class="rules-block" data-rblock="conds">
      <h3>${escapeHtml(t("rules.conditionsTitle"))}</h3>
      <p class="rules-intro">${t("rules.conditionsHelp")}</p>
      ${rulesSearchInput("conds")}
      ${condsHtml}
    </div>
    <div class="rules-block" data-rblock="tiles">
      <h3>${escapeHtml(t("rules.tilesTitle"))}</h3>
      <p class="rules-intro">${t("rules.tilesHelp")}</p>
      ${rulesSearchInput("tiles")}
      ${tilesHtml}

  c.querySelectorAll("input[type='text']").forEach((inp, i) => {
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("name", "rr_" + i);
  });

  // ---- Buscador de cada tabla (filtra filas en vivo) ----

    inp.addEventListener("input", () => {
      rulesSearch[key] = inp.value;
      applyRulesSearch(c, key);
    });
    applyRulesSearch(c, key); // re-aplica el filtro tras cada re-render
  });
  // Si una fila se edita mientras hay un filtro activo, vuelve a evaluar su

  const refreshActiveSearches = e => {
    if (e.target && e.target.matches("[data-rsearch]")) return;

      if (rulesSearch[key]) applyRulesSearch(c, key);

  c.querySelectorAll("[data-rr-rx]").forEach(el => {
    el.addEventListener("input", () => {

      if (el.value.trim()) target.field.regex = el.value.trim(); else delete target.field.regex;
      scheduleSave();

  c.querySelectorAll("[data-rr-global]").forEach(el => el.addEventListener("input", () => {
    config.data.rules[el.dataset.rrGlobal] = el.value;

  // ---- Wiring de las condiciones entre campos ----

  c.querySelectorAll("[data-cr-del]").forEach(btn => {

        confirmText: t("common.delete"),
        confirmClass: "danger",
        onConfirm: () => {
          const form = getForm(formId);
          if (form && form.rules) form.rules.splice(+idx, 1);
          renderRulesTab();
          scheduleSave();
        }
      });
    });
  });

  // ---- Wiring de los tiles personalizados ----
  c.querySelectorAll("[data-tr]").forEach(el => {
    const evt = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(evt, () => {
      const [formId, idx, prop] = el.dataset.tr.split("|");
      const form = getForm(formId);
      const tile = form && getFormTiles(form)[+idx];

  // Validación en vivo de la expresión del tile (sin re-render).
  c.querySelectorAll(".cond-expr[data-tr]").forEach(inp => {
    const [formId] = inp.dataset.tr.split("|");
    wireCondExprAutocomplete(inp, getForm(formId));
    inp.addEventListener("input", () => {
      const k = inp.dataset.tr.split("|").slice(0, 2).join("|");
      const err = exprError(inp.value, getForm(formId));
      inp.classList.toggle("cond-bad", !!err);
      const box = c.querySelector(`[data-tr-err="${k}"]`);
      if (box) box.textContent = err;

  });
  c.querySelectorAll("[data-tr-add]").forEach(btn => {
    btn.addEventListener("click", () => {
      const form = getForm(btn.dataset.trAdd);
      if (!form) return;
      form.tiles = form.tiles || [];
      form.tiles.push({ text: t("rules.newTile"), message: "", whenExpr: "", color: TILE_SEV_COLOR.warn,
                        group: "", severity: "warn", field: "" });
      renderRulesTab();
      scheduleSave();
    });
  });
  c.querySelectorAll("[data-tr-del]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [formId, idx] = btn.dataset.trDel.split("|");
      showConfirmModal({
        title: t("rules.deleteTile"),
        body: t("rules.deleteTileBody"),
        confirmText: t("common.delete"),
        confirmClass: "danger",
        onConfirm: () => {
          const form = getForm(formId);
          if (form && form.tiles) form.tiles.splice(+idx, 1);
          renderRulesTab();
          scheduleSave();
        }
      });
    });
  });
  // Reordenar tiles (▲▼): cambia el orden de la lista = orden en la 2ª banda.
  c.querySelectorAll("[data-tr-move]").forEach(btn => {
    btn.addEventListener("click", () => {
      const [formId, idx, dir] = btn.dataset.trMove.split("|");
      const form = getForm(formId);
      const tiles = form && getFormTiles(form);
      if (!tiles) return;
      const i = +idx, to = i + (+dir);
      if (to < 0 || to >= tiles.length) return;
      const [moved] = tiles.splice(i, 1);
      tiles.splice(to, 0, moved);
      renderRulesTab();
      scheduleSave();
    });
  });
}

// Parser: soporta comillas dobles y comas dentro de comillas.
// Lo escrito entre comillas NO se recorta (los separadores como
// " - " importan en bug_fields.csv).
function parseCsvLine(line) {
  const out = [];
  let cur = "", inQ = false, wasQuoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === ",") { out.push(wasQuoted ? cur : cur.trim()); cur = ""; wasQuoted = false; }
      else if (ch === '"') { inQ = true; wasQuoted = true; }
      else cur += ch;
    }
  }
  out.push(wasQuoted ? cur : cur.trim());
  return out;
}

function csvEscape(v) {
  v = String(v == null ? "" : v);
  if (/[",\n]/.test(v) || v !== v.trim()) return `"${v.replace(/"/g, '""')}"`;
  return v;
}

function csvTruthy(v) {
  return ["1", "true", "yes", "si", "sí", "x"].includes(String(v || "").trim().toLowerCase());
}

// ---- bug_data.csv (category,key,value,child) ----
// Categorías: `list` (valor de una raíz), `childlist` (declara id→padre),
// `childval` (id, padre, hijo), `listlabel` (id→etiqueta) y `rule`.
// El formato viejo (map/poi/link/linkparent/linkchild) se sigue LEYENDO al
// importar, igual que el CSV de 3 columnas con "padre :: hijo".
async function exportDataCsv() {
  const rows = [["category", "key", "value", "child"]];
  Object.entries(config.data.lists).forEach(([k, arr]) =>
    (arr || []).forEach(v => rows.push(["list", k, v, ""])));
  Object.entries(config.data.childLists || {}).forEach(([id, c]) => {
    rows.push(["childlist", id, c.parent, ""]);
    Object.entries(c.values || {}).forEach(([par, kids]) =>
      (kids || []).forEach(v => rows.push(["childval", id, par, v])));
  });
  Object.entries(config.data.listMeta || {}).forEach(([id, meta]) => {
    if (meta && meta.label && meta.label !== id) rows.push(["listlabel", id, meta.label, ""]);
  });
  Object.entries(config.data.rules).forEach(([k, v]) => rows.push(["rule", k, v, ""]));
  await downloadFile("bug_data.csv", rows.map(r => r.map(csvEscape).join(",")).join("\n"));
}

function importDataCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith("#"));
  if (!lines.length) throw new Error(t("dataCsv.empty"));
  const header = parseCsvLine(lines[0]).map(s => s.toLowerCase());
  const isLegacyHeader = header.join(",") === "category,key,value";
  if (!isLegacyHeader && header.join(",") !== "category,key,value,child") {
    throw new Error(t("dataCsv.header"));
  }
  const data = { lists: {}, rules: {}, childLists: {}, listMeta: {}, linkedLists: {} };
  const splitPair = (v) => {
    const idx = String(v).indexOf(" :: ");
    return idx >= 0 ? [v.slice(0, idx), v.slice(idx + 4)] : [String(v), ""];
  };
  const ensureChild = (id) => (data.childLists[id] = data.childLists[id] || { parent: "", values: {} });
  const ensureLink = (id) => (data.linkedLists[id] = data.linkedLists[id] ||
    { parentLabel: id, childLabel: id + " hijo", parents: [], children: {} });
  for (let i = 1; i < lines.length; i++) {
    const row = parseCsvLine(lines[i]);
    if (row.length < 3) continue;
    const [cat, key, value, childValue] = row;
    if (cat === "list") { (data.lists[key] = data.lists[key] || []).push(value); }
    else if (cat === "childlist") { ensureChild(key).parent = value; }
    else if (cat === "childval") {
      // También tolera una fila antigua mezclada en un archivo de 4 columnas.
      const [par, child] = childValue ? [value, childValue] : splitPair(value);
      const c = ensureChild(key);
      c.values[par] = c.values[par] || [];
      if (child) c.values[par].push(child);
    }
    else if (cat === "listlabel") { data.listMeta[key] = { label: value }; }
    else if (cat === "rule") { data.rules[key] = value; }
    // ---- Legacy (formato viejo): se normaliza al árbol más abajo ----
    else if (cat === "map") { (data.maps = data.maps || []).push(value); }
    else if (cat === "poi") { data.pois = data.pois || {}; (data.pois[key] = data.pois[key] || []).push(value); }
    else if (cat === "link") { const [pl, cl] = splitPair(value); const L = ensureLink(key); if (pl) L.parentLabel = pl; if (cl) L.childLabel = cl; }
    else if (cat === "linkparent") { ensureLink(key).parents.push(value); }
    else if (cat === "linkchild") { const L = ensureLink(key); const [par, child] = splitPair(value); L.children[par] = L.children[par] || []; if (child) L.children[par].push(child); }
  }
  // Normaliza cualquier resto en formato viejo al árbol unificado.
  migrateListsToTree({ data, schema: config.schema });
  config.data = data;
  refreshAll();
  scheduleSave();
}

// ---- bug_fields.csv (schema de formularios) ----
const FIELDS_CSV_PREVIOUS_HEADER = [
  "form", "section", "field", "label", "type", "source", "size", "template",
  "sep", "joinprev", "perline", "rows", "required", "regex", "regexmsg",
  "default", "emptyas", "omitvalue", "nogap", "help",
  "hidden", "kwcount", "kwoverlap",
  "ckoptions", "ckalllabel", "ckalloutput", "ckalldependency", "ckallvalue",
  "format"
];
const FIELDS_CSV_CHIP_OUTPUT_HEADER = FIELDS_CSV_PREVIOUS_HEADER.concat([
  "kwmode", "kwsep", "kwperchip", "kwheader"
]);
const FIELDS_CSV_HEADER = FIELDS_CSV_CHIP_OUTPUT_HEADER.concat(["kwspace"]);
// La iteración anterior ya incluía las columnas ck*. Se acepta sin format
// para que sus archivos sigan importando sin tener que editarlos primero.
const FIELDS_CSV_FORMATLESS_HEADER = FIELDS_CSV_PREVIOUS_HEADER.slice(0, -1);
const FIELDS_CSV_LEGACY_HEADER = FIELDS_CSV_PREVIOUS_HEADER.slice(0, 23);
// En la columna sep, la palabra NONE significa "sin separador"
// (pegar al campo anterior); vacío significa "usar el de la sección".
const SEP_NONE = "NONE";
// Las condiciones entre campos viajan como filas type="cond" con este
// mapeo de columnas (documentado en bug_fields.README.md):
//   source=EXPRESIÓN booleana (whenExpr) · regex=acción ·
//   regexmsg=campo destino · emptyas=valor de la acción
// (formato viejo op/valor en template/default se sigue leyendo al importar).

async function exportFieldsCsv() {
  const rows = [FIELDS_CSV_HEADER.slice()];
  const empty = () => new Array(FIELDS_CSV_HEADER.length).fill("");
  const sepOut = (sep) => sep == null ? "" : (sep === "" ? SEP_NONE : sep);

  getForms().forEach(form => {
    const fr = empty();
    fr[0] = form.id; fr[3] = form.label; fr[4] = "form";
    rows.push(fr);
    form.sections.forEach(sec => {
      const sr = empty();
      sr[0] = form.id; sr[1] = sec.id; sr[3] = sec.label; sr[4] = "section";
      sr[5] = sec.mode || "lines";
      sr[7] = sec.heading || "";
      sr[8] = sepOut(sec.sep);
      sr[18] = sec.noGap ? "yes" : "";
      rows.push(sr);
      sec.fields.forEach(f => {
        const isCk = f.type === "checklist";
        rows.push([
          form.id, sec.id, f.id, f.label, f.type || "text",
          f.source || "",
          f.size || "", f.template || "",
          sepOut(isCk ? f.checkSep : f.sep),
          f.joinPrev ? "yes" : "",
          // perline se reutiliza en checklist: yes = "una opción por línea".
          (isCk ? f.checkLayout === "newline" : f.perLine) ? "yes" : "",
          f.rows || "",
          f.required ? "yes" : "", f.regex || "", f.regexMsg || "",
          f.default || "", f.emptyAs || "", f.omitValue || "",
          (f.errColor && f.errColor !== "red") ? f.errColor : "", f.help || "",
          f.hidden ? "yes" : "",
          // La columna kwcount se reutiliza: chips = cantidad · perLine =
          // encabezado opcional · checklist = título en el output.
          f.type === "keywords" ? (f.kwCount || "")
            : isCk ? (f.checkTitle || "")
            : (f.perLineHeader || ""),
          // kwoverlap se reutiliza en checklist: «Todas las anteriores».
          (isCk ? f.allOption : f.kwOverlap) ? "yes" : "",
          isCk && f.options ? JSON.stringify(f.options) : "",
          isCk ? (f.allLabel || "") : "",
          isCk ? (f.allOutput || "") : "",
          isCk ? (f.allDependency || "") : "",
          isCk ? (f.allValue || "") : "",
          isSystemField(f) ? (normalizeSystemFormat(f.type, f.format) === defaultSystemFormat(f.type)
            ? "" : normalizeSystemFormat(f.type, f.format)) : "",
          f.type === "keywords" ? (f.kwMode || "") : "",
          f.type === "keywords" ? (f.kwSep || "") : "",
          f.type === "keywords" && f.kwPerChip === false ? "no" : "",
          f.type === "keywords" ? (f.kwHeader || "") : "",
          f.type === "keywords" && f.kwSpace ? "yes" : ""
        ]);
      });
    });
    // Condiciones entre campos del formulario (type="cond").
    // La expresión booleana (whenExpr) viaja en la columna source.
    getFormRules(form).forEach(r => {
      const cr = empty();
      cr[0] = form.id; cr[4] = "cond";
      cr[5] = r.whenExpr || whenToExpr(r.when) || "";
      cr[13] = r.then.action; cr[14] = r.then.field; cr[16] = r.then.value || "";
      cr[23] = r.editorCondition ? "fieldEditor" : "";
      rows.push(cr);
    });
    // Tiles personalizados (type="tile"). Mapeo de columnas (README):
    //   label=texto · source=expresión (whenExpr) · regex=severidad ·
    //   regexmsg=campo destino · default=color · emptyas=grupo · help=mensaje.
    getFormTiles(form).forEach(tile => {
      const tr = empty();
      tr[0] = form.id; tr[4] = "tile";
      tr[3] = tile.text || "";
      tr[5] = tile.whenExpr || "";
      tr[13] = tile.severity === "error" ? "error" : "warn";
      tr[14] = tile.field || "";
      tr[15] = tile.color || "";
      tr[16] = tile.group || "";
      tr[19] = tile.message || "";
      rows.push(tr);
    });
  });
  await downloadFile("bug_fields.csv", rows.map(r => r.map(csvEscape).join(",")).join("\n"));
}

function importFieldsCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith("#"));
  if (!lines.length) throw new Error(t("dataCsv.empty"));
  const header = parseCsvLine(lines[0]).map(s => s.toLowerCase());
  const isLegacyHeader = header.join(",") === FIELDS_CSV_LEGACY_HEADER.join(",");
  const isFormatlessHeader = header.join(",") === FIELDS_CSV_FORMATLESS_HEADER.join(",");
  const isPreviousHeader = header.join(",") === FIELDS_CSV_PREVIOUS_HEADER.join(",");
  const isChipOutputHeader = header.join(",") === FIELDS_CSV_CHIP_OUTPUT_HEADER.join(",");
  if (!isLegacyHeader && !isFormatlessHeader && !isPreviousHeader && !isChipOutputHeader && header.join(",") !== FIELDS_CSV_HEADER.join(",")) {
    throw new Error(t("fieldsCsv.header", { header: FIELDS_CSV_HEADER.join(",") }));
  }
  const errors = [];
  const forms = [];
  const sepIn = (v) => v === "" ? null : (v === SEP_NONE ? "" : v);

  for (let i = 1; i < lines.length; i++) {
    const r = parseCsvLine(lines[i]);
    while (r.length < FIELDS_CSV_HEADER.length) r.push("");
    const [formId, secId, fieldId, label, type, source, size, template,
           sep, joinprev, perline, rowsN, required, regex, regexmsg,
           def, emptyas, omitvalue, nogap, help,
           hidden, kwcount, kwoverlap,
           ckoptions, ckalllabel, ckalloutput, ckalldependency, ckallvalue,
           format, kwmode, kwsep, kwperchip, kwheader, kwspace] = r;
    const lineNo = i + 1;

    if (type === "form") {
      if (!formId) { errors.push(t("fieldsCsv.lineFormId", { line: lineNo })); continue; }
      if (forms.find(f => f.id === formId)) { errors.push(t("fieldsCsv.lineFormDuplicate", { line: lineNo, form: formId })); continue; }
      forms.push({ id: formId, label: label || formId, sections: [] });
    } else if (type === "cond") {
      // Condición entre campos. Formato nuevo (iteración 3): la EXPRESIÓN
      // booleana viaja en `source` y `template` queda vacío. Formato viejo
      // (iteración 2): source=campo, template=op, default=valor; se detecta
      // por `template` = operador válido y se convierte a expresión al vuelo,
      // así todo queda como `whenExpr` (una sola forma en memoria).
      // regex=acción · regexmsg=campo destino · emptyas=valor de la acción.
      const form = forms.find(f => f.id === formId);
      if (!form) { errors.push(t("fieldsCsv.lineConditionForm", { line: lineNo, form: formId })); continue; }
      if (!COND_ACTIONS.some(([v]) => v === regex)) {
        errors.push(t("fieldsCsv.lineAction", { line: lineNo, action: regex })); continue;
      }
      let whenExpr;
      if (template) {
        if (!COND_OPS.some(([v]) => v === template)) {
          errors.push(t("fieldsCsv.lineOperator", { line: lineNo, operator: template })); continue;
        }
        whenExpr = whenToExpr({ field: source, op: template, value: def || "" });
      } else {
        whenExpr = source || "";
        const exErr = exprError(whenExpr);
        if (exErr) { errors.push(t("fieldsCsv.lineExpression", { line: lineNo, error: exErr })); continue; }
      }
      form.rules = form.rules || [];
      form.rules.push({
        whenExpr: whenExpr,
        editorCondition: ckoptions === "fieldEditor",
        then: { action: regex, field: regexmsg, value: emptyas || "" }
      });
    } else if (type === "tile") {
      // Tile personalizado. label=texto · source=expresión · regex=severidad ·
      // regexmsg=campo destino · default=color · emptyas=grupo · help=mensaje.
      const form = forms.find(f => f.id === formId);
      if (!form) { errors.push(t("fieldsCsv.lineTileForm", { line: lineNo, form: formId })); continue; }
      const exErr = exprError(source || "");
      if (exErr) { errors.push(t("fieldsCsv.lineTileExpression", { line: lineNo, error: exErr })); continue; }
      // Los CSV previos pueden traer "info"; equivale al nuevo "warn".
      if (regex === "info") regex = "warn";
      if (regex && !TILE_SEVERITIES.some(([v]) => v === regex)) {
        errors.push(t("fieldsCsv.lineTileSeverity", { line: lineNo, severity: regex })); continue;
      }
      form.tiles = form.tiles || [];
      form.tiles.push({
        text: label || "", whenExpr: source || "", severity: regex || "warn",
        field: regexmsg || "", color: def || "", group: emptyas || "",
        message: help || ""
      });
    } else if (type === "section") {
      const form = forms.find(f => f.id === formId);
      if (!form) { errors.push(t("fieldsCsv.lineSectionForm", { line: lineNo, form: formId })); continue; }
      if (!secId) { errors.push(t("fieldsCsv.lineSectionId", { line: lineNo })); continue; }
      if (form.sections.find(s => s.id === secId)) { errors.push(t("fieldsCsv.lineSectionDuplicate", { line: lineNo, section: secId })); continue; }
      const sec = { id: secId, label: label || secId, mode: source === "joined" ? "joined" : "lines", fields: [] };
      if (template) sec.heading = template;
      const s = sepIn(sep);
      if (s != null) sec.sep = s;
      if (csvTruthy(nogap)) sec.noGap = true;
      form.sections.push(sec);
    } else {
      // fila de campo
      const form = forms.find(f => f.id === formId);
      if (!form) { errors.push(t("fieldsCsv.lineFieldForm", { line: lineNo, form: formId })); continue; }
      const sec = form.sections.find(s => s.id === secId);
      if (!sec) { errors.push(t("fieldsCsv.lineFieldSection", { line: lineNo, section: secId })); continue; }
      const knownTypes = FIELD_TYPES.map(fieldType => fieldType.id);
      if (!knownTypes.includes(type)) { errors.push(t("fieldsCsv.lineFieldType", { line: lineNo, type })); continue; }
      const id = fieldId || slugify(label);
      if (form.sections.some(s => s.fields.some(f => f.id === id))) {
        errors.push(t("fieldsCsv.lineFieldDuplicate", { line: lineNo, field: id, form: formId }));
        continue;
      }
      const f = { id, label: label || id, type };
      if (source) f.source = source;
      if (size && size !== "full") f.size = size;
      if (template && template !== "{value}") f.template = template;
      const s = sepIn(sep);
      if (s != null) f.sep = s;
      if (csvTruthy(joinprev)) f.joinPrev = true;
      if (csvTruthy(perline)) f.perLine = true;
      const rn = parseInt(rowsN, 10);
      if (rn && rn !== 3) f.rows = rn;
      if (csvTruthy(required)) f.required = true;
      if (regex) {
        try { new RegExp(regex.startsWith("@") ? ".*" : regex); f.regex = regex; }
        catch (e) { errors.push(t("fieldsCsv.lineRegex", { line: lineNo, error: e.message })); }
      }
      if (regexmsg) f.regexMsg = regexmsg;
      if (def) f.default = def;
      if (isSystemField(f)) {
        const normalizedFormat = normalizeSystemFormat(type, format);
        const isLegacyClockFormat = type === "clock" &&
          ["24h-am-pm", "24h-am-pm-dots"].includes(format);
        if (format && !isKnownSystemFormat(type, format) && !isLegacyClockFormat) {
          errors.push(t("fieldsCsv.lineFormat", { line: lineNo, format, type }));
          continue;
        }
        if (format && normalizedFormat !== defaultSystemFormat(type)) f.format = normalizedFormat;
      }
      if (emptyas) f.emptyAs = emptyas;
      if (omitvalue) f.omitValue = omitvalue;
      // En filas de campo la columna nogap se reutiliza para el color del
      // tile de error (rojo por defecto). Un color desconocido se ignora.
      if (nogap && TILE_COLOR_MAP[nogap] && nogap !== "red") f.errColor = nogap;
      if (help) f.help = help;
      if (csvTruthy(hidden)) f.hidden = true;
      if (type === "keywords") {
        if (kwcount) f.kwCount = kwcount;
        if (csvTruthy(kwoverlap)) f.kwOverlap = true;
        // CSV anterior podía usar perline para chips; se migra al modo
        // Líneas actual sin alterar el comportamiento de archivos viejos.
        if (kwmode === "newline" || f.perLine) {
          f.kwMode = "newline";
          delete f.perLine;
          if (String(kwperchip).toLowerCase() === "no") f.kwPerChip = false;
          if (kwheader) f.kwHeader = kwheader;
        }
        if (kwsep) f.kwSep = kwsep;
        if (csvTruthy(kwspace)) f.kwSpace = true;
      } else if (type === "checklist") {
        // CSV anterior: source contenía opciones separadas por |. En v2,
        // source vuelve a ser una fuente DATA y ckoptions guarda JSON robusto.
        if (isLegacyHeader) {
          f.options = (source || "").split("|").map(x => x.trim()).filter(Boolean);
          delete f.source;
        } else if (ckoptions) {
          try {
            const parsed = JSON.parse(ckoptions);
            if (!Array.isArray(parsed)) throw new Error("no es un array");
            f.options = parsed.map(String).map(x => x.trim()).filter(Boolean);
          } catch (e) {
            errors.push(t("fieldsCsv.lineOptionsJson", { line: lineNo }));
            continue;
          }
        }
        if (!f.source && !(f.options || []).length) {
          errors.push(t("fieldsCsv.lineChecklist", { line: lineNo }));
          continue;
        }
        if (f.sep != null) { f.checkSep = f.sep; delete f.sep; }
        if (f.perLine) { f.checkLayout = "newline"; delete f.perLine; }
        if (kwcount) f.checkTitle = kwcount;
        if (csvTruthy(kwoverlap)) {
          f.allOption = true;
          if (ckalllabel) f.allLabel = ckalllabel;
          if (ckalloutput) f.allOutput = ckalloutput;
          if (ckalldependency === "none") f.allDependency = "none";
          if (ckallvalue) f.allValue = ckallvalue;
        }
      } else if (f.perLine && kwcount) {
        // Columna reutilizada: fuera de chips, kwcount lleva el
        // encabezado opcional de los campos "plantilla por línea".
        f.perLineHeader = kwcount;
      }
      if (isSystemField(f)) {
        ["source", "default", "rows", "emptyAs", "omitValue", "perLine",
         "perLineHeader", "required", "regex", "regexMsg", "kwCount", "kwOverlap",
         "kwMode", "kwSep", "kwPerChip", "kwHeader", "kwSpace"]
          .forEach(k => delete f[k]);
      }
      sec.fields.push(f);
    }
  }

  // Las condiciones deben apuntar a campos que existan en su formulario:
  // los campos comparados en la expresión y el campo destino del "entonces".
  forms.forEach(form => {
    getFormRules(form).forEach((r, i) => {
      const has = (id) => form.sections.some(s => s.fields.some(f => f.id === id));
      exprFieldRefs(r.whenExpr).forEach(fid => {
        if (!has(fid) && !isMediaTypeConditionRef(fid)) errors.push(t("fieldsCsv.conditionField", {
          index: i + 1, form: form.id, field: fid
        }));
      });
      if (!has(r.then.field)) errors.push(t("fieldsCsv.conditionTarget", {
        index: i + 1, form: form.id, field: r.then.field
      }));
    });
    // Los tiles apuntan a campos que existan (los de la condición y "salta a").
    getFormTiles(form).forEach((tile, i) => {
      const has = (id) => form.sections.some(s => s.fields.some(f => f.id === id));
      exprFieldRefs(tile.whenExpr).forEach(fid => {
        if (!has(fid) && !isMediaTypeConditionRef(fid)) errors.push(t("fieldsCsv.tileField", {
          index: i + 1, form: form.id, field: fid
        }));
      });
      if (tile.field && !has(tile.field)) errors.push(t("fieldsCsv.tileTarget", {
        index: i + 1, form: form.id, field: tile.field
      }));
    });
    allFields(form).forEach(({ field }) => {
      if (field.type === "checkbox") return;
      const ownId = field.type === "mirror" ? "" : field.id;
      const templateErrors = templateReferenceErrors(field.template || "", form, ownId);
      const headerErrors = field.perLine
        ? templateReferenceErrors(field.perLineHeader || "", form, ownId) : [];
      [...new Set(templateErrors.concat(headerErrors))].forEach(error => {
        errors.push(t("fieldsCsv.template", { field: field.id, form: form.id, error }));
      });
    });
  });

  if (!forms.length || !forms.some(f => f.sections.length)) {
    errors.push(t("fieldsCsv.noForms"));
  }
  if (errors.length) {
    showConfirmModal({
      title: t("fieldsCsv.errorsTitle"),
      body: escapeHtml(t("fieldsCsv.errorsBody")) + "<br /><br />" +
            errors.slice(0, 15).map(escapeHtml).join("<br />") +
            (errors.length > 15 ? `<br />(${escapeHtml(t("fieldsCsv.more", { count: errors.length - 15 }))})` : ""),
      confirmText: t("common.understood"),
      onConfirm: () => {}
    });
    return;
  }

  showConfirmModal({
    title: t("fieldsCsv.replaceTitle"),
    body: t("fieldsCsv.replaceBody", { forms: forms.map(f => escapeHtml(f.label)).join(", ") }),
    confirmText: t("fieldsCsv.replace"),
    confirmClass: "danger",
    onConfirm: () => {
      config.schema.forms = forms;
      normalizeFieldSources(config.schema.forms); // fuentes viejas del CSV -> árbol
      ensureTiles(config); // completa defaults de los tiles importados
      ensureSessionConsistency();
      refreshAll();
      scheduleSave();
      flashBanner(t("boot.fieldsUpdated"));
    }
  });
}

/* ================================================================
   [16] EXPORTAR HERRAMIENTA (HTML AUTOCONTENIDO)
   ================================================================
   Toma la copia prístina del archivo y reemplaza el bloque
   #vanillaConfig por la config actual (campos + datos + reglas).
   El archivo descargado se pone en el sharefolder y listo: quien lo
   abra tendrá todo integrado, sin cargar ningún CSV. */
async function exportToolHtml() {
  // Escapar cada "<" impide que una etiqueta de cierre de script —incluso
  // con mayúsculas o dentro de texto configurable— cierre #vanillaConfig.
  const json = JSON.stringify(config, null, 2)
    .replace(/</g, "\\u003c")
    .replace(/\u2028/g, "\\u2028")
    .replace(/\u2029/g, "\\u2029");
  // La copia exportada conserva defaults estables. Al abrirla, el bootstrap
  // temprano vuelve a aplicar las preferencias del navegador sin flash.
  const pristine = PRISTINE_HTML.replace(/<html\b([^>]*)>/i, (match, attrs) => {
    const clean = attrs
      .replace(/\s+lang=(['"])[\s\S]*?\1/i, "")
      .replace(/\s+data-theme=(['"])[\s\S]*?\1/i, "");
    return `<html${clean} lang="es" data-theme="light">`;
  });
  const marker = 'id="vanillaConfig">';
  const start = pristine.indexOf(marker);
  if (start < 0) { flashBanner(t("export.configMissing"), true); return; }
  const end = pristine.indexOf(SCRIPT_END, start);
  if (end < 0) { flashBanner(t("export.configMissing"), true); return; }
  const out = pristine.slice(0, start + marker.length)
            + "\n" + json + "\n"
            + pristine.slice(end);
  const saved = await downloadFile(APP_META.exportName, out);
  if (!saved) return;
  // Lo exportado pasa a ser la nueva "vanilla": ya no hay diferencia
  vanilla = deepClone(config);
  updateConfigChip();
  flashBanner(t("export.saved"));
}

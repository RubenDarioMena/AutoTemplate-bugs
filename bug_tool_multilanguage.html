/* MONOLITH:SECTION 06-tabs-navigation START */
/* ================================================================
   [6] RENDER: PESTAÑAS SUPERIORES Y SUB-PESTAÑAS
   ================================================================ */
// Bug y Regression pueden compartir IDs de campo. La transferencia parte
// siempre de la instancia visible y nunca toca media ni el textarea editado.
function pairedFormId(formId) {
  if (formId === "bug") return "regression";
  if (formId === "regression") return "bug";
  return "";
}

function isMultiValueField(field) {
  return !!field && (field.type === "keywords" || field.type === "checklist");
}

function hasExportableValue(field, value) {
  if (isMultiValueField(field)) return Array.isArray(value) && value.length > 0;
  // Una casilla desmarcada también es una decisión explícita del usuario.
  if (field.type === "checkbox") return value !== undefined;
  return String(value == null ? "" : value).trim() !== "";
}

function exportSharedFieldValues(source, target) {
  const sourceForm = getForm(source.formId);
  const targetForm = getForm(target.formId);
  if (!sourceForm || !targetForm) return { copied: 0, incompatible: 0 };
  ensureInstanceFields(source);
  ensureInstanceFields(target);
  const targetFields = new Map(allFields(targetForm).map(({ field }) => [field.id, field]));
  let copied = 0;
  let incompatible = 0;

  allFields(sourceForm).forEach(({ field }) => {
    const targetField = targetFields.get(field.id);
    if (!targetField || field.type === "mirror" || targetField.type === "mirror" ||
        isSystemField(field) || isSystemField(targetField)) return;
    // Evita dejar un textarea/lista con una forma de dato que su widget no
    // puede representar si dos formularios reutilizan un ID para tipos distintos.
    if (isMultiValueField(field) !== isMultiValueField(targetField)) {
      incompatible++;
      return;
    }
    const value = source.values[field.id];
    if (!hasExportableValue(field, value)) return;
    target.values[field.id] = deepClone(value);
    copied++;
  });
  if (copied) {
    // El output automático se recalculará al abrir el destino. Uno editado a
    // mano se conserva, pues exportar campos no debe borrar esa edición.
    if (!target.outputEdited) target.output = "";
    revalidate(target, false);
    markInstanceDirty(target);
  }
  return { copied, incompatible };
}

function showExportToOtherFormModal() {
  const source = getActiveInstance();
  const sourceForm = source && getForm(source.formId);
  const targetFormId = sourceForm && pairedFormId(sourceForm.id);
  const targetForm = targetFormId && getForm(targetFormId);
  if (!source || !sourceForm || !targetForm) return;
  const targets = state.instances.filter(inst => inst.formId === targetForm.id);
  const targetLabel = configuredText(targetForm.label);
  if (!targets.length) {
    flashBanner(t("instance.exportNoTabs", { form: targetLabel }), true);
    return;
  }
  showSelectModal({
    title: t("instance.exportTitle", { form: targetLabel }),
    body: t("instance.exportBody", { source: escapeHtml(source.title) }),
    options: targets.map(inst => ({ value: inst.id, label: inst.title || targetLabel })),
    confirmText: t("instance.exportFields"),
    onConfirm: (targetId) => {
      const target = state.instances.find(inst => inst.id === targetId && inst.formId === targetForm.id);
      if (!target) { flashBanner(t("instance.targetMissing"), true); return; }
      const result = exportSharedFieldValues(source, target);
      if (!result.copied) {
        flashBanner(t("instance.noCompatibleFields"), true);
        return;
      }
      const skipped = result.incompatible ? tp("instance.incompatible", result.incompatible) : "";
      const manual = target.outputEdited ? t("instance.manualPreserved") : "";
      flashBanner(tp("instance.exported", result.copied, {
        target: target.title, details: skipped + manual
      }));
      scheduleSave();
    }
  });
}

function renderTopTabs() {
  const cont = $("formTabs");
  cont.innerHTML = getForms().map(f =>
    `<div class="top-tab${state.topTab === f.id ? " active" : ""}" data-form="${escapeHtml(f.id)}" role="tab" tabindex="0" aria-selected="${state.topTab === f.id}">${escapeHtml(configuredText(f.label))}</div>`
  ).join("");
  cont.querySelectorAll("[data-form]").forEach(el => {
    el.addEventListener("click", () => switchToForm(el.dataset.form));
    el.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        switchToForm(el.dataset.form);
      }
    });
  });
  document.querySelectorAll('#topTabs [data-tab]').forEach(el => {
    const active = state.topTab === el.dataset.tab;
    el.classList.toggle("active", active);
    el.setAttribute("aria-selected", String(active));
  });
  // Mostrar el contenedor que toca
  const isForm = !!getForm(state.topTab);
  $("subTabsAndMain").style.display = isForm ? "flex" : "none";
  $("tilesBar").classList.toggle("hidden", !isForm);
  $("dataContainer").style.display = state.topTab === "data" ? "flex" : "none";
  $("rulesContainer").style.display = state.topTab === "rules" ? "block" : "none";
}

function switchToForm(formId) {
  state.topTab = formId;
  const existing = state.instances.find(i => i.formId === formId);
  if (!existing) { addInstance(); return; } // addInstance ya re-pinta y guarda
  const active = getActiveInstance();
  if (!active || active.formId !== formId) state.activeInstanceId = existing.id;
  refreshAll();
  scheduleSave();
}

function refreshSubTabs() {
  const bar = $("subTabs");
  bar.innerHTML = "";
  const visible = state.instances.filter(i => i.formId === state.topTab);
  visible.forEach(inst => {
    const el = document.createElement("div");
    el.className = "sub-tab" + (inst.id === state.activeInstanceId ? " active" : "")
                 + (inst.dirty ? " dirty" : "");
    el.setAttribute("role", "tab");
    el.tabIndex = 0;
    el.setAttribute("aria-selected", String(inst.id === state.activeInstanceId));
    el.innerHTML = `<span class="dirty-dot"></span>
                    <span class="label">${escapeHtml(inst.title)}</span>
                    <span class="tab-action" data-tab-rename title="${escapeHtml(t("instance.renameAction"))}">✎</span>
                    <span class="tab-action" data-tab-duplicate title="${escapeHtml(t("instance.duplicateAction"))}">⧉</span>
                    <span class="close" title="${escapeHtml(t("common.close"))}">×</span>`;
    el.addEventListener("click", e => {
      if (e.target.closest("[data-tab-rename]")) {
        e.stopPropagation();
        renameInstance(inst.id);
      } else if (e.target.closest("[data-tab-duplicate]")) {
        e.stopPropagation();
        duplicateInstance(inst.id);
      } else if (e.target.closest(".close")) {
        e.stopPropagation();
        closeInstance(inst.id);
      } else if (inst.id !== state.activeInstanceId) {
        state.activeInstanceId = inst.id;
        refreshAll();
        scheduleSave();
      }
    });
    el.addEventListener("dblclick", (e) => {
      if (e.target.closest(".close") || e.target.closest(".tab-action")) return;
      e.preventDefault();
      renameInstance(inst.id);
    });
    el.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        state.activeInstanceId = inst.id;
        refreshAll();
        scheduleSave();
      }
    });
    bar.appendChild(el);
  });
  const plus = document.createElement("div");
  plus.className = "sub-tab-new";
  plus.setAttribute("role", "button");
  plus.tabIndex = 0;
  plus.textContent = "+";
  plus.title = t("instance.new");
  plus.addEventListener("click", addInstance);
  plus.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); addInstance(); }
  });
  bar.appendChild(plus);
}

function addInstance() {
  const form = getForm(state.topTab);
  if (!form) return;
  const inst = makeInstance(state.topTab);
  inst.title = nextInstanceTitle(state.topTab, configuredText(form.label) + " 1");
  inst.dirty = true;
  state.instances.push(inst);
  state.activeInstanceId = inst.id;
  refreshAll();
  scheduleSave();
}

function closeInstance(id) {
  const inst = state.instances.find(i => i.id === id);
  if (!inst) return;
  const doClose = () => {
    state.instances = state.instances.filter(i => i.id !== id);
    if (state.activeInstanceId === id) {
      const remaining = state.instances.filter(i => i.formId === state.topTab);
      state.activeInstanceId = remaining.length ? remaining[0].id : null;
      if (!state.activeInstanceId) { addInstance(); return; }
    }
    refreshAll();
    scheduleSave();
  };
  if (inst.dirty && !state.prefs.dontAskOnClose) {
    showConfirmModal({
      title: t("instance.discardTitle"),
      body: t("instance.discardBody", { title: escapeHtml(inst.title) }),
      confirmText: t("instance.discard"),
      confirmClass: "danger",
      showDontAsk: true,
      onConfirm: (dontAsk) => {
        if (dontAsk) state.prefs.dontAskOnClose = true;
        doClose();
      }
    });
  } else {
    doClose();
  }
}

function refreshAll() {
  renderTopTabs();
  const isForm = !!getForm(state.topTab);
  if (isForm) {
    refreshSubTabs();
    renderForm();
    renderMediaPanel();
  } else if (state.topTab === "data") {
    renderDataTab();
  } else if (state.topTab === "rules") {
    renderRulesTab();
  }
  updateConfigChip();
}

/* MONOLITH:SECTION 06-tabs-navigation END */
/* MONOLITH:SECTION 07-form-rendering START */
/* ================================================================
   [7] RENDER: FORMULARIO (NORMAL + MODO EDICIÓN)
   ================================================================
   Todo el formulario se pinta a partir del schema. En modo edición
   aparecen los controles ↑ ↓ ✎ ✕ en secciones y campos. En escritorio,
   el asa ⠿ de cada campo también permite arrastrarlo. El orden visual de
   arriba hacia abajo ES el orden del output. */
function renderForm() {
  const inst = getActiveInstance();
  const form = getForm(state.topTab);
  const panel = $("formPanel");
  if (!inst || !form) { panel.innerHTML = `<p>${escapeHtml(t("form.noActiveInstance"))}</p>`; return; }
  ensureInstanceFields(inst);
  $("formTitle").textContent = inst.title || configuredText(form.label);
  const toggle = $("editToggle");
  toggle.classList.toggle("active", state.editMode);
  toggle.textContent = t(state.editMode ? "form.finishEdit" : "form.edit");
  const exportBtn = $("exportToOtherFormBtn");
  const exportTarget = getForm(pairedFormId(form.id));
  exportBtn.hidden = !exportTarget;
  if (exportTarget) {
    const targetLabel = configuredText(exportTarget.label);
    exportBtn.textContent = t("form.exportTo", { form: targetLabel });
    exportBtn.title = t("form.exportToTitle", { form: targetLabel });
  }
  const dragModeToggle = $("fieldDragModeToggle");
  dragModeToggle.checked = !!state.prefs.dragFields;
  document.body.classList.toggle("editing", state.editMode);
  document.body.classList.toggle("drag-fields", state.editMode && !!state.prefs.dragFields);

  // Estado de las condiciones entre campos (ocultar/bloquear/default)
  const fx = evalFieldRules(form, inst);
  lastFxJson = JSON.stringify(fx);

  panel.innerHTML = form.sections.map(sec => sectionHtml(sec, inst, fx, form)).join("")
    + `<button class="add-section-btn" id="addSectionBtn">${escapeHtml(t("form.addSection"))}</button>`;
  wireFormEvents(inst, form);
  revalidate(inst);
  renderOutput();
}

// Última foto del estado de condiciones que está pintado en pantalla;
// si al validar cambia (ej. escribieron "LOD"), se re-pinta el form.
let lastFxJson = "";
function rerenderIfRulesChanged(form, inst) {
  const fxNow = JSON.stringify(evalFieldRules(form, inst));
  if (fxNow !== lastFxJson) renderForm();
}

// Estado de colapso de la UI (fase "compactación"): SOLO en memoria. No se
// guarda en state.prefs ni se exporta; cada recarga arranca todo expandido
// (decisión de diseño). Se relee en cada render, así el colapso sobrevive a
// los re-render dentro de la sesión pero no a un reload.
const uiCollapse = {
  sections: Object.create(null), form: false, media: false, actions: false,
  output: false, outputAutoCollapsed: false, outputManualInNarrow: false
};
function sectionCollapseKey(form, secId) { return form.id + ":" + secId; }

function sectionHtml(sec, inst, fx, form) {
  const sid = escapeHtml(sec.id);
  const tools = `
    <span class="sec-tools">
      <button class="tool-btn add" data-sec-add="${sid}" title="${escapeHtml(t("form.sectionAddFieldTitle"))}">${escapeHtml(t("form.sectionAddField"))}</button>
      <button class="tool-btn mv" data-sec-up="${sid}" title="${escapeHtml(t("form.sectionUp"))}">▲</button>
      <button class="tool-btn mv" data-sec-down="${sid}" title="${escapeHtml(t("form.sectionDown"))}">▼</button>
      <button class="tool-btn ed" data-sec-edit="${sid}" title="${escapeHtml(t("form.sectionEdit"))}">✎</button>
      <button class="tool-btn del" data-sec-del="${sid}" title="${escapeHtml(t("form.sectionDelete"))}">✕</button>
    </span>`;
  // Fuera de edición, los mirrors no participan en el grid: CSS los oculta,
  // pero si se agruparan antes reservarían una columna vacía. Los campos
  // ocultos por condición tampoco se pintan; en edición ambos siguen visibles
  // para poder configurarlos.
  const visibleFields = sec.fields.filter(f =>
    state.editMode || (f.type !== "mirror" && !(fx[f.id] && fx[f.id].hidden)));
  // Agrupa medios en filas de 2 y tercios/2-3 en filas de 3 columnas.
  const rows = [];
  let group = null;
  const flush = () => {
    if (group && group.items.length) rows.push(group);
    group = null;
  };
  visibleFields.forEach(f => {
    const mode = f.size === "half" ? "half"
      : (f.size === "third" || f.size === "twoThirds") ? "thirds"
      : "full";
    if (mode === "full") {
      flush();
      rows.push({ layout: "full", items: [f] });
      return;
    }
    if (mode === "half") {
      if (!group || group.layout !== "row-2" || group.items.length >= 2) {
        flush();
        group = { layout: "row-2", items: [] };
      }
      group.items.push(f);
      if (group.items.length >= 2) flush();
      return;
    }
    const units = f.size === "twoThirds" ? 2 : 1;
    if (!group || group.layout !== "row-3" || (group.units + units) > 3) {
      flush();
      group = { layout: "row-3", items: [], units: 0 };
    }
    group.items.push(f);
    group.units += units;
    if (group.units >= 3) flush();
  });
  flush();
  const body = rows.map(g => {
    const cells = g.items.map(f => fieldHtml(f, inst, fx)).join("");
    if (g.layout === "row-2") return `<div class="row-2">${cells}</div>`;
    if (g.layout === "row-3") return `<div class="row-3">${cells}</div>`;
    return cells;
  }).join("");
  const collapsed = !!uiCollapse.sections[sectionCollapseKey(form, sec.id)];
  return `<div class="form-section${collapsed ? " collapsed" : ""}" data-section="${sid}">
    <h4>
      <button class="sec-collapse" data-sec-collapse="${sid}" title="${escapeHtml(t("form.sectionCollapse"))}" aria-expanded="${!collapsed}"><span class="chev">▾</span></button>
      <span class="sec-label">${escapeHtml(configuredText(sec.label))}</span>${tools}
    </h4>
    <div class="form-section-body"><div class="form-section-body-inner">${body}</div></div>
  </div>`;
}

function fieldHtml(field, inst, fx) {
  const err = inst.errors[field.id] || "";
  const invalid = err ? " invalid" : "";
  const st = (fx && fx[field.id]) || { hidden: false, disabled: false };
  const dis = st.disabled ? " disabled" : "";
  const readonlyCls = (st.disabled && !st.hidden) ? " fe-readonly" : "";
  const fid = escapeHtml(field.id);
  const fieldLabel = configuredText(field.label);
  const inputId = `field-${fid}`;
  const labelId = `label-${fid}`;
  const tools = `
    <span class="fld-tools">
      <button type="button" class="tool-btn mv fld-drag-handle" data-fld-drag="${fid}" title="${escapeHtml(t("form.fieldDragTitle"))}" aria-label="${escapeHtml(t("form.fieldDrag"))}">⠿</button>
      <button class="tool-btn mv" data-fld-up="${fid}" title="${escapeHtml(t("form.fieldUp"))}">▲</button>
      <button class="tool-btn mv" data-fld-down="${fid}" title="${escapeHtml(t("form.fieldDown"))}">▼</button>
      <button class="tool-btn ed" data-fld-edit="${fid}" title="${escapeHtml(t("form.fieldEdit"))}">✎</button>
      <button class="tool-btn del" data-fld-del="${fid}" title="${escapeHtml(t("form.fieldDelete"))}">✕</button>
    </span>`;
  const stateTag = st.hidden ? `<span class="hidden-tag">(${escapeHtml(t("form.hidden"))})</span>`
                 : st.disabled ? `<span class="hidden-tag">(${escapeHtml(t("form.blocked"))})</span>` : "";
  const copyBtn = field.type === "mirror" ? "" : `<button type="button" class="field-copy-btn" data-copy-field="${fid}" title="${escapeHtml(t("form.fieldCopy"))}" aria-label="${escapeHtml(t("common.copy"))} ${escapeHtml(fieldLabel)}">⧉</button>`;
  const labelHtml = `<div class="field-head"><label id="${labelId}"${field.type === "mirror" || field.type === "checklist" ? "" : ` for="${inputId}"`}>${escapeHtml(fieldLabel)}${field.required ? '<span class="req">*</span>' : ""}${stateTag}<code class="field-id-hint" title="${escapeHtml(t("form.templateReference", { reference: `{${field.id}}` }))}">${fid}</code></label>${copyBtn}${tools}</div>`;
  const helpHtml = field.help ? `<div class="field-help">${escapeHtml(configuredText(field.help))}</div>` : "";
  const errHtml = `<div class="field-error">${escapeHtml(err)}</div>`;
  const val = field.type === "mirror" ? "" : (inst.values[field.id] != null ? inst.values[field.id] : "");
  const sizeClass = field.size === "twoThirds" ? " span-2" : "";
  // Clase por tipo: pinta la esquina inferior-izquierda del campo.
  const ftCls = " ft-" + (field.type || "text");

  if (field.type === "mirror") {
    // Solo visible en modo edición: no se llena; su plantilla puede componer
    // valores de otros campos y filas de media para el output.
    const template = field.template || "{value}";
    const refs = templatePlaceholders(template).filter(ref => ref !== "value");
    const valueInfo = templatePlaceholders(template).includes("value")
      ? t("form.mirrorValue", { value: "{value}", source: escapeHtml(field.source || t("form.mirrorNoPrimary")) }) : "";
    const refsInfo = refs.length
      ? t("form.mirrorRefs", { references: refs.map(ref => "{" + escapeHtml(ref) + "}").join(", ") }) : "";
    return `<div class="field mirror-field${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
      ${labelHtml}
      <div class="mirror-note">${t("form.mirrorOutput", { template: escapeHtml(template), details: valueInfo + refsInfo + " " + t("form.mirrorOnlyOutput") })}</div>
    </div>`;
  }
  if (field.type === "checkbox") {
    // Casilla sí/no: no imprime nada en el output. Sirve como interruptor
    // para RULES (marcada = "yes" → notEmpty / equals yes).
    const checked = String(val == null ? "" : val).trim() ? " checked" : "";
    return `<div class="field checkbox-field${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
      <div class="field-head"><label class="cb-inline"><input id="${inputId}" type="checkbox" data-bind="${escapeHtml(field.id)}"${checked}${dis} /> ${escapeHtml(fieldLabel)}${stateTag}</label>${tools}</div>
      ${helpHtml}
    </div>`;
  }
  if (field.type === "checklist") {
    // Título + varias casillas. El valor es la lista de opciones marcadas.
    const arr = Array.isArray(val) ? val : [];
    const opts = checklistNormalOptions(field, inst);
    const allValue = checklistSpecialValue(field);
    const allChecked = field.allOption && arr.includes(allValue);
    const boxes = opts.map(o =>
      `<label class="ck-opt"><input type="checkbox" data-ck="${fid}" value="${escapeHtml(o)}"${arr.includes(o) ? " checked" : ""}${allChecked || dis ? " disabled" : ""} /> ${escapeHtml(o)}</label>`
    ).join("");
    const allBox = field.allOption
      ? `<label class="ck-opt ck-all"><input type="checkbox" data-ck-all="${fid}" value="${escapeHtml(allValue)}"${allChecked ? " checked" : ""}${dis} /> ${escapeHtml(configuredText(field.allLabel || t("form.checklistAll")))}</label>`
      : "";
    return `<div class="field checklist-field${invalid}${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
      ${labelHtml}
      <div class="checklist${field.checkLayout === "newline" ? " ck-col" : ""}" data-ck-group="${escapeHtml(field.id)}" role="group" aria-labelledby="${labelId}">${boxes}${allBox}<button type="button" class="checklist-add" data-ck-add="${fid}" title="${escapeHtml(t("form.checklistAdd"))}" aria-label="${escapeHtml(t("form.checklistAdd"))}">+</button><input type="text" class="checklist-add-input" data-ck-add-input="${fid}" placeholder="${escapeHtml(t("form.checklistNew"))}" hidden${dis} /></div>
      ${errHtml}${helpHtml}
    </div>`;
  }
  if (isSystemField(field)) {
    const systemLabel = t(field.type === "clock" ? "form.systemClock" : "form.systemDate");
    return `<div class="field system-field${invalid}${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
      ${labelHtml}
      <input id="${inputId}" type="text" class="system-value" data-system-value="${escapeHtml(field.id)}" value="${escapeHtml(val)}" readonly aria-label="${escapeHtml(systemLabel)}" title="${escapeHtml(t("form.systemUpdates", { label: systemLabel }))}" />
      ${errHtml}${helpHtml}
    </div>`;
  }
  if (field.type === "textarea") {
    return `<div class="field${invalid}${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
      ${labelHtml}
      <textarea id="${inputId}" class="${readonlyCls.trim()}" data-bind="${escapeHtml(field.id)}" rows="${field.rows || 3}"${dis}>${escapeHtml(val)}</textarea>
      ${errHtml}${helpHtml}
    </div>`;
  }
  if (field.type === "autocomplete") {
    return `<div class="field autocomplete${invalid}${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
      ${labelHtml}
      <div class="autocomplete-input-wrap">
        <input id="${inputId}" type="text" class="${readonlyCls.trim()}" data-bind="${escapeHtml(field.id)}" data-ac="${escapeHtml(field.id)}" value="${escapeHtml(val)}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="aclist-${fid}"${dis} />
        <span class="autocomplete-arrow" data-ac-toggle title="${escapeHtml(t("form.autocompleteShowAll"))}">▼</span>
      </div>
      <div class="autocomplete-list" id="aclist-${fid}" role="listbox"></div>
      ${errHtml}${helpHtml}
    </div>`;
  }
  if (field.type === "keywords") {
    const kws = Array.isArray(val) ? val : [];
    return `<div class="field${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
      ${labelHtml}
      <div class="chips autocomplete${err ? " invalid" : ""}" data-kw-chips="${escapeHtml(field.id)}">
        ${kwChipsInnerHtml(field.id, kws, readonlyCls.trim(), dis, keywordBadSet(inst, field), field.kwSpace)}
      </div>
      ${err ? `<div class="chips-error">${escapeHtml(err)}</div>` : ""}
      ${helpHtml}
    </div>`;
  }
  // text (default)
  return `<div class="field${invalid}${ftCls}${sizeClass}" data-field="${escapeHtml(field.id)}">
    ${labelHtml}
    <input id="${inputId}" type="text" class="${readonlyCls.trim()}" data-bind="${escapeHtml(field.id)}" value="${escapeHtml(val)}"${dis} />
    ${errHtml}${helpHtml}
  </div>`;
}

// El buscador opera únicamente sobre los input/textarea editables que están
// pintados en el formulario activo; nunca toca output, media ni schema.
let formSearchMatch = null;

function formSearchControls() {
  return [...$("formPanel").querySelectorAll("input[data-bind], textarea[data-bind]")]
    .filter(el => el.type !== "checkbox" && !el.disabled && !el.readOnly);
}

function setFormSearchStatus(text) {
  $("formSearchStatus").textContent = text || "";
}

function findFormText() {
  const query = $("formFindInput").value;
  if (!query) { setFormSearchStatus(t("form.searchTypeSomething")); return null; }
  const controls = formSearchControls();
  if (!controls.length) { setFormSearchStatus(t("form.searchNoVisibleFields")); return null; }
  let startAt = 0;
  let offset = 0;
  if (formSearchMatch && formSearchMatch.query === query) {
    const current = controls.indexOf(formSearchMatch.el);
    if (current >= 0) {
      startAt = current;
      offset = formSearchMatch.end;
    }
  }
  for (let step = 0; step < controls.length; step++) {
    const idx = (startAt + step) % controls.length;
    const el = controls[idx];
    const from = step === 0 ? offset : 0;
    let pos = el.value.indexOf(query, from);
    if (pos < 0 && step > 0) pos = el.value.indexOf(query);
    if (pos < 0) continue;
    el.focus();
    el.setSelectionRange(pos, pos + query.length);
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    formSearchMatch = { el, start: pos, end: pos + query.length, query };
    setFormSearchStatus(t("form.searchFound"));
    return formSearchMatch;
  }
  formSearchMatch = null;
  setFormSearchStatus(t("form.searchNone"));
  return null;
}

function commitFormSearchChanges(changedFields) {
  const inst = getActiveInstance();
  const form = inst && getForm(inst.formId);
  if (!inst || !form || !changedFields.length) return;
  changedFields.forEach(id => clearDependents(form, id, inst, $("formPanel")));
  markInstanceDirty(inst);
  revalidate(inst);
  renderOutput();
  renderMediaPanel();
  scheduleSave();
  rerenderIfRulesChanged(form, inst);
}

function replaceFormText(all) {
  const query = $("formFindInput").value;
  if (!query) { setFormSearchStatus(t("form.searchTypeSomething")); return; }
  const replacement = $("formReplaceInput").value;
  const inst = getActiveInstance();
  if (!inst) return;
  const changed = [];
  if (all) {
    formSearchControls().forEach(el => {
      if (!el.value.includes(query)) return;
      el.value = el.value.split(query).join(replacement);
      inst.values[el.dataset.bind] = el.value;
      changed.push(el.dataset.bind);
    });
    formSearchMatch = null;
    if (!changed.length) { setFormSearchStatus(t("form.searchNone")); return; }
    commitFormSearchChanges(changed);
    setFormSearchStatus(tp("form.replaceCount", changed.length));
    return;
  }
  const match = formSearchMatch && formSearchMatch.query === query ? formSearchMatch : findFormText();
  if (!match) return;
  const { el, start, end } = match;
  el.value = el.value.slice(0, start) + replacement + el.value.slice(end);
  inst.values[el.dataset.bind] = el.value;
  changed.push(el.dataset.bind);
  formSearchMatch = { el, start, end: start + replacement.length, query };
  el.focus();
  el.setSelectionRange(start, start + replacement.length);
  commitFormSearchChanges(changed);
  setFormSearchStatus(t("form.replaceOne"));
}

function wireFormSearch() {
  const box = $("formSearch");
  const find = $("formFindInput");
  $("formSearchToggle").addEventListener("click", () => {
    const open = box.classList.toggle("open");
    if (open) find.focus();
  });
  find.addEventListener("input", () => { formSearchMatch = null; setFormSearchStatus(""); });
  find.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); findFormText(); } });
  $("formFindBtn").addEventListener("click", findFormText);
  $("formReplaceBtn").addEventListener("click", () => replaceFormText(false));
  $("formReplaceAllBtn").addEventListener("click", () => replaceFormText(true));
}

// Reordenamiento de escritorio con Pointer Events. Evita DataTransfer y el
// comportamiento inconsistente del DnD HTML nativo al abrir el monolito desde
// file://. El schema sigue siendo la fuente de verdad y sólo cambia al soltar.
const fieldDragState = {
  fieldId: "", targetSectionId: "", targetIndex: -1,
  pointerId: null, sourceEl: null, handleEl: null,
  placeholderEl: null, ghostEl: null, offsetX: 0, offsetY: 0,
  moveHandler: null, upHandler: null, cancelHandler: null
};

function fieldDragEnabled() {
  return state.editMode && !!state.prefs.dragFields;
}

function clearFieldDropTarget(panel) {
  panel.querySelectorAll(".field-drop-at-end").forEach(el =>
    el.classList.remove("field-drop-at-end"));
  fieldDragState.targetSectionId = "";
  fieldDragState.targetIndex = -1;
}

function resetFieldPointerDrag(panel) {
  clearFieldDropTarget(panel);
  if (fieldDragState.moveHandler) document.removeEventListener("pointermove", fieldDragState.moveHandler);
  if (fieldDragState.upHandler) document.removeEventListener("pointerup", fieldDragState.upHandler);
  if (fieldDragState.cancelHandler) document.removeEventListener("pointercancel", fieldDragState.cancelHandler);
  if (fieldDragState.placeholderEl) fieldDragState.placeholderEl.remove();
  if (fieldDragState.ghostEl) fieldDragState.ghostEl.remove();
  if (fieldDragState.sourceEl) fieldDragState.sourceEl.classList.remove("field-drag-source");
  if (fieldDragState.handleEl) fieldDragState.handleEl.classList.remove("is-pressed");
  document.body.classList.remove("field-pointer-dragging");
  fieldDragState.fieldId = "";
  fieldDragState.pointerId = null;
  fieldDragState.sourceEl = null;
  fieldDragState.handleEl = null;
  fieldDragState.placeholderEl = null;
  fieldDragState.ghostEl = null;
  fieldDragState.offsetX = 0;
  fieldDragState.offsetY = 0;
  fieldDragState.moveHandler = null;
  fieldDragState.upHandler = null;
  fieldDragState.cancelHandler = null;
}

function previewFieldElements(panel) {
  return [...panel.querySelectorAll("[data-field]")].filter(el =>
    el !== fieldDragState.sourceEl && !el.classList.contains("field-drag-ghost"));
}

function moveFieldPlaceholder(panel, parent, beforeNode) {
  const placeholder = fieldDragState.placeholderEl;
  if (!placeholder || !parent) return;
  const alreadyThere = beforeNode
    ? placeholder.parentNode === parent && placeholder.nextSibling === beforeNode
    : placeholder.parentNode === parent && placeholder.nextSibling === null;
  if (alreadyThere) return;

  const fields = previewFieldElements(panel);
  fields.forEach(el => {
    if (typeof el.getAnimations === "function") el.getAnimations().forEach(anim => anim.cancel());
  });
  const before = new Map(fields.map(el => [el, el.getBoundingClientRect()]));
  parent.insertBefore(placeholder, beforeNode || null);

  fields.forEach(el => {
    const from = before.get(el);
    const to = el.getBoundingClientRect();
    const dx = from.left - to.left;
    const dy = from.top - to.top;
    if ((dx || dy) && typeof el.animate === "function") {
      el.animate([
        { transform: `translate(${dx}px, ${dy}px)` },
        { transform: "translate(0, 0)" }
      ], { duration: 170, easing: "cubic-bezier(.2,.7,.2,1)" });
    }
  });
}

function positionFieldGhost(clientX, clientY) {
  const ghost = fieldDragState.ghostEl;
  if (!ghost) return;
  ghost.style.left = (clientX - fieldDragState.offsetX) + "px";
  ghost.style.top = (clientY - fieldDragState.offsetY) + "px";
}

// Las filas de medios y tercios ocupan todo el ancho, aunque sus campos no
// llenen todas las columnas. Convierte esos huecos horizontales en destinos
// reales para que no caigan por accidente en el fallback de fin de sección.
function updateFieldGridGapTarget(panel, form, hit, clientX) {
  const row = hit.closest(".row-2, .row-3");
  if (!row || !panel.contains(row)) return false;
  const fields = [...row.children].filter(el =>
    el !== fieldDragState.sourceEl && el.matches("[data-field]") &&
    el.getBoundingClientRect().width > 0);
  if (!fields.length) return false;

  const beforeEl = fields.find(el => {
    const rect = el.getBoundingClientRect();
    return clientX < rect.left + rect.width / 2;
  });
  const anchorEl = beforeEl || fields[fields.length - 1];
  const anchor = getField(form, anchorEl.dataset.field);
  if (!anchor) return false;
  const targetIndex = anchor.idx + (beforeEl ? 0 : 1);
  fieldDragState.targetSectionId = anchor.sec.id;
  fieldDragState.targetIndex = targetIndex;
  fieldDragState.placeholderEl.dataset.targetSection = anchor.sec.id;
  fieldDragState.placeholderEl.dataset.targetIndex = String(targetIndex);
  moveFieldPlaceholder(panel, row, beforeEl || null);
  return true;
}

function updateFieldPointerTarget(panel, form, clientX, clientY) {
  clearFieldDropTarget(panel);
  const hit = document.elementFromPoint(clientX, clientY);
  if (!hit || !panel.contains(hit)) return;

  const placeholder = hit.closest("[data-field-placeholder]");
  if (placeholder === fieldDragState.placeholderEl) {
    fieldDragState.targetSectionId = placeholder.dataset.targetSection || "";
    fieldDragState.targetIndex = Number(placeholder.dataset.targetIndex);
    return;
  }

  const targetEl = hit.closest("[data-field]");
  if (targetEl && panel.contains(targetEl)) {
    const target = getField(form, targetEl.dataset.field);
    if (!target) return;
    const rect = targetEl.getBoundingClientRect();
    const after = clientY >= rect.top + rect.height / 2;
    fieldDragState.targetSectionId = target.sec.id;
    fieldDragState.targetIndex = target.idx + (after ? 1 : 0);
    fieldDragState.placeholderEl.dataset.targetSection = target.sec.id;
    fieldDragState.placeholderEl.dataset.targetIndex = String(fieldDragState.targetIndex);
    moveFieldPlaceholder(panel, targetEl.parentNode, after ? targetEl.nextSibling : targetEl);
    return;
  }

  // Un gap entre columnas o a la derecha de una fila incompleta sigue siendo
  // parte de esa fila. Se resuelve antes que el contenedor de la sección.
  if (updateFieldGridGapTarget(panel, form, hit, clientX)) return;

  // Si el puntero está sobre el espacio libre de una sección, el destino
  // es el final de su array (también permite soltar en secciones vacías).
  const sectionEl = hit.closest("[data-section]");
  if (!sectionEl || !panel.contains(sectionEl)) return;
  const targetSec = getSection(form, sectionEl.dataset.section);
  if (!targetSec) return;
  fieldDragState.targetSectionId = targetSec.id;
  fieldDragState.targetIndex = targetSec.fields.length;
  fieldDragState.placeholderEl.dataset.targetSection = targetSec.id;
  fieldDragState.placeholderEl.dataset.targetIndex = String(targetSec.fields.length);
  const inner = sectionEl.querySelector(".form-section-body-inner");
  if (inner) moveFieldPlaceholder(panel, inner, null);
  sectionEl.classList.add("field-drop-at-end");
}

function wireFieldDragAndDrop(panel, form) {
  if (!fieldDragEnabled()) return;

  panel.querySelectorAll("[data-fld-drag]").forEach(handle => {
    handle.addEventListener("pointerdown", e => {
      if (e.button !== 0 || !fieldDragEnabled()) return;
      const sourceEl = handle.closest("[data-field]");
      if (!sourceEl) return;
      e.preventDefault();
      fieldDragState.fieldId = handle.dataset.fldDrag;
      fieldDragState.pointerId = e.pointerId;
      fieldDragState.sourceEl = sourceEl;
      fieldDragState.handleEl = handle;
      const source = getField(form, fieldDragState.fieldId);
      const rect = sourceEl.getBoundingClientRect();
      fieldDragState.targetSectionId = source ? source.sec.id : "";
      fieldDragState.targetIndex = source ? source.idx : -1;
      const placeholder = document.createElement("div");
      placeholder.className = "field field-drop-placeholder" + (sourceEl.classList.contains("span-2") ? " span-2" : "");
      placeholder.dataset.dropLabel = t("form.dropHere");
      placeholder.dataset.fieldPlaceholder = "";
      placeholder.dataset.targetSection = source ? source.sec.id : "";
      placeholder.dataset.targetIndex = source ? String(source.idx) : "-1";
      placeholder.style.minHeight = rect.height + "px";
      sourceEl.parentNode.insertBefore(placeholder, sourceEl);

      const ghost = sourceEl.cloneNode(true);
      ghost.removeAttribute("data-field");
      ghost.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
      ghost.classList.add("field-drag-ghost");
      ghost.dataset.dragLabel = t("form.dragging");
      ghost.style.width = rect.width + "px";
      ghost.style.height = rect.height + "px";
      document.body.appendChild(ghost);

      fieldDragState.placeholderEl = placeholder;
      fieldDragState.ghostEl = ghost;
      fieldDragState.offsetX = e.clientX - rect.left;
      fieldDragState.offsetY = e.clientY - rect.top;
      handle.classList.add("is-pressed");
      sourceEl.classList.add("field-drag-source");
      document.body.classList.add("field-pointer-dragging");
      positionFieldGhost(e.clientX, e.clientY);

      const finish = (event, commit) => {
        if (fieldDragState.pointerId !== event.pointerId) return;
        const fieldId = fieldDragState.fieldId;
        const targetSectionId = fieldDragState.targetSectionId;
        const targetIndex = fieldDragState.targetIndex;
        resetFieldPointerDrag(panel);
        if (commit && fieldId && targetSectionId && targetIndex >= 0) {
          reorderField(form, fieldId, targetSectionId, targetIndex);
        }
      };
      fieldDragState.moveHandler = event => {
        if (fieldDragState.pointerId !== event.pointerId) return;
        event.preventDefault();
        positionFieldGhost(event.clientX, event.clientY);
        updateFieldPointerTarget(panel, form, event.clientX, event.clientY);
      };
      fieldDragState.upHandler = event => finish(event, true);
      fieldDragState.cancelHandler = event => finish(event, false);
      document.addEventListener("pointermove", fieldDragState.moveHandler);
      document.addEventListener("pointerup", fieldDragState.upHandler);
      document.addEventListener("pointercancel", fieldDragState.cancelHandler);
    });
  });
}

function wireFormEvents(inst, form) {
  const panel = $("formPanel");

  // ---- Inputs normales: escribir solo actualiza el modelo; el
  //      trabajo pesado (validar, output, guardar) ocurre en blur. ----
  panel.querySelectorAll("[data-bind]").forEach(el => {
    const name = el.dataset.bind;
    // Las casillas sí/no guardan "yes" / "" para que RULES pueda usar
    // notEmpty / empty / equals yes sobre ellas.
    const readVal = () => el.type === "checkbox" ? (el.checked ? "yes" : "") : el.value;
    const syncModel = () => {
      inst.values[name] = readVal();
      clearDependents(form, name, inst, panel);
      markInstanceDirty(inst);
    };
    const commit = () => {
      revalidate(inst);
      renderOutput();
      renderMediaPanel();
      saveAll();
      setSaveIndicator("saved");
      // Si alguna condición mostró/ocultó/bloqueó campos, re-pintar.
      // Va al final: el usuario ya salió del campo, no roba el foco.
      rerenderIfRulesChanged(form, inst);
    };
    el.addEventListener("input", syncModel);
    el.addEventListener("blur", commit);
    el.addEventListener("change", () => { syncModel(); commit(); });
  });

  // Copia el valor crudo del campo, sin etiqueta, plantilla ni formato output.
  panel.querySelectorAll("[data-copy-field]").forEach(btn => btn.addEventListener("click", () => {
    const found = getField(form, btn.dataset.copyField);
    if (!found) return;
    copyToClipboard(templateValueForField(found.field, inst.values[found.field.id]));
  }));

  // ---- Autocompletes ----
  panel.querySelectorAll("input[data-ac]").forEach(input => {
    const found = getField(form, input.dataset.ac);
    if (found) wireAutocomplete(input, inst, found.field);
  });

  // ---- Palabras clave ----
  panel.querySelectorAll("[data-kw-chips]").forEach(chips => {
    wireKeywords(chips, inst);
  });

  // ---- Checklists ----
  panel.querySelectorAll("[data-ck-group]").forEach(group => {
    const fieldId = group.dataset.ckGroup;
    const found = getField(form, fieldId);
    const field = found && found.field;
    const opts = field ? checklistNormalOptions(field, inst) : [];
    const commit = () => {
      // El valor del campo es la lista de opciones marcadas, en el orden
      // en que están configuradas (no en el orden de los clicks).
      const allBox = group.querySelector("input[data-ck-all]");
      const allActive = !!(allBox && allBox.checked);
      const checked = allActive
        ? [checklistSpecialValue(field)]
        : [...group.querySelectorAll("input[data-ck]")].filter(cb => cb.checked).map(cb => cb.value);
      inst.values[fieldId] = checked;
      group.querySelectorAll("input[data-ck]").forEach(cb => { cb.disabled = allActive; });
      clearDependents(form, fieldId, inst, panel);
      markInstanceDirty(inst);
      revalidate(inst);
      renderOutput();
      renderMediaPanel();
      saveAll();
      setSaveIndicator("saved");
      rerenderIfRulesChanged(form, inst);
    };
    group.querySelectorAll("input[data-ck]").forEach(cb => cb.addEventListener("change", commit));
    const allBox = group.querySelector("input[data-ck-all]");
    if (allBox) allBox.addEventListener("change", () => {
      // La opción especial es exclusiva: bloquea y desmarca las normales.
      group.querySelectorAll("input[data-ck]").forEach(cb => {
        cb.checked = false;
        cb.disabled = allBox.checked;
      });
      commit();
    });
    const addBtn = group.querySelector("[data-ck-add]");
    const addInput = group.querySelector("[data-ck-add-input]");
    const closeAddInput = () => {
      if (!addInput) return;
      addInput.hidden = true;
      addInput.value = "";
      if (addBtn) addBtn.hidden = false;
    };
    const addValue = () => {
      if (!addInput) return;
      const value = addInput.value.trim();
      if (!value) { closeAddInput(); return; }
      if (!addChecklistOption(field, inst, value)) return;
      const arr = Array.isArray(inst.values[fieldId]) ? inst.values[fieldId] : [];
      if (!arr.some(item => String(item).toLowerCase() === value.toLowerCase())) arr.push(value);
      inst.values[fieldId] = arr;
      if (allBox) allBox.checked = false;
      markInstanceDirty(inst);
      revalidate(inst);
      renderOutput();
      renderMediaPanel();
      saveAll();
      setSaveIndicator("saved");
      renderForm();
    };
    if (addBtn && addInput) {
      addBtn.addEventListener("click", () => {
        addBtn.hidden = true;
        addInput.hidden = false;
        addInput.focus();
      });
      addInput.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); addValue(); }
        else if (e.key === "Escape") { e.preventDefault(); closeAddInput(); }
      });
      addInput.addEventListener("blur", () => setTimeout(() => {
        if (document.activeElement !== addInput) closeAddInput();
      }, 100));
    }
  });

  // ---- Controles del modo edición ----
  $("addSectionBtn").addEventListener("click", () => showSectionEditor(form, null));
  panel.querySelectorAll("[data-sec-add]").forEach(b => b.addEventListener("click", () =>
    showFieldEditor(form, getSection(form, b.dataset.secAdd), null)));
  panel.querySelectorAll("[data-sec-up]").forEach(b => b.addEventListener("click", () =>
    moveSection(form, b.dataset.secUp, -1)));
  panel.querySelectorAll("[data-sec-down]").forEach(b => b.addEventListener("click", () =>
    moveSection(form, b.dataset.secDown, +1)));
  panel.querySelectorAll("[data-sec-edit]").forEach(b => b.addEventListener("click", () =>
    showSectionEditor(form, getSection(form, b.dataset.secEdit))));
  panel.querySelectorAll("[data-sec-del]").forEach(b => b.addEventListener("click", () =>
    deleteSection(form, b.dataset.secDel)));
  panel.querySelectorAll("[data-fld-up]").forEach(b => b.addEventListener("click", () =>
    moveField(form, b.dataset.fldUp, -1)));
  panel.querySelectorAll("[data-fld-down]").forEach(b => b.addEventListener("click", () =>
    moveField(form, b.dataset.fldDown, +1)));
  panel.querySelectorAll("[data-fld-edit]").forEach(b => b.addEventListener("click", () => {
    const found = getField(form, b.dataset.fldEdit);
    if (found) showFieldEditor(form, found.sec, found.field);
  }));
  panel.querySelectorAll("[data-fld-del]").forEach(b => b.addEventListener("click", () =>
    deleteField(form, b.dataset.fldDel)));

  // Se conecta después de cada render, sobre los nodos de campo recién
  // creados. Al soltar se llama al mismo reorderField que usan ↑ y ↓.
  wireFieldDragAndDrop(panel, form);
}

// Si cambia el campo del que dependen otros (ej. mapa -> POIs),
// se limpian los dependientes sin re-pintar el formulario completo.
function clearDependents(form, name, inst, panel) {
  allFields(form).forEach(({ field }) => {
    const src = field.source || "";
    const cm = /^child:[^:]+:(.+)$/.exec(src);
    const dependsOnName = (cm && cm[1] === name) || src === "pois:" + name;
    if (dependsOnName) {
      inst.values[field.id] = field.type === "checklist" ? [] : "";
      const el = panel.querySelector(`[data-bind="${field.id}"]`);
      if (el) el.value = "";
      panel.querySelectorAll(`[data-ck="${field.id}"]`).forEach(cb => { cb.checked = false; });
    }
  });
}

/* MONOLITH:SECTION 07-form-rendering END */
/* MONOLITH:SECTION 08-field-widgets START */
/* ================================================================
   [8] WIDGETS: AUTOCOMPLETE Y PALABRAS CLAVE
   ================================================================
   El dropdown permite texto libre. Al final muestra "+ Agregar ..."
   para sumar el texto escrito a la lista (queda en DATA), y cada
   opción tiene una ✕ para borrarla definitivamente (con
   confirmación). */
// Ancestro scrolleable más cercano (el que recorta el dropdown). Ej.: el
// .form-panel (overflow-y:auto) o el panel de media.
function nearestScrollParent(el) {
  let p = el.parentElement;
  while (p && p !== document.body) {
    const oy = getComputedStyle(p).overflowY;
    if ((oy === "auto" || oy === "scroll") && p.scrollHeight > p.clientHeight) return p;
    p = p.parentElement;
  }
  return null;
}

// Decide si el dropdown abre hacia abajo (por defecto) o hacia arriba
// (clase drop-up) según el espacio disponible dentro del contenedor que lo
// recorta. Se llama con la lista ya visible para poder medir su alto real.
function positionAutocomplete(wrap, list) {
  wrap.classList.remove("drop-up");
  const rect = wrap.getBoundingClientRect();
  const sp = nearestScrollParent(wrap);
  const topBound = sp ? sp.getBoundingClientRect().top : 0;
  const bottomBound = sp ? sp.getBoundingClientRect().bottom : window.innerHeight;
  const listH = list.offsetHeight;
  const spaceBelow = bottomBound - rect.bottom;
  const spaceAbove = rect.top - topBound;
  // Solo abre hacia arriba si no cabe abajo y arriba hay más sitio.
  if (spaceBelow < listH && spaceAbove > spaceBelow) wrap.classList.add("drop-up");
}

function closeAutocomplete(wrap, input) {
  if (!wrap) return;
  wrap.classList.remove("open", "drop-up");
  const control = input || wrap.querySelector('[role="combobox"]');
  if (control) {
    control.setAttribute("aria-expanded", "false");
    control.removeAttribute("aria-activedescendant");
  }
}

function wireAutocomplete(input, inst, field) {
  const wrap = input.closest(".autocomplete");
  const list = wrap.querySelector(".autocomplete-list");
  const arrow = wrap.querySelector("[data-ac-toggle]");
  let activeIdx = -1;

  const renderList = (showAll) => {
    const all = optionsForField(field, inst);
    const q = input.value.trim().toLowerCase();
    let items = all;
    if (!showAll && q) items = all.filter(v => v.toLowerCase().includes(q));

    let html = "";
    if (!items.length) {
      html = `<div class="autocomplete-empty">${escapeHtml(t("widget.noMatches"))}</div>`;
    } else {
      const re = q ? new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig") : null;
      html = items.slice(0, 50).map((v, index) => {
        const marked = re ? escapeHtml(v).replace(re, "<mark>$1</mark>") : escapeHtml(v);
        return `<div class="autocomplete-item" id="${escapeHtml(list.id)}-option-${index}" role="option" aria-selected="false" data-v="${escapeHtml(v)}">
          <span>${marked}</span>
          <span class="ac-del" data-del="${escapeHtml(v)}" title="${escapeHtml(t("widget.deleteOptionTitle"))}">✕</span>
        </div>`;
      }).join("");
    }
    // Fila "+ Agregar" cuando lo escrito no existe tal cual en la lista
    const typed = input.value.trim();
    if (typed && !all.some(v => v.toLowerCase() === typed.toLowerCase())) {
      html += `<div class="autocomplete-add" data-add="${escapeHtml(typed)}">${escapeHtml(t("widget.addToList", { value: typed }))}</div>`;
    }
    list.innerHTML = html;

    list.querySelectorAll(".autocomplete-item").forEach(it => {
      it.addEventListener("mousedown", (e) => {
        if (e.target.closest(".ac-del")) return; // la ✕ tiene su propio handler
        e.preventDefault();
        input.value = it.dataset.v;
        input.dispatchEvent(new Event("input"));
        closeAutocomplete(wrap, input);
      });
    });
    list.querySelectorAll(".ac-del").forEach(x => {
      x.addEventListener("mousedown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        confirmDeleteOption(field, inst, x.dataset.del, () => renderList(showAll));
      });
    });
    const addEl = list.querySelector(".autocomplete-add");
    if (addEl) {
      addEl.addEventListener("mousedown", (e) => {
        e.preventDefault();
        addOptionToSource(field, inst, addEl.dataset.add);
        input.value = addEl.dataset.add;
        input.dispatchEvent(new Event("input"));
        closeAutocomplete(wrap, input);
      });
    }
    activeIdx = -1;
    wrap.classList.add("open");
    input.setAttribute("aria-expanded", "true");
    positionAutocomplete(wrap, list);
  };

  if (arrow) {
    arrow.addEventListener("mousedown", (e) => {
      e.preventDefault();
        if (wrap.classList.contains("open")) {
          closeAutocomplete(wrap, input);
        }
      // Enfoca PRIMERO: focus dispara renderList(false) (filtrado por el
      // texto ya escrito); luego renderList(true) lo sobrescribe con TODAS
      // las opciones. Si se invierte el orden, el focus re-filtra y el
      // dropdown se abre incompleto la primera vez (bug de la flecha).
      else { input.focus(); renderList(true); }
    });
  }
  input.addEventListener("focus", () => renderList(false));
  input.addEventListener("input", () => renderList(false));
  input.addEventListener("blur", () => setTimeout(() => {
    closeAutocomplete(wrap, input);
    activeIdx = -1;
  }, 150));

  input.addEventListener("keydown", (e) => {
    let items = list.querySelectorAll(".autocomplete-item");
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (!wrap.classList.contains("open")) {
        renderList(false);
        items = list.querySelectorAll(".autocomplete-item"); // la lista se re-pintó
      }
      activeIdx = Math.min(items.length - 1, activeIdx + 1);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIdx = Math.max(0, activeIdx - 1);
    } else if (e.key === "Enter" && wrap.classList.contains("open") && activeIdx >= 0 && items[activeIdx]) {
      e.preventDefault();
      input.value = items[activeIdx].dataset.v;
      input.dispatchEvent(new Event("input"));
      closeAutocomplete(wrap, input);
      activeIdx = -1;
      return;
    } else if (e.key === "Escape") {
      closeAutocomplete(wrap, input);
      activeIdx = -1;
      return;
    } else {
      return;
    }
    items.forEach((it, i) => {
      const active = i === activeIdx;
      it.classList.toggle("active", active);
      it.setAttribute("aria-selected", String(active));
    });
    if (activeIdx >= 0 && items[activeIdx]) input.setAttribute("aria-activedescendant", items[activeIdx].id);
    // Desplaza SOLO dentro del propio dropdown (no la página): así navegar
    // con las flechas nunca mueve el resto del layout.
    if (activeIdx >= 0 && items[activeIdx]) {
      const it = items[activeIdx];
      if (it.offsetTop < list.scrollTop) list.scrollTop = it.offsetTop;
      else if (it.offsetTop + it.offsetHeight > list.scrollTop + list.clientHeight)
        list.scrollTop = it.offsetTop + it.offsetHeight - list.clientHeight;
    }
  });
}

// Interpreta la fuente de un campo: { kind, link?, parentField? }.
// kind: "child" (lista dependiente) o "list" (raíz / plana). Ya no hay "parent":
// una lista raíz se referencia por su id a secas. `parent:`/`maps`/`pois:` se
// aceptan solo como legacy (CSV viejo sin migrar).
function parseSource(src) {
  src = src || "";
  let m;
  if ((m = /^child:([^:]+):(.+)$/.exec(src))) return { kind: "child", link: m[1], parentField: m[2] };
  if ((m = /^parent:(.+)$/.exec(src))) return { kind: "list", list: m[1] };
  if (src === "maps") return { kind: "list", list: "map" };
  if ((m = /^pois:(.+)$/.exec(src))) return { kind: "child", link: "poi", parentField: m[1] };
  return { kind: "list", list: src };
}

// Agrega un valor a la fuente del campo (raíz o dependiente).
function addOptionToSource(field, inst, value) {
  value = String(value == null ? "" : value).trim();
  if (!value) return false;
  const s = parseSource(field.source);
  if (s.kind === "child") {
    const c = config.data.childLists[s.link];
    if (!c) return false;
    const form = getForm(inst.formId);
    const parentFound = form && getField(form, s.parentField);
    const parents = dependentParentValues(parentFound && parentFound.field,
      inst.values[s.parentField], c);
    if (parents.length !== 1) {
      flashBanner(t("widget.chooseOneParent", { list: configuredText(listLabel(c.parent)).toLowerCase() }), true);
      return false;
    }
    const pv = parents[0];
    c.values[pv] = c.values[pv] || [];
    if (!c.values[pv].some(item => String(item).toLowerCase() === value.toLowerCase())) {
      c.values[pv].push(value);
    }
  } else {
    config.data.lists[s.list] = config.data.lists[s.list] || [];
    if (!config.data.lists[s.list].some(item => String(item).toLowerCase() === value.toLowerCase())) {
      config.data.lists[s.list].push(value);
    }
  }
  scheduleSave();
  flashBanner(t("widget.optionAdded", { value }));
  return true;
}

// Añade una opción desde un checklist. Cuando hay fuente DATA, se comporta
// igual que el dropdown: la agrega a la lista raíz o al bucket dependiente.
// Sin fuente, queda como opción adicional de esta instancia.
function addChecklistOption(field, inst, value) {
  value = String(value == null ? "" : value).trim();
  if (!value) return false;
  if (field.source) return addOptionToSource(field, inst, value);
  inst.checklistExtras = inst.checklistExtras || {};
  const extra = inst.checklistExtras[field.id] = inst.checklistExtras[field.id] || [];
  if (!extra.some(item => String(item).toLowerCase() === value.toLowerCase())) extra.push(value);
  return true;
}

function confirmDeleteOption(field, inst, value, after) {
  const s = parseSource(field.source);
  const listName = s.kind === "child" ? listLabel(s.link) : listLabel(s.list);
  showConfirmModal({
    title: t("widget.deleteOption"),
    body: t("widget.deleteOptionBody", {
      value: escapeHtml(value), list: escapeHtml(configuredText(listName))
    }),
    confirmText: t("common.delete"),
    confirmClass: "danger",
    onConfirm: () => {
      if (s.kind === "child") {
        const c = config.data.childLists[s.link];
        const pv = String(inst.values[s.parentField] || "");
        if (c && c.values[pv]) c.values[pv] = c.values[pv].filter(v => v !== value);
      } else if (config.data.lists[s.list]) {
        config.data.lists[s.list] = config.data.lists[s.list].filter(v => v !== value);
      }
      scheduleSave();
      if (after) after();
    }
  });
}

// Chips problemáticas de un campo de palabras clave: duplicadas o (con
// kwOverlap) presentes en el cuerpo del bug. Se pintan en rojo para verlas
// TODAS de un vistazo, no solo la primera.
function keywordBadSet(inst, field) {
  const arr = Array.isArray(inst.values[field.id]) ? inst.values[field.id] : [];
  const bad = new Set();
  const seen = new Set();
  arr.forEach(k => {
    const lk = String(k).toLowerCase();
    if (seen.has(lk)) bad.add(k);
    seen.add(lk);
  });
  if (field.kwOverlap) {
    const form = getForm(inst.formId);
    if (form) {
      const bodyText = allFields(form)
        .filter(({ field: f }) => f.type === "text" || f.type === "textarea")
        .map(({ field: f }) => String(inst.values[f.id] || ""))
        .join(" ").toLowerCase();
      arr.forEach(k => { if (bodyText.includes(String(k).toLowerCase())) bad.add(k); });
    }
  }
  return bad;
}

// Markup interno del widget de chips (chips + input). Compartido entre el
// render del formulario (fieldHtml) y el refresh in situ de wireKeywords.
function kwChipsInnerHtml(fieldId, kws, inputCls, inputDis, badSet, splitOnSpace) {
  return kws.map(k =>
    `<span class="chip${badSet && badSet.has(k) ? " chip-bad" : ""}" data-kw-chip="${escapeHtml(k)}"><span data-kw-chip-text>${escapeHtml(k)}</span><button data-kw-remove="${escapeHtml(k)}" title="${escapeHtml(t("common.remove"))}">×</button></span>`
  ).join("")
  + `<input id="field-${escapeHtml(fieldId)}" type="text" class="${inputCls || ""}" data-kw-input="${escapeHtml(fieldId)}" placeholder="${escapeHtml(t(splitOnSpace ? "widget.keywordsSpace" : "widget.keywordsEnter"))}" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="kwlist-${escapeHtml(fieldId)}"${inputDis || ""} />`
  + `<div class="autocomplete-list" id="kwlist-${escapeHtml(fieldId)}" role="listbox" data-kw-list="${escapeHtml(fieldId)}"></div>`;
}

function wireKeywords(chips, inst) {
  const fieldId = chips.dataset.kwChips;
  const kwForm = getForm(inst.formId);
  const kwFound = kwForm && getField(kwForm, fieldId);
  const fieldDef = kwFound && kwFound.field;
  const getInput = () => chips.querySelector("[data-kw-input]");
  const getList = () => chips.querySelector("[data-kw-list]");
  let activeIdx = -1;

  const refresh = (focus) => {
    const oldInput = getInput();
    const cur = oldInput ? oldInput.value : "";
    chips.innerHTML = kwChipsInnerHtml(fieldId, inst.values[fieldId] || [], "", "",
      fieldDef ? keywordBadSet(inst, fieldDef) : null, fieldDef && fieldDef.kwSpace);
    const inp = getInput();
    inp.value = cur;
    wireInput();
    bindRemoves();
    bindChipEdits();
    if (focus) inp.focus();
  };
  // Cambió la lista de chips: valida, regenera el output y re-pinta.
  const commit = (focus) => {
    markInstanceDirty(inst);
    revalidate(inst);
    renderOutput();
    refresh(focus);
    saveAll();
  };
  const bindRemoves = () => {
    chips.querySelectorAll("[data-kw-remove]").forEach(btn => {
      btn.addEventListener("click", () => {
        inst.values[fieldId] = (inst.values[fieldId] || []).filter(k => k !== btn.dataset.kwRemove);
        commit(true);
      });
    });
  };
  const commitInput = value => {
    const v = String(value || "").trim();
    const arr = inst.values[fieldId] || [];
    if (!v) return false;
    if (!arr.some(item => String(item).toLowerCase() === v.toLowerCase())) {
      arr.push(v);
      inst.values[fieldId] = arr;
      // El texto confirmado ya vive en el chip; no debe reaparecer en el
      // input reconstruido ni quedar expuesto al Backspace siguiente.
      getInput().value = "";
      commit(true);
      return true;
    }
    getInput().value = "";
    return false;
  };
  const renderList = showAll => {
    const list = getList();
    const input = getInput();
    if (!list || !input || !fieldDef || !fieldDef.source) return;
    const all = optionsForField(fieldDef, inst);
    const q = input.value.trim().toLowerCase();
    const items = !showAll && q ? all.filter(value => String(value).toLowerCase().includes(q)) : all;
    if (!items.length) {
      list.innerHTML = `<div class="autocomplete-empty">${escapeHtml(t("widget.noMatches"))}</div>`;
    } else {
      const re = q ? new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig") : null;
      list.innerHTML = items.slice(0, 50).map((value, index) => {
        const marked = re ? escapeHtml(value).replace(re, "<mark>$1</mark>") : escapeHtml(value);
        // Un solo hijo evita que el flex de .autocomplete-item distribuya
        // a distancia los fragmentos que crea <mark> al buscar.
        return `<div class="autocomplete-item" id="${escapeHtml(list.id)}-option-${index}" role="option" aria-selected="false" data-kw-option="${escapeHtml(value)}">
          <span>${marked}</span>
          <span class="ac-del" data-kw-del="${escapeHtml(value)}" title="${escapeHtml(t("widget.deleteOptionTitle"))}">✕</span>
        </div>`;
      }).join("");
    }
    // Crear un chip libre sigue disponible con Enter. Esta acción explícita
    // además incorpora el texto a DATA para reutilizarlo como sugerencia.
    const typed = input.value.trim();
    if (typed && !all.some(value => String(value).toLowerCase() === typed.toLowerCase())) {
      list.innerHTML += `<div class="autocomplete-add" data-kw-add="${escapeHtml(typed)}">${escapeHtml(t("widget.addToList", { value: typed }))}</div>`;
    }
    list.querySelectorAll("[data-kw-option]").forEach(item => item.addEventListener("mousedown", e => {
      if (e.target.closest("[data-kw-del]")) return;
      e.preventDefault();
      getInput().value = item.dataset.kwOption;
      commitInput(item.dataset.kwOption);
      closeAutocomplete(chips, getInput());
    }));
    list.querySelectorAll("[data-kw-del]").forEach(button => button.addEventListener("mousedown", e => {
      e.preventDefault();
      e.stopPropagation();
      confirmDeleteOption(fieldDef, inst, button.dataset.kwDel, () => renderList(showAll));
    }));
    const add = list.querySelector("[data-kw-add]");
    if (add) add.addEventListener("mousedown", e => {
      e.preventDefault();
      if (!addOptionToSource(fieldDef, inst, add.dataset.kwAdd)) return;
      getInput().value = add.dataset.kwAdd;
      commitInput(add.dataset.kwAdd);
      closeAutocomplete(chips, getInput());
    });
    activeIdx = -1;
    chips.classList.add("open");
    input.setAttribute("aria-expanded", "true");
    positionAutocomplete(chips, list);
  };
  const keyHandler = e => {
    const inp = getInput();
    const isSpaceCommit = e.key === " " && fieldDef && fieldDef.kwSpace;
    if (e.key === "Enter" || e.key === "," || isSpaceCommit) {
      e.preventDefault();
      const choices = getList().querySelectorAll("[data-kw-option]");
      if (e.key === "Enter" && chips.classList.contains("open") && activeIdx >= 0 && choices[activeIdx]) {
        inp.value = choices[activeIdx].dataset.kwOption;
        commitInput(inp.value);
      } else {
        commitInput(inp.value);
      }
      closeAutocomplete(chips, getInput());
    } else if (e.key === "Backspace" && !inp.value && (inst.values[fieldId] || []).length) {
      inst.values[fieldId].pop();
      commit(true);
    } else if (e.key === "ArrowDown" && fieldDef && fieldDef.source) {
      e.preventDefault();
      if (!chips.classList.contains("open")) renderList(false);
      const choices = getList().querySelectorAll("[data-kw-option]");
      activeIdx = Math.min(choices.length - 1, activeIdx + 1);
      choices.forEach((item, index) => {
        const active = index === activeIdx;
        item.classList.toggle("active", active);
        item.setAttribute("aria-selected", String(active));
      });
      if (activeIdx >= 0 && choices[activeIdx]) inp.setAttribute("aria-activedescendant", choices[activeIdx].id);
    } else if (e.key === "ArrowUp" && chips.classList.contains("open")) {
      e.preventDefault();
      const choices = getList().querySelectorAll("[data-kw-option]");
      activeIdx = Math.max(0, activeIdx - 1);
      choices.forEach((item, index) => {
        const active = index === activeIdx;
        item.classList.toggle("active", active);
        item.setAttribute("aria-selected", String(active));
      });
      if (activeIdx >= 0 && choices[activeIdx]) inp.setAttribute("aria-activedescendant", choices[activeIdx].id);
    } else if (e.key === "Escape") {
      closeAutocomplete(chips, inp);
      activeIdx = -1;
    }
  };
  const wireInput = () => {
    const inp = getInput();
    inp.addEventListener("keydown", keyHandler);
    if (fieldDef && fieldDef.source) {
      inp.addEventListener("focus", () => renderList(false));
      inp.addEventListener("input", () => renderList(false));
      inp.addEventListener("blur", () => setTimeout(() => closeAutocomplete(chips, getInput()), 150));
    }
  };
  const bindChipEdits = () => {
    chips.querySelectorAll("[data-kw-chip]").forEach(chip => chip.addEventListener("dblclick", e => {
      if (e.target.closest("[data-kw-remove]")) return;
      const original = chip.dataset.kwChip;
      chip.innerHTML = `<input type="text" data-kw-chip-edit value="${escapeHtml(original)}" aria-label="${escapeHtml(t("widget.editChip"))}" />`;
      const edit = chip.querySelector("[data-kw-chip-edit]");
      let cancelled = false;
      const finish = () => {
        if (cancelled) { refresh(false); return; }
        const value = edit.value.trim();
        const arr = inst.values[fieldId] || [];
        const index = arr.indexOf(original);
        if (!value) { if (index >= 0) arr.splice(index, 1); }
        else if (index >= 0 && !arr.some((item, i) => i !== index && String(item).toLowerCase() === value.toLowerCase())) arr[index] = value;
        inst.values[fieldId] = arr;
        commit(false);
      };
      edit.addEventListener("keydown", event => {
        if (event.key === "Enter") { event.preventDefault(); finish(); }
        else if (event.key === "Escape") { event.preventDefault(); cancelled = true; edit.blur(); }
      });
      edit.addEventListener("blur", finish, { once: true });
      edit.focus();
      edit.select();
    }));
  };

  chips.addEventListener("click", (e) => {
    if (e.target === chips) getInput().focus();
  });
  wireInput();
  bindRemoves();
  bindChipEdits();
}

/* ================================================================
   [9] EDICIÓN DE SCHEMA: SECCIONES Y CAMPOS
   ================================================================ */
function moveSection(form, secId, dir) {
  const idx = form.sections.findIndex(s => s.id === secId);
  const to = idx + dir;
  if (idx < 0 || to < 0 || to >= form.sections.length) return;
  const [sec] = form.sections.splice(idx, 1);
  form.sections.splice(to, 0, sec);
  renderForm();
  scheduleSave();
}

// Mutación única de orden para botones y drag-and-drop. targetIndex es una
// posición de inserción en el array destino antes de retirar el campo origen.
// La posición en section.fields es el índice canónico; no hay un segundo
// atributo order que pueda quedar desincronizado.
function reorderField(form, fieldId, targetSectionId, targetIndex) {
  const found = getField(form, fieldId);
  const targetSec = getSection(form, targetSectionId);
  if (!found || !targetSec) return false;
  const { sec, idx } = found;
  const requestedIndex = Number(targetIndex);
  if (!Number.isInteger(requestedIndex)) return false;
  let to = Math.max(0, Math.min(requestedIndex, targetSec.fields.length));
  if (sec === targetSec && idx < to) to--;
  if (sec === targetSec && idx === to) return false;
  const [field] = sec.fields.splice(idx, 1);
  targetSec.fields.splice(to, 0, field);
  renderForm();
  scheduleSave();
  return true;
}

// Mueve el campo dentro de su sección; en los bordes salta a la
// sección vecina, así el orden del output es totalmente libre.
function moveField(form, fieldId, dir) {
  const found = getField(form, fieldId);
  if (!found) return;
  const { sec, idx } = found;
  const to = idx + dir;
  if (to >= 0 && to < sec.fields.length) {
    // Al bajar, la posición de inserción está después del vecino.
    reorderField(form, fieldId, sec.id, dir > 0 ? to + 1 : to);
    return;
  }
  const sIdx = form.sections.indexOf(sec);
  const neighbor = form.sections[sIdx + dir];
  if (!neighbor) return;
  reorderField(form, fieldId, neighbor.id, dir < 0 ? neighbor.fields.length : 0);
}

// Referencias de campo usadas realmente por una expresión, incluyendo el
// operando derecho campo-a-campo y las @reglas booleanas que ésta reutiliza.
function expressionAllFieldRefs(src, seenRules) {
  const refs = new Set();
  const seen = seenRules || new Set();
  const walk = (node) => {
    if (!node) return;
    if (node.type === "cmp") {
      refs.add(node.field);
      const o = node.operand;
      if (o && o.kind === "word" && anyFieldHasId(o.v)) refs.add(o.v);
    } else if (node.type === "not") {
      walk(node.item);
    } else if (node.type === "or" || node.type === "and") {
      node.items.forEach(walk);
    } else if (node.type === "ref" && !seen.has(node.name)) {
      seen.add(node.name);
      const nested = config.data.rules[node.name];
      if (nested != null) {
        try { walk(parseExpr(String(nested))); } catch (e) {}
      }
    }
  };
  try { walk(parseExpr(String(src || ""))); } catch (e) {}
  return [...refs];
}

// Las dobles llaves preservan un placeholder literalmente: {{campo}} sale
// como {campo}. El parser se comparte entre el editor, las dependencias al
// borrar y el generador de output para que todos entiendan la misma sintaxis.
function protectedTemplateText(text) {
  return String(text || "").replace(/\{\{/g, "\uE000").replace(/\}\}/g, "\uE001");
}

function templatePlaceholders(text) {
  const refs = [];
  protectedTemplateText(text).replace(/\{([A-Za-z0-9_.:-]+)\}/g, (m, id) => {
    refs.push(id);
    return m;
  });
  return refs;
}

function templateFieldRefs(text) {
  return [...new Set(templatePlaceholders(text).filter(id =>
    id !== "value" && !id.startsWith("media:")))];
}

function templateMediaRefs(text) {
  return [...new Set(templatePlaceholders(text).filter(id => id.startsWith("media:")))];
}

function templateReferenceErrors(text, form, ownId) {
  const fieldIds = new Set(allFields(form)
    .filter(({ field }) => field.type !== "mirror")
    .map(({ field }) => field.id));
  if (ownId) fieldIds.add(ownId);
  const unknownFields = templateFieldRefs(text).filter(id => !fieldIds.has(id));
  const invalidMedia = templateMediaRefs(text)
    .filter(id => !/^media:media[1-9]\d*$/.test(id));
  const errors = [];
  if (unknownFields.length) errors.push(t("template.unknownFields", {
    fields: unknownFields.map(id => "{" + id + "}").join(", ")
  }));
  if (invalidMedia.length) errors.push(t("template.invalidMedia", {
    media: invalidMedia.map(id => "{" + id + "}").join(", ")
  }));
  return errors;
}

function fieldRemovalImpact(form, initialIds) {
  const removedIds = new Set(initialIds);

  // Una salida compuesta sin alguno de sus campos de origen no tiene utilidad:
  // se elimina junto con la referencia rota. Los campos editables se conservan
  // para que el usuario pueda reconfigurar su plantilla explícitamente.
  let added;
  do {
    added = false;
    allFields(form).forEach(({ field }) => {
      const refs = templateFieldRefs(field.template).concat(templateFieldRefs(field.perLineHeader));
      if (field.type === "mirror" &&
          (removedIds.has(field.source) || refs.some(id => removedIds.has(id))) &&
          !removedIds.has(field.id)) {
        removedIds.add(field.id);
        added = true;
      }
    });
  } while (added);

  const referencesRemoved = (ids) => ids.some(id => removedIds.has(id));
  const rules = getFormRules(form).filter(rule => {
    const refs = typeof rule.whenExpr === "string"
      ? expressionAllFieldRefs(rule.whenExpr)
      : [
          rule.when && rule.when.field,
          rule.when && ["equalsField", "notEqualsField"].includes(rule.when.op) ? rule.when.value : ""
        ].filter(Boolean);
    if (rule.then && rule.then.field) refs.push(rule.then.field);
    return referencesRemoved(refs);
  });
  const tiles = getFormTiles(form).filter(tile => referencesRemoved([
    ...expressionAllFieldRefs(tile.whenExpr || ""),
    ...templateFieldRefs(tile.text),
    ...templateFieldRefs(tile.message),
    tile.field
  ].filter(Boolean)));
  const dependents = allFields(form).filter(({ field }) => {
    if (removedIds.has(field.id) || field.type === "mirror") return false;
    const src = String(field.source || "");
    const match = /^child:[^:]+:(.+)$/.exec(src) || /^pois:(.+)$/.exec(src);
    return !!(match && removedIds.has(match[1]));
  }).map(x => x.field);
  const mirrors = allFields(form).filter(({ field }) =>
    field.type === "mirror" && removedIds.has(field.id) && !initialIds.includes(field.id)
  ).map(x => x.field);
  const templates = allFields(form).filter(({ field }) => {
    if (removedIds.has(field.id) || field.type === "mirror" || field.type === "checkbox") return false;
    const refs = templateFieldRefs(field.template).concat(templateFieldRefs(field.perLineHeader));
    return refs.some(id => removedIds.has(id));
  }).map(x => x.field);

  return { removedIds, rules, tiles, dependents, mirrors, templates };
}

function applyFieldRemoval(form, impact) {
  form.sections.forEach(sec => {
    sec.fields = sec.fields.filter(field => !impact.removedIds.has(field.id));
  });
  const removedRules = new Set(impact.rules);
  const removedTiles = new Set(impact.tiles);
  form.rules = getFormRules(form).filter(rule => !removedRules.has(rule));
  form.tiles = getFormTiles(form).filter(tile => !removedTiles.has(tile));

  // El campo dependiente se conserva para que pueda reconfigurarse, pero deja
  // de apuntar al id borrado y pierde cualquier selección derivada del padre.
  const dependentIds = new Set(impact.dependents.map(field => field.id));
  impact.dependents.forEach(field => delete field.source);
  state.instances.filter(inst => inst.formId === form.id).forEach(inst => {
    impact.removedIds.forEach(id => {
      delete inst.values[id];
      delete inst.errors[id];
    });
    dependentIds.forEach(id => {
      inst.values[id] = "";
      delete inst.errors[id];
    });
    revalidate(inst, false);
    markInstanceDirty(inst);
  });
}

function fieldRemovalWarning(impact) {
  const parts = [];
  if (impact.rules.length) parts.push(t("schema.impact.conditions", { count: impact.rules.length }));
  if (impact.tiles.length) parts.push(t("schema.impact.tiles", { count: impact.tiles.length }));
  if (impact.mirrors.length) parts.push(t("schema.impact.mirrors", { count: impact.mirrors.length }));
  if (impact.dependents.length) parts.push(t("schema.impact.dependents", { count: impact.dependents.length }));
  const cleaned = parts.length
    ? t("schema.cleanup", { items: parts.join(", ") }) : "";
  const templates = impact.templates.length
    ? t("schema.reconfigure", { count: impact.templates.length }) : "";
  return cleaned + templates;
}

function deleteField(form, fieldId) {
  const found = getField(form, fieldId);
  if (!found) return;
  const impact = fieldRemovalImpact(form, [fieldId]);
  showConfirmModal({
    title: t("schema.deleteField"),
    body: t("schema.deleteFieldBody", {
      field: escapeHtml(configuredText(found.field.label)), details: fieldRemovalWarning(impact)
    }),
    confirmText: t("common.delete"),
    confirmClass: "danger",
    onConfirm: () => {
      applyFieldRemoval(form, impact);
      renderForm();
      scheduleSave();
    }
  });
}

function deleteSection(form, secId) {
  const sec = getSection(form, secId);
  if (!sec) return;
  const fieldIds = sec.fields.map(field => field.id);
  const impact = fieldRemovalImpact(form, fieldIds);
  showConfirmModal({
    title: t("schema.deleteSection"),
    body: t("schema.deleteSectionBody", {
      section: escapeHtml(configuredText(sec.label)), count: sec.fields.length,
      details: fieldRemovalWarning(impact)
    }),
    confirmText: t("schema.deleteAll"),
    confirmClass: "danger",
    onConfirm: () => {
      applyFieldRemoval(form, impact);
      form.sections = form.sections.filter(s => s.id !== secId);
      renderForm();
      scheduleSave();
    }
  });
}

function uniqueFieldId(form, base) {
  let id = base, n = 2;
  while (getField(form, id)) { id = base + n; n++; }
  return id;
}

function uniqueSectionId(form, base) {
  let id = base, n = 2;
  while (getSection(form, id)) { id = base + n; n++; }
  return id;
}

// ---- Editor de sección (crear o modificar) ----
function showSectionEditor(form, sec) {
  const isNew = !sec;
  const s = sec || { label: "", mode: "lines", heading: "", sep: " - ", noGap: false };
  const body = `
    <div class="fe-grid">
      <div class="fe-full">
        <label>${escapeHtml(t("schema.sectionName"))}</label>
        <input type="text" id="se_label" value="${escapeHtml(s.label)}" />
      </div>
      <div>
        <label>${escapeHtml(t("schema.outputMode"))}</label>
        <select id="se_mode">
          <option value="lines"${s.mode !== "joined" ? " selected" : ""}>${escapeHtml(t("schema.modeLines"))}</option>
          <option value="joined"${s.mode === "joined" ? " selected" : ""}>${escapeHtml(t("schema.modeJoined"))}</option>
        </select>
        <div class="field-help">${escapeHtml(t("schema.modeHelp"))}</div>
      </div>
      <div>
        <label>${escapeHtml(t("schema.joinSeparator"))}</label>
        <input type="text" id="se_sep" value="${escapeHtml(s.sep != null ? s.sep : " - ")}" />
        <div class="field-help">${escapeHtml(t("schema.separatorHelp"))}</div>
      </div>
      <div class="fe-full">
        <label>${escapeHtml(t("schema.outputHeading"))}</label>
        <input type="text" id="se_heading" value="${escapeHtml(s.heading || "")}" />
        <div class="field-help">${escapeHtml(t("schema.headingHelp"))}</div>
      </div>
      <label class="checkbox fe-full"><input type="checkbox" id="se_nogap"${s.noGap ? " checked" : ""} /> ${escapeHtml(t("schema.noGap"))}</label>
    </div>`;
  showEditorModal({
    title: isNew ? t("schema.newSection") : t("schema.editSection", { section: configuredText(s.label) }),
    bodyHtml: body,
    onConfirm: () => {
      const label = $("se_label").value.trim();
      if (!label) { flashBanner(t("schema.sectionNameRequired"), true); return false; }
      const target = isNew
        ? { id: uniqueSectionId(form, slugify(label)), label: "", mode: "lines", fields: [] }
        : sec;
      target.label = label;
      target.mode = $("se_mode").value;
      target.heading = $("se_heading").value;
      target.sep = $("se_sep").value;
      target.noGap = $("se_nogap").checked;
      if (!target.heading) delete target.heading;
      if (!target.noGap) delete target.noGap;
      if (isNew) form.sections.push(target);
      renderForm();
      scheduleSave();
      return true;
    }
  });
}

      <div data-cbhide data-ckhide style="display:flex;align-items:end;">
        <label class="checkbox"><input type="checkbox" id="fe_kwOverlap"${f.kwOverlap ? " checked" : ""} /> ${escapeHtml(t("schema.field.keywordOverlap"))}</label>

            placeholder="${escapeHtml(t("schema.field.errorConditionPlaceholder"))}"${condRuleAmbiguous ? " disabled" : ""} />
          <div class="autocomplete-list"></div>
        </div>
        <div class="cond-err" id="fe_condErr"></div>
        <div class="field-help">${escapeHtml(t(condRuleAmbiguous ? "schema.field.errorConditionAmbiguous" : "schema.field.errorConditionHelp"))}</div>

        <label for="fe_condMsg">${escapeHtml(t("schema.field.conditionMessage"))}</label>

  showEditorModal({
    title: isNew
      ? t("schema.field.newTitle", { section: configuredText(sec.label) })
      : t("schema.field.editTitle", { field: configuredText(f.label) }),
    bodyHtml: body,
    wide: true,
    onOpen: () => {
      // La fuente depende del tipo: listas para dropdown/checklist/chips y un
      // valor principal opcional para la salida compuesta ({value}).
      const typeSel = $("fe_type");
      const srcSel = $("fe_source");
      const formatSel = $("fe_format");
      const labelInp = $("fe_label");

      .sub { font: 400 20px Arial, sans-serif; fill:#486581; }
      .group { font: 800 21px Arial, sans-serif; letter-spacing:1px; fill:#fff; }
      .node { font: 700 20px Arial, sans-serif; fill:#132f4c; }
      .small { font: 400 16px Arial, sans-serif; fill:#486581; }
      .note { font: 600 16px Arial, sans-serif; fill:#334e68; }
      .flow { fill:none; stroke:#64748b; stroke-width:3.3; marker-end:url(#arrow); opacity:.9; }
      .thin { fill:none; stroke:#94a3b8; stroke-width:2.4; stroke-dasharray:8 7; marker-end:url(#arrow); }
      .card { stroke-width:2; filter:url(#shadow); }
    </style>
  </defs>
